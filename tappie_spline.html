function syncIndex(percent){if(!indexReady)return;try{const win=frame.contentWindow,vh=frame.clientHeight,max=Math.max(indexSection.offsetHeight-vh,1),y=indexSection.offsetTop+max*clamp(percent/100,0,1);win.scrollTo(0,y)}catch(e){}}
function renderBridge(q,finalFrame){if(!indexReady||!indexBridge||!indexPhone)return;const sr=indexStage.getBoundingClientRect(),pr=indexPhone.getBoundingClientRect();const startX=sr.width/2+finalFrame.x/100*sr.width,startY=sr.height/2+finalFrame.y/100*sr.height;const endX=pr.left-sr.left+pr.width/2,endY=pr.top-sr.top+pr.height*.48;const baseW=Math.min(device==='mobile'?sr.width*.78:sr.width*.31,device==='mobile'?350:340),targetW=pr.width*.72,targetScale=targetW/baseW;const x=lerp(startX,endX,q),y=lerp(startY,endY,q),sc=lerp(finalFrame.scale,targetScale,q),rx=lerp(finalFrame.rotX,0,q),ry=lerp(finalFrame.rotY,0,q),rz=lerp(finalFrame.rotZ,0,q);indexBridge.style.left=x+'px';indexBridge.style.top=y+'px';indexBridge.style.transform=`translate(-50%,-50%) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${sc})`;indexBridge.style.opacity=String(1-q*.92)}
function render(p){applyIndexTweaks();const s=project.segments.storyEnd,h=project.segments.handoffEnd,f=sample(Math.min(p,s));if(p<s){story.style.opacity=1;story.style.visibility='visible';day.style.opacity=0;day.style.visibility='hidden';cardStage.style.opacity=f.opacity;renderTexts(p);applyCard(f)}else if(p<h){const q=ease((p-s)/(h-s),'easeInOut');story.style.visibility='visible';day.style.visibility='visible';story.style.opacity=1-q;day.style.opacity=q;renderTexts(s-.01);applyCard(f);cardStage.style.opacity=1-q;syncIndex(0);renderBridge(q,f)}else{story.style.opacity=0;story.style.visibility='hidden';day.style.opacity=1;day.style.visibility='visible';cardStage.style.opacity=0;syncIndex((p-h)/(100-h)*100)}if(debugOn)debug.textContent=`${device} · ${p.toFixed(2)}% · ${p<s?'STORY':p<h?'HANDOFF':'DAY'}`}
function measure(){const r=master.getBoundingClientRect(),max=master.offsetHeight-innerHeight;targetP=clamp(-r.top/Math.max(max,1)*100,0,100)}
function tick(){currentP+= (targetP-currentP)*(device==='mobile'?.28:.22);if(Math.abs(targetP-currentP)<.002)currentP=targetP;render(currentP);requestAnimationFrame(tick)}
addEventListener('scroll',measure,{passive:true});addEventListener('resize',()=>{device=matchMedia('(max-width:760px)').matches?'mobile':'desktop';measure()});loadConfig().then(()=>{if(forcedProgress!==null){requestAnimationFrame(()=>{const max=master.offsetHeight-innerHeight;scrollTo(0,max*clamp(Number(forcedProgress)/100,0,1));measure()})}else measure();tick()});
})();
</script>
