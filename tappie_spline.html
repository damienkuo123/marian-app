<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Tappie Spline Story — Exact Motion Runtime</title><link rel="stylesheet" href="./tappie_story_runtime.css"><style>
html,body{width:100%;min-height:100%;overflow-x:hidden}.master-scroll{height:1100vh;position:relative}.sticky{position:sticky;top:0;width:100%;height:100svh;overflow:hidden;background:#02050a}.progress-rail{position:fixed;left:28px;bottom:28px;z-index:50;display:flex;align-items:center;gap:18px;color:rgba(255,255,255,.72);font:700 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.24em}.progress-rail i{display:block;width:150px;height:3px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}.progress-rail i:after{content:"";display:block;height:100%;width:calc(var(--p,0)*1%);background:#43c8ff}.load-error{position:fixed;inset:0;display:none;place-items:center;color:white;background:#02050a;z-index:100;padding:24px;text-align:center}@media(max-width:767px){.progress-rail{left:24px;bottom:max(24px,env(safe-area-inset-bottom));font-size:11px}.progress-rail i{width:112px}}
</style></head><body><main class="master-scroll" id="master"><section class="sticky"><div id="runtime" class="tappie-runtime-root"></div><div class="progress-rail"><span>STORY</span><i></i></div></section></main><div class="load-error" id="err"></div><script src="./tappie_story_runtime.js"></script><script>
(async()=>{try{const project=await fetch('./tappie-motion-keyframes.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('JSON '+r.status);return r.json()});const renderer=new TappieStory.Renderer(document.querySelector('#runtime'),project);const master=document.querySelector('#master'),rail=document.querySelector('.progress-rail');let target=0,current=0,raf=0;const forced=new URLSearchParams(location.search).get('p');function scrollProgress(){const max=Math.max(master.offsetHeight-innerHeight,1);return Math.max(0,Math.min(100,scrollY/max*100))}function tick(){current+=(target-current)*.24;if(Math.abs(target-current)<.003)current=target;renderer.setProgress(current);rail.style.setProperty('--p',current);raf=requestAnimationFrame(tick)}if(forced!==null){target=current=Math.max(0,Math.min(100,Number(forced)||0));renderer.setProgress(current);rail.style.setProperty('--p',current)}else{const update=()=>{target=scrollProgress()};addEventListener('scroll',update,{passive:true});addEventListener('resize',update,{passive:true});update();raf=requestAnimationFrame(tick)}window.__TAPPIE_RENDERER__=renderer}catch(e){console.error(e);const x=document.querySelector('#err');x.style.display='grid';x.textContent='載入失敗：'+e.message}})();
</script></body></html>
