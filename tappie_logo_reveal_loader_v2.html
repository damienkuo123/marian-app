<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tappie Logo Reveal Loader v2</title>
  <style>
    :root {
      --progress: 0;
      --bg: #f7f9fc;
      --text: #101828;
      --muted: rgba(16, 24, 40, .58);
      --line: rgba(16, 24, 40, .08);
      --logo-size: min(42vw, 230px);
      --loader-scale: 1;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
        "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 38%, rgba(37, 99, 235, .07), transparent 34%),
        linear-gradient(180deg, #ffffff 0%, #f7f9fc 100%);
      padding: 28px;
    }

    .boot-inner {
      width: min(92vw, 520px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      transform: scale(var(--loader-scale));
      transform-origin: center;
    }

    .logo-stage {
      position: relative;
      width: var(--logo-size);
      aspect-ratio: 1;
      isolation: isolate;
    }

    .logo-stage::before {
      content: "";
      position: absolute;
      inset: 10%;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(37, 99, 235, .14), transparent 62%);
      filter: blur(22px);
      z-index: -1;
      opacity: calc(.35 + var(--progress) * .45);
    }

    .logo-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .logo-ghost {
      opacity: .105;
      filter: grayscale(1) saturate(0) contrast(.92);
    }

    .logo-color {
      clip-path: inset(calc((1 - var(--progress)) * 100%) 0 0 0);
      -webkit-clip-path: inset(calc((1 - var(--progress)) * 100%) 0 0 0);
      filter:
        drop-shadow(0 14px 26px rgba(37, 99, 235, calc(var(--progress) * .12)))
        saturate(1.03);
    }

    .logo-sheen {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: calc(var(--progress) * .55);
      background:
        linear-gradient(110deg,
          transparent 25%,
          rgba(255,255,255,.0) 36%,
          rgba(255,255,255,.92) 47%,
          rgba(255,255,255,.0) 58%,
          transparent 72%);
      transform: translateX(calc(-140% + var(--progress) * 280%));
      mix-blend-mode: screen;
      mask: url("/assets/logo.webp") center / contain no-repeat;
      -webkit-mask: url("/assets/logo.webp") center / contain no-repeat;
    }

    .front-glow {
      position: absolute;
      left: 12%;
      right: 12%;
      height: 14px;
      bottom: calc(var(--progress) * 100% - 7px);
      opacity: calc(var(--progress) * (1 - var(--progress)) * 2.2);
      pointer-events: none;
      background:
        radial-gradient(ellipse at center,
          rgba(37,99,235,.32) 0%,
          rgba(37,99,235,.12) 42%,
          rgba(37,99,235,0) 72%);
      filter: blur(5px);
      transform: translateZ(0);
    }

    .pulse-ring {
      position: absolute;
      inset: 7%;
      border-radius: 999px;
      border: 1px solid rgba(37, 99, 235, .12);
      transform: scale(calc(.92 + var(--progress) * .08));
      opacity: calc(.1 + var(--progress) * .26);
      pointer-events: none;
    }

    .copy {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .brand {
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 850;
    }

    .title {
      margin: 0;
      font-size: clamp(26px, 6vw, 44px);
      letter-spacing: -.055em;
      line-height: 1.04;
      font-weight: 900;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      font-weight: 650;
      line-height: 1.7;
      letter-spacing: -.02em;
    }

    .micro-progress {
      width: min(74vw, 260px);
      height: 4px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(16, 24, 40, .07);
    }

    .micro-progress > div {
      width: calc(var(--progress) * 100%);
      height: 100%;
      border-radius: inherit;
      background: #2563eb;
      transition: width .12s linear;
    }

    .percent {
      font-size: 13px;
      color: var(--muted);
      font-weight: 750;
      letter-spacing: .02em;
    }

    .controls {
      position: fixed;
      left: 50%;
      bottom: 22px;
      width: min(92vw, 620px);
      transform: translateX(-50%);
      border: 1px solid var(--line);
      background: rgba(255,255,255,.76);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 22px 70px rgba(15,23,42,.08);
      border-radius: 24px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #2563eb;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      background: #101828;
      color: white;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    button.secondary {
      background: rgba(16,24,40,.06);
      color: #101828;
    }

    @media (max-width: 680px) {
      :root { --logo-size: min(58vw, 230px); }
      .boot-inner { gap: 22px; transform: translateY(-5vh); }
      .subtitle { max-width: 28ch; }
      .controls {
        grid-template-columns: 1fr;
        border-radius: 22px;
        bottom: 14px;
      }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="boot" id="boot">
    <div class="boot-inner">
      <div class="logo-stage" aria-hidden="true">
        <div class="pulse-ring"></div>
        <img class="logo-img logo-ghost" src="/assets/logo.webp" alt="">
        <img class="logo-img logo-color" src="/assets/logo.webp" alt="">
        <div class="logo-sheen"></div>
        <div class="front-glow"></div>
      </div>

      <div class="copy">
        <div class="brand">Tappie</div>
        <h1 class="title">正在準備你的體驗</h1>
        <p class="subtitle">載入口說名牌的第一段動畫。</p>
      </div>

      <div class="micro-progress" aria-hidden="true"><div></div></div>
      <div class="percent" id="percent">0%</div>
    </div>
  </div>

  <div class="controls">
    <input id="slider" type="range" min="0" max="100" value="0" step="1">
    <button id="play">播放</button>
    <button id="reset" class="secondary">重置</button>
  </div>

  <script>
    (() => {
      const root = document.documentElement;
      const slider = document.getElementById('slider');
      const percent = document.getElementById('percent');
      const play = document.getElementById('play');
      const reset = document.getElementById('reset');

      let value = 0;
      let playing = false;
      let raf = null;

      function clamp(n, a, b) {
        return Math.max(a, Math.min(b, n));
      }

      function setProgress(next) {
        value = clamp(next, 0, 1);
        root.style.setProperty('--progress', value.toFixed(4));
        const p = Math.round(value * 100);
        slider.value = p;
        percent.textContent = p + '%';
      }

      function stop() {
        playing = false;
        play.textContent = '播放';
        if (raf) cancelAnimationFrame(raf);
        raf = null;
      }

      function animate() {
        stop();
        playing = true;
        play.textContent = '停止';

        const start = value;
        const duration = 2200;
        const t0 = performance.now();

        function tick(now) {
          const t = clamp((now - t0) / duration, 0, 1);
          const eased = 1 - Math.pow(1 - t, 3);
          setProgress(start + (1 - start) * eased);

          if (t < 1 && playing) {
            raf = requestAnimationFrame(tick);
          } else {
            setProgress(1);
            stop();
          }
        }

        raf = requestAnimationFrame(tick);
      }

      slider.addEventListener('input', () => {
        stop();
        setProgress(Number(slider.value) / 100);
      });

      play.addEventListener('click', () => {
        if (playing) stop();
        else animate();
      });

      reset.addEventListener('click', () => {
        stop();
        setProgress(0);
      });

      setProgress(0);
    })();
  </script>
</body>
</html>
