<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tappie Scroll Frame Sequence Test</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f9fc;
      color: #101828;
    }
    .scroll-scene { position: relative; height: 480vh; background: #f7f9fc; }
    .sticky-stage {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      background: #f7f9fc;
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .copy {
      position: absolute;
      left: clamp(20px, 5vw, 72px);
      bottom: clamp(32px, 8vh, 90px);
      z-index: 3;
      max-width: min(540px, calc(100vw - 40px));
      pointer-events: none;
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(20, 36, 60, .55);
      margin-bottom: 12px;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(34px, 6vw, 78px);
      line-height: .98;
      letter-spacing: -0.055em;
      color: #101828;
    }
    p {
      margin: 0;
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.6;
      color: rgba(16, 24, 40, .68);
      max-width: 38ch;
    }
    .progress-wrap {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }
    .progress {
      flex: 1;
      height: 5px;
      border-radius: 999px;
      background: rgba(16, 24, 40, .12);
      overflow: hidden;
    }
    .bar {
      height: 100%;
      width: 0%;
      background: #1570ef;
    }
    .label {
      min-width: 48px;
      text-align: right;
      font-size: 12px;
      color: rgba(16, 24, 40, .62);
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 768px) {
      .scroll-scene { height: 390vh; }
      .copy {
        left: 18px;
        right: 18px;
        bottom: 68px;
        max-width: none;
      }
      h1 { font-size: clamp(30px, 10vw, 46px); }
      p { font-size: 15px; max-width: 30ch; }
    }
  </style>
</head>
<body>
  <section class="scroll-scene" id="scene">
    <div class="sticky-stage">
      <canvas id="canvas"></canvas>
      <div class="copy">
        <div class="eyebrow">Tappie Scroll Hero</div>
        <h1>嗶一下，開始說英文。</h1>
        <p>學生每天戴著名牌，輕碰手機，就能進入口說練習入口。</p>
      </div>
    </div>
  </section>

  <div class="progress-wrap">
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="label" id="label">0%</div>
  </div>

  <script>
    const frameCount = 100;
    const framePath = index => `./assets/frames/frame_${String(index + 1).padStart(4, '0')}.webp`;

    const scene = document.getElementById('scene');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const bar = document.getElementById('bar');
    const label = document.getElementById('label');

    const images = new Array(frameCount);
    let currentIndex = -1;
    let rafId = null;

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
      drawFrame(Math.max(currentIndex, 0));
    }

    function preloadFrame(i) {
      if (i < 0 || i >= frameCount || images[i]) return;
      const img = new Image();
      img.decoding = 'async';
      img.src = framePath(i);
      images[i] = img;
    }

    function preloadImportantFrames() {
      // first pass: all frames
      for (let i = 0; i < frameCount; i++) preloadFrame(i);
    }

    function drawCover(img) {
      if (!img || !img.complete || !img.naturalWidth) return;

      const cw = canvas.width;
      const ch = canvas.height;
      const iw = img.naturalWidth;
      const ih = img.naturalHeight;

      const scale = Math.max(cw / iw, ch / ih);
      const w = iw * scale;
      const h = ih * scale;
      const x = (cw - w) / 2;
      const y = (ch - h) / 2;

      ctx.clearRect(0, 0, cw, ch);
      ctx.drawImage(img, x, y, w, h);
    }

    function drawFrame(index) {
      index = Math.max(0, Math.min(frameCount - 1, index));
      preloadFrame(index);

      const img = images[index];
      if (!img) return;

      if (!img.complete || !img.naturalWidth) {
        img.onload = () => {
          if (currentIndex === index || currentIndex === -1) drawCover(img);
        };
        return;
      }

      currentIndex = index;
      drawCover(img);
    }

    function getProgress() {
      const maxScroll = scene.offsetHeight - window.innerHeight;
      const y = Math.min(Math.max(window.scrollY, 0), maxScroll);
      return maxScroll > 0 ? y / maxScroll : 0;
    }

    function update() {
      rafId = null;
      const progress = getProgress();
      const nextIndex = Math.round(progress * (frameCount - 1));
      if (nextIndex !== currentIndex) drawFrame(nextIndex);
      bar.style.width = `${(progress * 100).toFixed(2)}%`;
      label.textContent = `${Math.round(progress * 100)}%`;
    }

    function requestUpdate() {
      if (!rafId) rafId = requestAnimationFrame(update);
    }

    resizeCanvas();
    preloadFrame(0);
    preloadFrame(1);
    preloadFrame(2);
    preloadImportantFrames();
    drawFrame(0);
    requestUpdate();

    window.addEventListener('resize', () => {
      resizeCanvas();
      requestUpdate();
    });
    window.addEventListener('scroll', requestUpdate, { passive: true });
  </script>
</body>
</html>
