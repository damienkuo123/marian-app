<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tappie Scroll Video Test</title>
  <style>
    :root {
      --ink: #102033;
      --muted: rgba(16, 32, 51, .62);
      --blue: #2563eb;
      --bg: #f7f8fb;
      --card: rgba(255,255,255,.72);
      --line: rgba(16,32,51,.1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: auto; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    .intro, .outro {
      min-height: 70vh;
      display: grid;
      place-items: center;
      padding: 64px 24px;
      text-align: center;
      background: #ffffff;
    }

    .intro h1, .outro h2 {
      margin: 0 0 16px;
      font-size: clamp(36px, 6vw, 88px);
      line-height: .95;
      letter-spacing: -0.06em;
    }

    .intro p, .outro p {
      margin: 0 auto;
      max-width: 680px;
      font-size: clamp(17px, 2vw, 22px);
      line-height: 1.7;
      color: var(--muted);
    }

    .scroll-hero {
      position: relative;
      height: 620vh;
      background: linear-gradient(180deg, #fff 0%, #f7f8fb 100%);
    }

    .stage {
      position: sticky;
      top: 0;
      height: 100svh;
      overflow: hidden;
      background: #fff;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .video-wrap {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      pointer-events: none;
      background: #fff;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      transform: translateZ(0);
      will-change: transform;
      background: #fff;
    }

    .copy {
      position: absolute;
      z-index: 3;
      left: clamp(20px, 5vw, 76px);
      bottom: clamp(28px, 8vh, 92px);
      width: min(470px, calc(100vw - 40px));
      padding: 22px 22px 20px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 24px 80px rgba(16, 32, 51, .12);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 0 6px rgba(37, 99, 235, .12);
    }

    .copy h2 {
      margin: 0;
      font-size: clamp(30px, 4.4vw, 58px);
      line-height: .98;
      letter-spacing: -0.06em;
    }

    .copy p {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: clamp(15px, 1.45vw, 18px);
      line-height: 1.65;
    }

    .progress {
      position: absolute;
      z-index: 4;
      left: 0;
      bottom: 0;
      height: 4px;
      width: 100%;
      background: rgba(16, 32, 51, .08);
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      transform-origin: left center;
    }

    .debug {
      position: absolute;
      z-index: 5;
      top: 16px;
      right: 16px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(16,32,51,.1);
      color: rgba(16,32,51,.54);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .loading {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(16,32,51,.45);
      font-size: 14px;
      pointer-events: none;
      transition: opacity .3s ease;
    }

    .loading.is-hidden { opacity: 0; }

    @media (max-width: 760px) {
      .scroll-hero { height: 560vh; }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
      }
      .copy {
        left: 14px;
        right: 14px;
        bottom: calc(18px + env(safe-area-inset-bottom));
        width: auto;
        padding: 18px;
        border-radius: 22px;
      }
      .copy h2 { font-size: 32px; }
      .copy p { font-size: 14px; }
      .debug { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scroll-hero { height: 160vh; }
      .copy { position: absolute; }
    }
  </style>
</head>
<body>
  <section class="intro">
    <div>
      <h1>Tappie Scroll Video Test</h1>
      <p>往下滑，測試影片是否能依照 scroll progress 順暢播放。這頁是獨立測試頁，不影響正式 index。</p>
    </div>
  </section>

  <section class="scroll-hero" id="scrollHero">
    <div class="stage">
      <div class="video-wrap">
        <video id="heroVideo" muted playsinline preload="auto"></video>
        <div class="loading" id="loading">影片載入中…</div>
      </div>

      <div class="copy" id="copyBox">
        <div class="eyebrow"><span class="dot"></span><span id="stepLabel">Tappie</span></div>
        <h2 id="headline">嗶一下，開始說英文</h2>
        <p id="bodyText">把學生每天戴的名牌，變成進入口說練習的入口。</p>
      </div>

      <div class="debug" id="debug">0% · 0.00s</div>
      <div class="progress"><div class="bar" id="bar"></div></div>
    </div>
  </section>

  <section class="outro">
    <div>
      <h2>測試結束</h2>
      <p>如果這版順很多，就可以把同樣邏輯整合回正式首頁 Hero。</p>
    </div>
  </section>

  <script>
    const VIDEO_DESKTOP = '/assets/video/tappie-hero-scroll-desktop-scrub.mp4';
    const VIDEO_MOBILE = '/assets/video/tappie-hero-scroll-mobile-scrub.mp4';

    const hero = document.getElementById('scrollHero');
    const video = document.getElementById('heroVideo');
    const bar = document.getElementById('bar');
    const debug = document.getElementById('debug');
    const loading = document.getElementById('loading');
    const stepLabel = document.getElementById('stepLabel');
    const headline = document.getElementById('headline');
    const bodyText = document.getElementById('bodyText');

    const isMobile = window.matchMedia('(max-width: 760px)').matches;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const SEEK_THRESHOLD = isMobile ? 0.085 : 0.045;

    const steps = [
      { at: 0.00, label: 'NFC Badge', title: '名牌就是入口', body: '學生不用輸入帳號，只要拿起每天配戴的感應名牌。' },
      { at: 0.22, label: 'Tap Card', title: '卡片滑出，準備感應', body: '藍色感應卡成為主角，連結實體卡片與數位練習。' },
      { at: 0.45, label: 'NFC Tap', title: '靠近手機上緣', body: '用 NFC 感應進入學生專屬的 Tappie 練習頁。' },
      { at: 0.70, label: 'Student App', title: '首頁自動開啟', body: '學生進入口說練習、點數與成長紀錄都在同一個入口。' },
      { at: 0.90, label: 'Tappie', title: '把口說變成日常', body: '補習班可以用一張名牌，建立學生每天開口練習的習慣。' }
    ];

    let duration = 0;
    let targetTime = 0;
    let currentProgress = 0;
    let rafPending = false;
    let isSeeking = false;
    let hasUnlocked = false;

    video.src = isMobile ? VIDEO_MOBILE : VIDEO_DESKTOP;
    video.load();

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function getProgress() {
      const rect = hero.getBoundingClientRect();
      const total = hero.offsetHeight - window.innerHeight;
      if (total <= 0) return 0;
      return clamp(-rect.top / total, 0, 1);
    }

    function setCopy(progress) {
      let active = steps[0];
      for (const step of steps) {
        if (progress >= step.at) active = step;
      }
      stepLabel.textContent = active.label;
      headline.textContent = active.title;
      bodyText.textContent = active.body;
    }

    function requestUpdate() {
      currentProgress = getProgress();
      if (duration) targetTime = clamp(currentProgress * duration, 0, Math.max(0, duration - 0.04));
      bar.style.width = `${(currentProgress * 100).toFixed(2)}%`;
      debug.textContent = `${Math.round(currentProgress * 100)}% · ${targetTime.toFixed(2)}s`;
      setCopy(currentProgress);

      if (!rafPending) {
        rafPending = true;
        requestAnimationFrame(updateVideoTime);
      }
    }

    function seekTo(time) {
      try {
        isSeeking = true;
        if (typeof video.fastSeek === 'function') {
          video.fastSeek(time);
        } else {
          video.currentTime = time;
        }
      } catch (err) {
        isSeeking = false;
      }
    }

    function updateVideoTime() {
      rafPending = false;
      if (!duration || reduceMotion) return;
      if (isSeeking) return;

      const diff = Math.abs(video.currentTime - targetTime);
      if (diff > SEEK_THRESHOLD) {
        seekTo(targetTime);
      }
    }

    video.addEventListener('loadedmetadata', () => {
      duration = Math.max(0, video.duration || 0);
      loading.classList.add('is-hidden');
      requestUpdate();
      // Prime first frame without playing.
      try { video.currentTime = 0.001; } catch (e) {}
    });

    video.addEventListener('seeked', () => {
      isSeeking = false;
      if (Math.abs(video.currentTime - targetTime) > SEEK_THRESHOLD) {
        requestUpdate();
      }
    });

    video.addEventListener('canplay', () => {
      loading.classList.add('is-hidden');
    });

    // iOS / mobile unlock: first touch can unlock media decoding for smoother seeking.
    async function unlockVideo() {
      if (hasUnlocked) return;
      hasUnlocked = true;
      try {
        await video.play();
        video.pause();
        requestUpdate();
      } catch (e) {
        requestUpdate();
      }
    }

    window.addEventListener('scroll', requestUpdate, { passive: true });
    window.addEventListener('resize', requestUpdate, { passive: true });
    window.addEventListener('touchstart', unlockVideo, { once: true, passive: true });
    window.addEventListener('pointerdown', unlockVideo, { once: true, passive: true });

    requestUpdate();
  </script>
</body>
</html>
