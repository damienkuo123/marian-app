<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Tappie 現場站</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tappie現場站" />
  <link rel="apple-touch-icon" href="/assets/app-icon.png" />
  <script src="./tappie-api.js?v=station-step7d"></script>
  <style>
    :root {
      --primary-blue: #0066cc;
      --primary-blue-2: #4da3ff;
      --marian-yellow: #f39c12;
      --marian-green: #2ecc71;
      --marian-red: #e74c3c;
      --text-main: #1a252f;
      --text-sub: #7f8c8d;
      --glass-bg: rgba(255, 255, 255, 0.66);
      --glass-strong: rgba(255, 255, 255, 0.86);
      --glass-border: rgba(255, 255, 255, 0.88);
      --line: rgba(148, 163, 184, 0.24);
      --shadow: 0 18px 44px rgba(16, 24, 40, 0.10), inset 0 1px 1px rgba(255,255,255,0.92);
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
      --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: var(--font);
      background: #f0f4f8;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    button, input { font: inherit; }
    input { user-select: text; -webkit-user-select: text; }
    .hidden { display: none !important; }

    .ambient-orb { position: fixed; border-radius: 999px; filter: blur(64px); z-index: 0; opacity: .64; pointer-events: none; animation: floatOrb 15s ease-in-out infinite alternate; }
    .orb-1 { width: 350px; height: 350px; background: rgba(0, 102, 204, .22); top: -110px; left: -140px; }
    .orb-2 { width: 410px; height: 410px; background: rgba(243, 156, 18, .18); right: -170px; bottom: 20px; animation-delay: -5s; }
    .orb-3 { width: 260px; height: 260px; background: rgba(46, 204, 113, .15); left: 30%; top: 36%; animation-duration: 21s; }
    @keyframes floatOrb { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(36px,-36px,0) scale(1.16); } }

    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(26px) saturate(145%);
      -webkit-backdrop-filter: blur(26px) saturate(145%);
    }

    #scanner-input { position: fixed; left: -9999px; width: 1px; height: 1px; opacity: 0; }

    /* Login */
    .login-shell { position: relative; z-index: 1; height: 100%; display: grid; place-items: center; padding: max(18px, var(--safe-top)) 18px max(18px, var(--safe-bottom)); }
    .login-card { width: min(460px, 100%); border-radius: 34px; padding: 32px 28px; }
    .login-logo { width: 62px; height: 62px; display: block; margin: 0 auto 18px; border-radius: 22px; background: #fff; object-fit: cover; box-shadow: 0 12px 26px rgba(16,24,40,.08); }
    .login-title { text-align:center; margin: 0; font-size: 31px; letter-spacing: -.04em; font-weight: 560; }
    .field { margin-top: 15px; }
    .field label { display:block; color: var(--text-sub); font-size: 13px; font-weight: 640; margin-bottom: 7px; }
    .input {
      width: 100%; border: 1px solid rgba(148,163,184,.34); background: rgba(255,255,255,.78);
      border-radius: 18px; padding: 15px 16px; color: var(--text-main); outline: none; font-weight: 520;
    }
    .input:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 5px rgba(0,102,204,.12); }
    .login-error { display:none; margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: rgba(231,76,60,.10); color: #b42318; border: 1px solid rgba(231,76,60,.18); font-weight: 520; line-height: 1.5; }

    /* App */
    .app-shell { position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
    .topbar {
      height: max(70px, calc(var(--safe-top) + 62px));
      padding: var(--safe-top) 18px 0;
      display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px;
      background: rgba(255,255,255,.42); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      border-bottom: 1px solid rgba(255,255,255,.68);
    }
    .top-title { text-align: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: clamp(17px, 2.4vw, 23px); font-weight: 560; letter-spacing: -.035em; }
    .top-spacer { width: 44px; height: 44px; }
    .logout-btn { width: 42px; height: 42px; border: 1px solid rgba(255,255,255,.78); border-radius: 50%; background: rgba(255,255,255,.58); color: var(--text-main); box-shadow: 0 10px 24px rgba(15,23,42,.06); cursor: pointer; font-weight: 560; }
    .logout-btn:active, .nav-item:active, .primary-btn:active, .ghost-btn:active, .mode-btn:active, .manual-toggle:active { transform: scale(.97); }

    .content { overflow: auto; -webkit-overflow-scrolling: touch; padding: clamp(18px, 4vw, 34px) clamp(16px, 4vw, 44px) max(114px, calc(var(--safe-bottom) + 104px)); }
    .content::-webkit-scrollbar { display:none; }
    .view { display:none; max-width: 760px; margin: 0 auto; animation: fadeUp .22s ease-out both; }
    .view.active { display:block; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .page-title { margin: 0 0 16px; font-size: clamp(32px, 5vw, 50px); line-height: 1.02; letter-spacing: -.065em; font-weight: 560; }
    .panel { border-radius: 34px; padding: clamp(18px, 4vw, 30px); }

    .scan-card {
      min-height: 245px;
      display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
      border-radius: 30px;
      background: rgba(255,255,255,.74);
      border: 1px dashed rgba(148,163,184,.44);
      padding: 26px 18px;
      position: relative;
      overflow:hidden;
    }
    .scan-card::after { content:""; position:absolute; inset:auto -70px -90px auto; width: 230px; height: 230px; border-radius:50%; background: radial-gradient(circle, rgba(0,102,204,.13), transparent 68%); }
    .scan-wave { width: 16px; height: 16px; border-radius: 50%; background: var(--primary-blue); box-shadow: 0 0 0 0 rgba(0,102,204,.36); animation: wave 1.35s infinite; margin-bottom: 15px; }
    @keyframes wave { 70% { box-shadow: 0 0 0 18px rgba(0,102,204,0); } 100% { box-shadow: 0 0 0 0 rgba(0,102,204,0); } }
    .waiting-title { font-size: 25px; font-weight: 560; letter-spacing: -.035em; }
    .waiting-sub { color: var(--text-sub); font-weight: 560; margin-top: 8px; }
    .student-name { font-size: 34px; font-weight: 560; letter-spacing: -.045em; margin: 0; }
    .student-points { margin-top: 8px; color: var(--marian-green); font-size: 34px; font-weight: 560; text-shadow: 0 0 18px rgba(46,204,113,.18); }
    .chip-row { display:flex; flex-wrap:wrap; justify-content:center; gap: 8px; margin-top: 10px; }
    .chip { display:inline-flex; align-items:center; border-radius:999px; padding: 6px 11px; background: rgba(0,102,204,.10); color:#0b5eb8; font-size: 12px; font-weight: 560; }

    .manual-box { margin-top: 16px; border-radius: 26px; background: rgba(255,255,255,.58); border: 1px solid rgba(255,255,255,.76); overflow: hidden; }
    .manual-toggle { width:100%; border:0; background: transparent; padding: 16px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; font-weight: 560; color: var(--text-main); cursor:pointer; }
    .manual-toggle span:first-child { display:flex; align-items:center; gap:10px; }
    .manual-form { display:none; padding: 0 18px 18px; }
    .manual-form.show { display:block; }
    .manual-grid { display:grid; grid-template-columns: .9fr 1.1fr; gap: 12px; }
    .manual-actions { margin-top: 12px; display:grid; grid-template-columns: 1fr; gap: 10px; }

    .mode-bar-wrap { margin-top: 16px; padding: 8px; border-radius: 25px; background: rgba(255,255,255,.60); border: 1px solid rgba(255,255,255,.78); box-shadow: 0 12px 28px rgba(15,23,42,.06); }
    .mode-bar { display:grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .mode-btn { border:0; border-radius: 19px; background: transparent; color: var(--text-sub); padding: 13px 8px; font-size: 14px; font-weight: 560; cursor:pointer; }
    .mode-btn.active { background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-2)); color: #fff; box-shadow: 0 12px 24px rgba(0,102,204,.22); }
    .mode-btn.checkout.active { background: linear-gradient(135deg, #f97316, #fb7185); box-shadow: 0 12px 24px rgba(249,115,22,.20); }

    .checkin-actions { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
    .primary-btn, .ghost-btn { border:0; cursor:pointer; border-radius: 20px; padding: 15px 16px; font-weight: 560; font-size: 16px; }
    .primary-btn { color:#fff; background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-2)); box-shadow: 0 14px 28px rgba(0,102,204,.20); }
    .primary-btn.success { background: linear-gradient(135deg, #16a34a, #22c55e); box-shadow: 0 14px 28px rgba(22,163,74,.20); }
    .primary-btn.checkout { background: linear-gradient(135deg, #ea580c, #fb7185); box-shadow: 0 14px 28px rgba(234,88,12,.18); }
    .ghost-btn { background: rgba(255,255,255,.70); color: var(--text-main); border:1px solid rgba(148,163,184,.32); }
    .log-box { margin-top: 15px; border-radius: 20px; padding: 14px 15px; color: var(--text-sub); font-weight: 560; line-height:1.6; background: rgba(255,255,255,.54); border: 1px solid rgba(255,255,255,.74); }

    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; height: max(86px, calc(var(--safe-bottom) + 76px)); padding: 9px 18px var(--safe-bottom); display:flex; justify-content:center; z-index: 4; pointer-events:none; }
    .bottom-inner { pointer-events:auto; width: min(440px, 100%); display:grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px; border-radius: 28px; border:1px solid rgba(255,255,255,.76); background: rgba(255,255,255,.64); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 18px 42px rgba(15,23,42,.10); }
    .nav-item { border:0; border-radius: 21px; background: transparent; color: var(--text-sub); font-weight: 560; cursor:pointer; padding: 11px 8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height: 54px; }
    .nav-item.active { background: rgba(0,102,204,.12); color: var(--primary-blue); }
    .nav-icon { font-size: 21px; line-height:1; }

  
    .login-title, .page-title, .student-name, .student-points, .top-title { font-weight: 720; }
    .primary-btn, .ghost-btn, .mode-btn, .nav-item, .manual-toggle, .field label { font-weight: 650; }
    .chip { font-weight: 620; }
    .log-box, .waiting-sub { font-weight: 480; }
    .waiting-title { font-weight: 620; }
    .checkin-actions.hidden { display: none !important; }
    @media (max-height: 760px) { .scan-card { min-height: 290px; } .tap-visual { transform: scale(.88); margin-bottom: 14px; } }




    /* Step 7D｜Visual reset: school-brand watermark scan card */
    body { background:#f0f4f8; letter-spacing:-0.01em; }
    .login-title { font-size:30px; font-weight:620 !important; letter-spacing:-.04em; }
    .field label { font-weight:520 !important; letter-spacing:0; text-transform:none; }
    .input { font-weight:480 !important; }
    .topbar {
      height:max(78px, calc(var(--safe-top) + 68px)) !important;
      padding:var(--safe-top) 20px 0 !important;
      display:grid !important;
      grid-template-columns:minmax(0,1fr) 46px !important;
      align-items:center !important;
      gap:12px !important;
      background:rgba(255,255,255,.52) !important;
      backdrop-filter:blur(24px) saturate(150%) !important;
      -webkit-backdrop-filter:blur(24px) saturate(150%) !important;
      border-bottom:1px solid rgba(255,255,255,.78) !important;
    }
    .station-brand { min-width:0; display:flex; align-items:center; justify-content:flex-start !important; gap:12px; }
    .station-logo { width:44px; height:44px; border-radius:16px; object-fit:cover; background:#fff; border:1px solid rgba(255,255,255,.95); box-shadow:0 8px 20px rgba(15,23,42,.08); flex:0 0 auto; }
    .top-title { text-align:left !important; font-size:clamp(18px,2.2vw,24px) !important; font-weight:560 !important; letter-spacing:-.035em !important; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .logout-btn { font-weight:560 !important; }
    .content { padding:clamp(16px,3vw,28px) clamp(18px,4vw,52px) max(114px, calc(var(--safe-bottom) + 104px)) !important; }
    .view { max-width:880px !important; }
    .page-title { display:none !important; }
    .panel { padding:clamp(16px,2.8vw,26px) !important; border-radius:34px !important; }
    .scan-card {
      min-height:clamp(360px, 52dvh, 620px) !important;
      display:flex !important; flex-direction:column !important; align-items:center !important; justify-content:center !important; text-align:center !important;
      border-radius:34px !important;
      background:linear-gradient(180deg, rgba(255,255,255,.90), rgba(255,255,255,.70)) !important;
      border:1px solid rgba(255,255,255,.92) !important;
      padding:clamp(32px,4vw,56px) 24px !important;
      position:relative !important; overflow:hidden !important;
      box-shadow:inset 0 1px 1px rgba(255,255,255,.95), 0 20px 48px rgba(15,23,42,.08) !important;
    }
    .scan-card::before { content:"" !important; position:absolute !important; inset:-110px auto auto -120px !important; width:300px !important; height:300px !important; border-radius:50% !important; background:radial-gradient(circle, rgba(243,156,18,.13), transparent 70%) !important; }
    .scan-card::after { content:"" !important; position:absolute !important; inset:auto -120px -130px auto !important; width:330px !important; height:330px !important; border-radius:50% !important; background:radial-gradient(circle, rgba(0,102,204,.14), transparent 70%) !important; }
    .tap-visual { display:none !important; }
    .brand-scan-visual { position:relative; width:min(270px,52vw); aspect-ratio:1; margin-bottom:24px; z-index:1; display:grid; place-items:center; }
    .brand-watermark { position:absolute; width:68%; height:68%; border-radius:30%; object-fit:contain; opacity:.14; filter:saturate(.92); }
    .brand-glow { position:absolute; width:82%; height:82%; border-radius:50%; background:radial-gradient(circle, rgba(0,102,204,.15), rgba(0,102,204,.06) 45%, transparent 70%); animation:stationBreath 2.4s ease-in-out infinite; }
    .nfc-ring { position:absolute; inset:12%; border-radius:50%; border:1px solid rgba(0,102,204,.18); }
    .nfc-ring::before, .nfc-ring::after { content:""; position:absolute; inset:18%; border-radius:50%; border:1.5px solid rgba(0,102,204,.28); animation:nfcPulse 1.9s ease-out infinite; }
    .nfc-ring::after { inset:31%; animation-delay:.28s; border-color:rgba(243,156,18,.28); }
    .nfc-core { position:relative; width:68px; height:68px; border-radius:24px; background:rgba(255,255,255,.74); border:1px solid rgba(255,255,255,.92); box-shadow:0 16px 34px rgba(15,23,42,.10); display:grid; place-items:center; color:var(--primary-blue); }
    .nfc-core svg { width:34px; height:34px; }
    .scan-line { position:absolute; left:15%; right:15%; height:2px; border-radius:999px; background:linear-gradient(90deg, transparent, rgba(0,102,204,.72), transparent); top:24%; animation:scanLine 2.2s ease-in-out infinite; opacity:.78; }
    @keyframes stationBreath { 0%,100%{ transform:scale(.98); opacity:.72;} 50%{ transform:scale(1.05); opacity:1;} }
    @keyframes nfcPulse { 0%{ transform:scale(.72); opacity:.72;} 100%{ transform:scale(1.25); opacity:0;} }
    @keyframes scanLine { 0%,100%{ transform:translateY(0); opacity:.18;} 50%{ transform:translateY(130px); opacity:.82;} }
    .scan-wave { display:none !important; }
    .waiting-title { font-size:26px !important; font-weight:520 !important; letter-spacing:-.035em !important; position:relative; z-index:1; }
    .waiting-sub { font-size:14px !important; font-weight:420 !important; color:var(--text-sub) !important; position:relative; z-index:1; }
    .student-name { font-weight:560 !important; }
    .student-points { font-weight:560 !important; }
    .chip { font-weight:500 !important; }
    .manual-toggle, .primary-btn, .ghost-btn, .mode-btn, .nav-item { font-weight:540 !important; }
    .mode-bar { grid-template-columns:repeat(3, 1fr) !important; }
    .checkin-actions { grid-template-columns:1fr 1fr !important; }
    .checkin-actions.hidden { display:none !important; }
    .log-box { font-weight:400 !important; }
    .bottom-inner { width:min(460px,100%) !important; }
    @media (max-height:760px){ .scan-card{ min-height:330px !important; } .brand-scan-visual{ width:min(220px,46vw); margin-bottom:16px;} }


    /* Step 7E｜Clean brand watermark scan card */
    .page-title { display:none !important; }
    .station-brand { justify-content:flex-start !important; text-align:left !important; }
    .top-title { font-weight:620 !important; letter-spacing:-.02em !important; text-align:left !important; }
    .scan-card { min-height: clamp(360px, 52vh, 620px) !important; justify-content:center !important; }
    .brand-scan-visual { width:min(340px, 50vw) !important; max-width:420px !important; margin-bottom:28px !important; }
    .brand-watermark { width:72% !important; height:72% !important; opacity:.18 !important; filter:saturate(.96) contrast(1.02) !important; border-radius:24% !important; }
    .brand-glow { width:84% !important; height:84% !important; background:radial-gradient(circle, rgba(0,102,204,.10), rgba(243,156,18,.055) 48%, transparent 72%) !important; }
    .nfc-ring, .nfc-core { display:none !important; }
    .scan-line { left:8% !important; right:8% !important; height:3px !important; top:16% !important; background:linear-gradient(90deg, transparent, rgba(255,255,255,.92), rgba(0,102,204,.30), rgba(255,255,255,.92), transparent) !important; box-shadow:0 0 22px rgba(0,102,204,.18) !important; opacity:.68 !important; animation:scanLineClean 2.65s ease-in-out infinite !important; }
    @keyframes scanLineClean { 0%,100%{ transform:translateY(0); opacity:.12;} 12%{ opacity:.58;} 50%{ transform:translateY(220px); opacity:.82;} 88%{ opacity:.58;} }
    .waiting-title { font-weight:560 !important; font-size:clamp(22px, 3vw, 34px) !important; letter-spacing:-.02em !important; }
    .log-box { font-weight:460 !important; }


    /* Step 7F｜Full-card slow scan + Admin-consistent mode colors */
    .scan-card { isolation:isolate !important; }
    .scan-card .brand-scan-visual { z-index:1 !important; }
    .scan-card .waiting-title, .scan-card .waiting-sub, .scan-card .student-name, .scan-card .student-points, .scan-card .chip-row { position:relative !important; z-index:4 !important; }
    .brand-scan-visual .scan-line { display:none !important; }
    /* Step 7G｜Reliable visible scan sweep: no blend mode, full-card soft band */
    .scan-card {
      overflow:hidden !important;
    }
    .card-scan-line {
      position:absolute !important;
      left:-6% !important;
      right:-6% !important;
      top:-22% !important;
      height:32% !important;
      min-height:120px !important;
      z-index:3 !important;
      pointer-events:none !important;
      opacity:.62 !important;
      background:
        linear-gradient(180deg,
          rgba(37,99,235,0) 0%,
          rgba(37,99,235,.035) 22%,
          rgba(255,255,255,.74) 46%,
          rgba(96,165,250,.18) 51%,
          rgba(255,255,255,.52) 58%,
          rgba(245,158,11,.035) 78%,
          rgba(37,99,235,0) 100%
        ) !important;
      box-shadow:
        0 0 44px rgba(96,165,250,.16),
        0 0 72px rgba(245,158,11,.08) !important;
      transform:translateY(0) skewY(-2deg) !important;
      animation:stationFullCardScanReliable 7.8s cubic-bezier(.42,0,.18,1) infinite !important;
    }
    .card-scan-line::before {
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:48%;
      height:1px;
      background:linear-gradient(90deg, transparent, rgba(0,102,204,.28), rgba(255,255,255,.85), rgba(0,102,204,.20), transparent);
      opacity:.75;
    }
    @keyframes stationFullCardScanReliable {
      0%, 8% { transform:translateY(-18%) skewY(-2deg); opacity:.06; }
      22% { opacity:.42; }
      52% { transform:translateY(210%) skewY(-2deg); opacity:.66; }
      78% { opacity:.38; }
      100% { transform:translateY(285%) skewY(-2deg); opacity:.06; }
    }
    .mode-btn.active {
      color:#fff !important;
      background:#64748b !important;
      box-shadow:0 10px 22px rgba(100,116,139,.20) !important;
    }
    #mode-checkin.active {
      background:linear-gradient(135deg, #27ae60, #2ecc71) !important;
      box-shadow:0 10px 22px rgba(39,174,96,.22) !important;
    }
    #mode-checkout.active {
      background:linear-gradient(135deg, #c0392b, #e74c3c) !important;
      box-shadow:0 10px 22px rgba(192,57,43,.22) !important;
    }
    .primary-btn.success { background:linear-gradient(135deg, #27ae60, #2ecc71) !important; }
    .primary-btn.checkout { background:linear-gradient(135deg, #c0392b, #e74c3c) !important; }

  
    /* Step 7H｜Single soft full-card scan surface
       - remove the humorous double light bars
       - keep only transparent school logo + one gentle moving sheen
       - applies to both student entrance and check-in waiting cards
    */
    .scan-card {
      isolation:isolate !important;
      overflow:hidden !important;
    }
    .brand-scan-visual {
      position:absolute !important;
      inset:0 !important;
      width:100% !important;
      height:100% !important;
      max-width:none !important;
      aspect-ratio:auto !important;
      margin:0 !important;
      z-index:1 !important;
      pointer-events:none !important;
      display:grid !important;
      place-items:center !important;
    }
    .brand-glow,
    .brand-scan-visual .scan-line,
    .brand-scan-visual .nfc-ring,
    .brand-scan-visual .nfc-core {
      display:none !important;
    }

      margin: 0 !important;
      color: var(--text-main) !important;
    }

    .student-info-card .student-points {
      margin-top: 12px !important;
      font-size: clamp(32px, 4.4vw, 52px) !important;
      font-weight: 560 !important;
      line-height: 1 !important;
      color: var(--marian-green) !important;
    }

    .student-info-card .chip-row {
      margin-top: 16px !important;
      justify-content: center !important;
    }

    .student-info-card .chip {
      font-size: 13px !important;
      padding: 7px 12px !important;
      background: rgba(0,102,204,.10) !important;
    }

    .student-status-note {
      margin-top: 14px !important;
      color: var(--text-sub) !important;
      font-size: 14px !important;
      font-weight: 450 !important;
      line-height: 1.5 !important;
    }

    @media (min-width: 760px) and (min-height: 900px) {
      .content {
        padding-top: clamp(22px, 3vh, 38px) !important;
      }

      .panel {
        max-width: 820px !important;
      }

      .scan-card {
        min-height: clamp(500px, 52dvh, 660px) !important;
      }

      #student-result.scan-card,
      #checkin-result.scan-card {
        min-height: clamp(500px, 52dvh, 660px) !important;
      }

      .brand-scan-visual {
        width: min(30%, 250px) !important;
      }
    }

    @media (max-width: 700px) {
      html, body {
        overflow: hidden !important;
      }

      .content {
        overflow-y: auto !important;
        padding-bottom: max(150px, calc(var(--safe-bottom) + 138px)) !important;
      }

      .scan-card {
        min-height: clamp(330px, 45dvh, 500px) !important;
        padding: 32px 20px !important;
      }

      #student-result.scan-card,
      #checkin-result.scan-card {
        min-height: clamp(330px, 45dvh, 500px) !important;
      }

      .brand-scan-visual {
        width: min(42%, 210px) !important;
      }

      .manual-box,
      .log-box {
        position: relative !important;
        z-index: 2 !important;
      }
    }

  
    /* Step 7K-4｜Station manual input simplification */
    .manual-grid.single {
      grid-template-columns: 1fr !important;
    }

    .checkin-manual-box {
      margin-top: 14px !important;
    }

    .checkin-manual-box.hidden {
      display: none !important;
    }

    .checkin-manual-box .manual-toggle {
      padding: 15px 18px !important;
    }

  </style>
</head>
<body>
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>
  <div class="ambient-orb orb-3"></div>
  <input id="scanner-input" autocomplete="off" inputmode="none" />

  <section id="login-screen" class="login-shell">
    <div class="login-card glass">
      <img class="login-logo" src="/assets/app-icon.png" alt="Tappie" />
      <h1 class="login-title">Tappie 現場站</h1>
      <div class="field">
        <label for="login-school">校區代碼</label>
        <input id="login-school" class="input" placeholder="例如 TP01" autocapitalize="characters" />
      </div>
      <div class="field">
        <label for="login-secret">Super Admin 密碼</label>
        <input id="login-secret" class="input" type="password" placeholder="請輸入密碼" />
      </div>
      <button class="primary-btn" style="width:100%; margin-top:14px;" onclick="stationLogin(event)">啟用現場站</button>
      <div id="login-error" class="login-error"></div>
    </div>
  </section>

  <main id="station-app" class="app-shell hidden">
    <header class="topbar">
      <div class="station-brand">
        <img id="station-logo" class="station-logo" src="/assets/app-icon.png" alt="校區 Logo" />
        <div id="station-school-name" class="top-title">校區現場站</div>
      </div>
      <button class="settings-btn top-icon-btn" title="Station 設定" onclick="openStationSettings()">⚙️</button>
    </header>

    <section class="content">
      <div id="student-view" class="view active">
        <div class="panel glass">
          <div id="student-result" class="scan-card">
            <div class="brand-scan-visual" aria-hidden="true">
              <div class="brand-glow"></div>
              <img class="brand-watermark" src="/assets/app-icon.png" alt="" />
              <div class="scan-line"></div>
            </div>
            <div class="card-scan-line" aria-hidden="true"></div>
            <div class="waiting-title">請感應學生卡</div>
          </div>

          <div class="manual-box">
            <button class="manual-toggle" onclick="toggleStudentManual()">
              <span><span>⌨️</span><span>手動登入</span></span><span id="manual-arrow">⌄</span>
            </button>
            <div id="student-manual-form" class="manual-form">
              <div class="manual-grid single">
                <div class="field">
                  <label for="manual-student-code">學生代號</label>
                  <input id="manual-student-code" class="input" placeholder="1234567890" />
                </div>
              </div>
              <div class="manual-actions">
                <button id="manual-submit-btn" class="primary-btn" onclick="handleManualStudentLogin(event)">進入學生中心</button>
              </div>
            </div>
          </div>
          <div id="student-log" class="log-box">等待學生卡。</div>
        </div>
      </div>

      <div id="checkin-view" class="view">
        <div class="panel glass">
          <div id="checkin-result" class="scan-card">
            <div class="brand-scan-visual" aria-hidden="true">
              <div class="brand-glow"></div>
              <img class="brand-watermark" src="/assets/app-icon.png" alt="" />
              <div class="scan-line"></div>
            </div>
            <div class="card-scan-line" aria-hidden="true"></div>
            <div class="waiting-title">請感應學生卡</div>
            <div id="checkin-mode-pill" class="waiting-sub">手動模式</div>
          </div>

          <div id="manual-actions" class="checkin-actions hidden">
            <button class="primary-btn success" onclick="manualRecord('checkin')">確認到校</button>
            <button class="primary-btn checkout" onclick="manualRecord('checkout')">確認離校</button>
          </div>

          <div class="mode-bar-wrap">
            <div class="mode-bar">
              <button id="mode-manual" class="mode-btn active" onclick="setCheckinMode('manual')">手動</button>
              <button id="mode-checkin" class="mode-btn" onclick="setCheckinMode('auto_checkin')">自動到校</button>
              <button id="mode-checkout" class="mode-btn checkout" onclick="setCheckinMode('auto_checkout')">自動離校</button>
            </div>
          </div>

          <div id="checkin-manual-box" class="manual-box checkin-manual-box">
            <button class="manual-toggle" onclick="toggleCheckinManualInput()">
              <span><span>⌨️</span><span>手動輸入學生代號</span></span><span id="checkin-manual-arrow">⌄</span>
            </button>
            <div id="checkin-manual-form" class="manual-form">
              <div class="manual-grid single">
                <div class="field">
                  <label for="checkin-manual-student-code">學生代號</label>
                  <input id="checkin-manual-student-code" class="input" placeholder="1234567890" />
                </div>
              </div>
              <div class="manual-actions">
                <button id="checkin-manual-submit-btn" class="primary-btn" onclick="handleManualCheckinLookup(event)">讀取學生</button>
              </div>
            </div>
          </div>

          <div id="checkin-log" class="log-box">目前模式：手動。請感應學生卡。</div>
        </div>
      </div>
    </section>

    <div id="station-settings-overlay" class="station-settings-overlay" onclick="handleSettingsBackdrop(event)">
      <aside class="station-settings-panel glass" role="dialog" aria-modal="true" aria-labelledby="station-settings-title">
        <div class="settings-head">
          <div>
            <div id="station-settings-title" class="settings-title">Station 設定</div>
            <div class="settings-sub">此頁只管理這台現場平板。</div>
          </div>
          <button class="settings-close-btn" onclick="closeStationSettings()" aria-label="關閉">×</button>
        </div>

        <div class="settings-school-card">
          <img id="settings-school-logo" class="settings-school-logo" src="/assets/app-icon.png" alt="校區 Logo" />
          <div class="settings-school-info">
            <div id="settings-school-name" class="settings-school-name">校區現場站</div>
            <div id="settings-school-code" class="settings-school-code">已啟用</div>
          </div>
        </div>

        <div class="settings-list">
          <button class="settings-row" onclick="refreshStationBrandingFromSettings()">
            <span class="settings-row-icon">↻</span>
            <span>
              <strong>重新整理品牌資料</strong>
              <small>更新校區 Logo 與名稱</small>
            </span>
          </button>
        </div>

        <div class="settings-danger">
          <button class="danger-logout-btn" onclick="requestStationLogout()">
            登出此現場站
          </button>
          <p>登出後，這台平板需要重新輸入校區代碼與 Super Admin 密碼才能使用學生入口與到校打卡。</p>
        </div>
      </aside>
    </div>

    <div id="station-logout-confirm" class="station-confirm-overlay">
      <div class="station-confirm-card glass" role="alertdialog" aria-modal="true">
        <div class="confirm-icon">⚠️</div>
        <h2>確定要登出此現場站嗎？</h2>
        <p>
          登出後，這台平板將不再保留校區現場站權限。<br>
          學生入口與到校打卡功能將無法繼續使用，必須重新輸入校區代碼與 Super Admin 密碼才能啟用。
        </p>
        <div class="confirm-actions">
          <button class="confirm-cancel-btn" onclick="closeStationLogoutConfirm()">取消</button>
          <button class="confirm-danger-btn" onclick="logoutStation()">確認登出</button>
        </div>
      </div>
    </div>

    <nav class="bottom-nav">
      <div class="bottom-inner">
        <button id="nav-student" class="nav-item active" onclick="showView('student')"><span class="nav-icon">🎒</span><span>學生入口</span></button>
        <button id="nav-checkin" class="nav-item" onclick="showView('checkin')"><span class="nav-icon">🪪</span><span>到校打卡</span></button>
      </div>
    </nav>
  </main>

  <script>
    const STATION_SESSION_KEY = 'tappie_station_session';
    const STATION_LAST_VIEW_KEY = 'tappie_station_last_view';
    const STATION_CHECKIN_MODE_KEY = 'tappie_station_checkin_mode';
    let stationSession = null;
    let currentView = 'student';
    let checkinMode = 'manual';
    let currentStudent = null;
    let scannerBuffer = '';
    let scannerTimer = null;
    let isProcessingScan = false;

    function getApiBaseUrl() {
      if (window.TappieAPI && TappieAPI.supabaseBaseUrl) return String(TappieAPI.supabaseBaseUrl).replace(/\/$/, '');
      return 'https://diptahklguohjtjnwnbf.supabase.co/functions/v1';
    }

    function isEditableElement(el = document.activeElement) {
      if (!el) return false;
      const tag = String(el.tagName || '').toUpperCase();
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
    }

    function shouldScannerFocus() {
      if (!stationSession) return false;
      if (document.getElementById('login-screen') && !document.getElementById('login-screen').classList.contains('hidden')) return false;
      if (isEditableElement() && document.activeElement?.id !== 'scanner-input') return false;
      return true;
    }

    function focusScanner() {
      if (!shouldScannerFocus()) return;
      setTimeout(() => {
        if (!shouldScannerFocus()) return;
        const input = document.getElementById('scanner-input');
        try { input && input.focus({ preventScroll: true }); } catch (_) { try { input && input.focus(); } catch (e) {} }
      }, 30);
    }

    function readStationSession() {
      try {
        const raw = localStorage.getItem(STATION_SESSION_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || parsed.stationAuthorized !== true || !parsed.schoolCode || !parsed.adminKey) return null;
        return parsed;
      } catch (_) { return null; }
    }

    function writeStationSession(session) {
      stationSession = { ...session, stationAuthorized: true, updatedAt: Date.now() };
      localStorage.setItem(STATION_SESSION_KEY, JSON.stringify(stationSession));
    }

    function showLoginError(message) {
      const el = document.getElementById('login-error');
      if (!el) return;
      el.innerText = message || '登入失敗';
      el.style.display = 'block';
    }

    function clearLoginError() {
      const el = document.getElementById('login-error');
      if (!el) return;
      el.innerText = '';
      el.style.display = 'none';
    }

    async function stationLogin(e) {
      clearLoginError();
      const schoolCode = String(document.getElementById('login-school')?.value || '').trim().toUpperCase();
      const secret = String(document.getElementById('login-secret')?.value || '').trim();
      if (!schoolCode || !secret) return showLoginError('請輸入校區代碼與 Super Admin 密碼。');

      const btn = e?.currentTarget || e?.target;
      const oldText = btn?.innerText;
      if (btn) { btn.disabled = true; btn.innerText = '驗證中...'; }
      try {
        const res = await fetch(`${getApiBaseUrl()}/admin-auth`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ schoolCode, secret })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success || !data.valid) throw new Error(data.message || data.error || '登入失敗');
        if (String(data.role || '') !== 'super') throw new Error('此現場站需使用 Super Admin 密碼啟用。');

        const branding = await loadBranding(schoolCode).catch(() => ({}));
        const brand = extractSchoolBranding({ ...branding, auth: data, school: data.school || branding.school }, schoolCode);
        writeStationSession({
          schoolCode,
          adminKey: secret,
          role: 'super',
          schoolName: brand.schoolName,
          logoUrl: brand.logoUrl
        });
        bootStation();
      } catch (err) {
        showLoginError(err.message || String(err));
      } finally {
        if (btn) { btn.disabled = false; btn.innerText = oldText || '啟用現場站'; }
      }
    }

    async function loadBranding(schoolCode) {
      if (window.TappieAPI && typeof TappieAPI.adminGetBranding === 'function') {
        const data = await TappieAPI.adminGetBranding(schoolCode);
        if (data && data.success !== false) return data;
      }
      const res = await fetch(`${getApiBaseUrl()}/admin-get-branding?schoolCode=${encodeURIComponent(schoolCode)}`);
      return await res.json().catch(() => ({}));
    }

    function extractSchoolBranding(raw, fallbackCode = '') {
      const data = raw || {};
      const auth = data.auth || {};
      const school = data.school || data.schoolData || data.currentSchool || auth.school || {};
      const branding = data.branding || data.config || data.settings || data.brandingConfig || {};
      const assets = data.assets || branding.assets || data.branding_assets || {};
      const schoolName =
        data.schoolName || data.school_name || data.name ||
        school.name || school.schoolName || school.school_name || school.schoolTitle || school.title ||
        auth.schoolName || auth.school_name || auth.name ||
        branding.schoolName || branding.school_name || branding.name || branding.school_title ||
        data.school?.name ||
        fallbackCode || '校區現場站';
      const logoUrl =
        data.logoUrl || data.logo_url || data.logo || data.logoURL ||
        school.logoUrl || school.logo_url || school.logo || school.logoURL || school.logo_url_public ||
        auth.logoUrl || auth.logo_url || auth.logo ||
        branding.logoUrl || branding.logo_url || branding.logo || branding.logoURL || branding.logo_url_public ||
        assets.logoUrl || assets.logo_url || assets.logo || assets.logo_url_public ||
        '/assets/app-icon.png';
      return { schoolName, logoUrl };
    }

    function bootStation() {
      stationSession = readStationSession();
      if (!stationSession) {
        document.getElementById('login-screen')?.classList.remove('hidden');
        document.getElementById('station-app')?.classList.add('hidden');
        return;
      }
      document.getElementById('login-screen')?.classList.add('hidden');
      document.getElementById('station-app')?.classList.remove('hidden');
      applyStationBranding();
      refreshStationBrandingIfNeeded();
      checkinMode = normalizeCheckinMode(localStorage.getItem(STATION_CHECKIN_MODE_KEY) || 'manual');
      setCheckinMode(checkinMode, { silent: true });
      const last = localStorage.getItem(STATION_LAST_VIEW_KEY) || 'student';
      showView(['student','checkin'].includes(last) ? last : 'student');
      const manualSchool = document.getElementById('manual-school-code');
      if (manualSchool) manualSchool.value = stationSession.schoolCode || '';
      focusScanner();
    }

    function applyStationBranding() {
      const brand = extractSchoolBranding(stationSession || {}, stationSession?.schoolCode || '');
      const name = brand.schoolName || stationSession?.schoolCode || '校區現場站';
      const logoUrl = brand.logoUrl || '/assets/app-icon.png';
      const nameEl = document.getElementById('station-school-name');
      if (nameEl) nameEl.innerText = name;
      const logoEl = document.getElementById('station-logo');
      if (logoEl) logoEl.src = logoUrl;
      document.querySelectorAll('.brand-watermark').forEach(img => { img.src = logoUrl; });
    }



    async function refreshStationBrandingIfNeeded(force = false) {
      try {
        if (!stationSession?.schoolCode) return;
        const currentName = String(stationSession.schoolName || '').trim();
        const looksLikeCodeOnly = !currentName || currentName === stationSession.schoolCode;
        const missingLogo = !stationSession.logoUrl || String(stationSession.logoUrl).includes('/assets/app-icon.png');
        if (!force && !looksLikeCodeOnly && !missingLogo) return;
        const branding = await loadBranding(stationSession.schoolCode);
        const brand = extractSchoolBranding(branding, stationSession.schoolCode);
        const next = {
          ...stationSession,
          schoolName: brand.schoolName || stationSession.schoolName,
          logoUrl: brand.logoUrl || stationSession.logoUrl
        };
        writeStationSession(next);
        applyStationBranding();
        console.info('[Station] branding refreshed', { schoolCode: next.schoolCode, schoolName: next.schoolName, logoUrl: next.logoUrl, raw: branding });
      } catch (err) {
        console.warn('[Station] branding refresh failed', err);
      }
    }

    function updateSettingsPanel() {
      const brand = extractSchoolBranding(stationSession || {}, stationSession?.schoolCode || '');
      const name = brand.schoolName || stationSession?.schoolName || stationSession?.schoolCode || '校區現場站';
      const logoUrl = brand.logoUrl || stationSession?.logoUrl || '/assets/app-icon.png';
      const nameEl = document.getElementById('settings-school-name');
      const codeEl = document.getElementById('settings-school-code');
      const logoEl = document.getElementById('settings-school-logo');
      if (nameEl) nameEl.innerText = name;
      if (codeEl) codeEl.innerText = stationSession?.schoolCode ? `校區代碼：${stationSession.schoolCode}` : '尚未啟用';
      if (logoEl) logoEl.src = logoUrl;
    }

    function openStationSettings() {
      updateSettingsPanel();
      document.getElementById('station-settings-overlay')?.classList.add('show');
    }

    function closeStationSettings() {
      document.getElementById('station-settings-overlay')?.classList.remove('show');
    }

    function handleSettingsBackdrop(event) {
      if (event.target && event.target.id === 'station-settings-overlay') closeStationSettings();
    }

    async function refreshStationBrandingFromSettings() {
      await refreshStationBrandingIfNeeded(true);
      applyStationBranding();
      updateSettingsPanel();
    }

    function requestStationLogout() {
      closeStationSettings();
      document.getElementById('station-logout-confirm')?.classList.add('show');
    }

    function closeStationLogoutConfirm() {
      document.getElementById('station-logout-confirm')?.classList.remove('show');
    }

    function logoutStation() {
      localStorage.removeItem(STATION_SESSION_KEY);
      localStorage.removeItem(STATION_LAST_VIEW_KEY);
      localStorage.removeItem(STATION_CHECKIN_MODE_KEY);
      stationSession = null;
      currentStudent = null;
      scannerBuffer = '';
      location.reload();
    }

    function showView(view) {
      if (!['student','checkin'].includes(view)) view = 'student';
      currentView = view;
      localStorage.setItem(STATION_LAST_VIEW_KEY, view);
      document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
      document.getElementById(`${view}-view`)?.classList.add('active');
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.getElementById(`nav-${view}`)?.classList.add('active');
      focusScanner();
    }

    function toggleStudentManual() {
      const form = document.getElementById('student-manual-form');
      const arrow = document.getElementById('manual-arrow');
      const open = !form?.classList.contains('show');
      form?.classList.toggle('show', open);
      if (arrow) arrow.innerText = open ? '⌃' : '⌄';
      if (open) {
        const school = document.getElementById('manual-school-code');
        if (school && !school.value) school.value = stationSession?.schoolCode || '';
        setTimeout(() => document.getElementById('manual-student-code')?.focus(), 40);
      } else {
        focusScanner();
      }
    }

    async function handleManualStudentLogin(e) {
      const schoolCode = String(stationSession?.schoolCode || '').trim().toUpperCase();
      const studentCode = String(document.getElementById('manual-student-code')?.value || '').trim().toUpperCase();
      if (!schoolCode) return alert('此現場站尚未取得校區代碼，請重新登入 Station。');
      if (!studentCode) return alert('請輸入學生代號。');
      const combinedUid = studentCode.includes('-') ? studentCode : `${schoolCode}-${studentCode}`;
      const btn = e?.currentTarget || e?.target;
      const oldText = btn?.innerText;
      if (btn) { btn.disabled = true; btn.innerText = '驗證中...'; }
      try {
        const data = await TappieAPI.resolveStudentByUid(combinedUid);
        if (!data || !data.success) throw new Error(data?.message || data?.msg || '查無此帳號');
        renderStudentCard('student-result', data, '正在進入學生中心...');
        setTimeout(() => { window.location.href = `dashboard.html?id=${encodeURIComponent(data.uid || combinedUid)}`; }, 420);
      } catch (err) {
        alert(err.message || String(err));
      } finally {
        if (btn) { btn.disabled = false; btn.innerText = oldText || '進入學生中心'; }
      }
    }

    function toggleCheckinManualInput() {
      if (checkinMode !== 'manual') return;
      const form = document.getElementById('checkin-manual-form');
      const arrow = document.getElementById('checkin-manual-arrow');
      const open = !form?.classList.contains('show');
      form?.classList.toggle('show', open);
      if (arrow) arrow.innerText = open ? '⌃' : '⌄';
      if (open) {
        const input = document.getElementById('checkin-manual-student-code');
        setTimeout(() => input?.focus(), 80);
      } else {
        focusScanner();
      }
    }

    async function handleManualCheckinLookup(e) {
      if (checkinMode !== 'manual') return;
      const schoolCode = String(stationSession?.schoolCode || '').trim().toUpperCase();
      const studentCode = String(document.getElementById('checkin-manual-student-code')?.value || '').trim().toUpperCase();
      if (!schoolCode) return alert('此現場站尚未取得校區代碼，請重新登入 Station。');
      if (!studentCode) return alert('請輸入學生代號。');
      const combinedUid = studentCode.includes('-') ? studentCode : `${schoolCode}-${studentCode}`;
      const btn = e?.currentTarget || e?.target;
      const oldText = btn?.innerText;
      if (btn) { btn.disabled = true; btn.innerText = '讀取中...'; }
      try {
        await handleScan(combinedUid);
        const input = document.getElementById('checkin-manual-student-code');
        if (input) input.value = '';
      } catch (err) {
        alert(err.message || String(err));
      } finally {
        if (btn) { btn.disabled = false; btn.innerText = oldText || '讀取學生'; }
      }
    }

    function normalizeCheckinMode(mode) {
      if (mode === 'auto_checkin' || mode === 'auto_checkout') return mode;
      return 'manual';
    }

    function getCheckinModeLabel(mode) {
      if (mode === 'auto_checkin') return '自動到校';
      if (mode === 'auto_checkout') return '自動離校';
      return '手動';
    }

    function getTapVisualHtml() {
      const brand = extractSchoolBranding(stationSession || {}, stationSession?.schoolCode || '');
      const logoUrl = brand.logoUrl || stationSession?.logoUrl || '/assets/app-icon.png';
      return `
        <div class="brand-scan-visual" aria-hidden="true">
          <div class="brand-glow"></div>
          <img class="brand-watermark" src="${escapeHtml(logoUrl)}" alt="" />
          <div class="scan-line"></div>
        </div>
        <div class="card-scan-line" aria-hidden="true"></div>
      `;
    }

    function renderWaitingCard(targetId, title = '請感應學生卡', sub = '') {
      const el = document.getElementById(targetId);
      if (!el) return;
      el.classList.remove('has-student');
      el.innerHTML = `${getTapVisualHtml()}<div class="waiting-title">${escapeHtml(title)}</div>${sub ? `<div class="waiting-sub">${escapeHtml(sub)}</div>` : ''}`;
    }

    function setCheckinMode(mode, options = {}) {
      checkinMode = normalizeCheckinMode(mode);
      localStorage.setItem(STATION_CHECKIN_MODE_KEY, checkinMode);
      document.getElementById('mode-manual')?.classList.toggle('active', checkinMode === 'manual');
      document.getElementById('mode-checkin')?.classList.toggle('active', checkinMode === 'auto_checkin');
      document.getElementById('mode-checkout')?.classList.toggle('active', checkinMode === 'auto_checkout');
      const manualActions = document.getElementById('manual-actions');
      if (manualActions) manualActions.classList.add('hidden');
      const checkinManualBox = document.getElementById('checkin-manual-box');
      const checkinManualForm = document.getElementById('checkin-manual-form');
      const checkinManualArrow = document.getElementById('checkin-manual-arrow');
      if (checkinManualBox) checkinManualBox.classList.toggle('hidden', checkinMode !== 'manual');
      if (checkinMode !== 'manual') {
        checkinManualForm?.classList.remove('show');
        if (checkinManualArrow) checkinManualArrow.innerText = '⌄';
      }
      const result = document.getElementById('checkin-result');
      if (!options.keepStudent && result) {
        currentStudent = null;
        renderWaitingCard('checkin-result', '請感應學生卡', `${getCheckinModeLabel(checkinMode)}模式`);
      }
      const log = document.getElementById('checkin-log');
      if (log && !options.silent) log.innerText = `目前模式：${getCheckinModeLabel(checkinMode)}。請感應學生卡。`;
      focusScanner();
    }

    function normalizeScanInput(raw) {
      let value = String(raw || '').trim();
      if (!value) return { raw: '', uid: '', cardId: '' };
      try {
        const url = new URL(value, window.location.origin);
        value = url.searchParams.get('uid') || url.searchParams.get('id') || url.searchParams.get('cardId') || url.searchParams.get('cardid') || value;
      } catch (_) {}
      value = String(value || '').trim();
      if (!value) return { raw: '', uid: '', cardId: '' };
      if (/^[A-Za-z0-9]+-\d+$/.test(value)) return { raw: value, uid: value, cardId: '' };
      if (/^\d+$/.test(value)) return { raw: value, uid: '', cardId: value };
      return { raw: value, uid: value, cardId: '' };
    }

    async function resolveScannedStudent(raw) {
      const scan = normalizeScanInput(raw);
      if (!scan.raw) throw new Error('沒有讀到卡號');
      let data = null;
      if (scan.uid && window.TappieAPI?.resolveStudentByUid) data = await TappieAPI.resolveStudentByUid(scan.uid);
      else if (scan.cardId && window.TappieAPI?.resolveStudentByCard) data = await TappieAPI.resolveStudentByCard(scan.cardId);
      else throw new Error('TappieAPI 尚未載入');
      if (!data || !data.success || !data.student) throw new Error(data?.message || data?.error || '查無此學生');
      return data;
    }

    function renderStudentCard(targetId, data, helperText = '') {
      const student = data.student || {};
      const tags = Array.isArray(student.tags) ? student.tags : [];
      const classCode = student.classCode || student.class_code || '未分班';
      const chips = [classCode, ...tags].filter(Boolean).map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('');
      const points = Number(student.points ?? 0);
      const el = document.getElementById(targetId);
      if (!el) return;
      el.classList.add('has-student');
      el.innerHTML = `
        <div class="student-info-card">
          <div class="student-name">${escapeHtml(student.name || '未命名學生')}</div>
          <div class="student-points">${Number.isFinite(points) ? points : 0} 點</div>
          <div class="chip-row">${chips || '<span class="chip">未分班</span>'}</div>
          ${helperText ? `<div class="student-status-note">${escapeHtml(helperText)}</div>` : ''}
        </div>
      `;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[ch]));
    }

    async function handleScan(raw) {
      if (!stationSession || isProcessingScan) return;
      isProcessingScan = true;
      try {
        const data = await resolveScannedStudent(raw);
        if (currentView === 'checkin') await handleCheckinStudent(data);
        else await handleStudentEntrance(data);
      } catch (err) {
        showScanError(err.message || String(err));
      } finally {
        isProcessingScan = false;
        scannerBuffer = '';
        focusScanner();
      }
    }

    async function handleStudentEntrance(data) {
      renderStudentCard('student-result', data, '正在進入學生中心...');
      const log = document.getElementById('student-log');
      if (log) log.innerText = `${data.student?.name || '學生'} 已辨識，準備進入 Dashboard。`;
      const uid = data.uid || data.student?.uid;
      setTimeout(() => { window.location.href = `dashboard.html?id=${encodeURIComponent(uid)}`; }, 520);
    }

    async function handleCheckinStudent(data) {
      currentStudent = data;
      renderStudentCard('checkin-result', data, checkinMode === 'manual' ? '請選擇到校或離校' : `正在執行${getCheckinModeLabel(checkinMode)}...`);
      if (checkinMode === 'auto_checkin') await recordAttendance('checkin', 'station_auto');
      else if (checkinMode === 'auto_checkout') await recordAttendance('checkout', 'station_auto');
      else {
        document.getElementById('manual-actions')?.classList.remove('hidden');
        const log = document.getElementById('checkin-log');
        if (log) log.innerText = `已讀取 ${data.student?.name || '學生'}，請選擇到校或離校。`;
      }
    }

    async function manualRecord(eventType) {
      if (!currentStudent) return alert('請先感應學生卡');
      await recordAttendance(eventType, 'station_manual');
    }

    async function recordAttendance(eventType, source) {
      if (!currentStudent) throw new Error('請先感應學生卡');
      const uid = currentStudent.uid || currentStudent.student?.uid;
      const actionText = eventType === 'checkout' ? '離校' : '到校';
      const log = document.getElementById('checkin-log');
      if (log) log.innerText = `正在登記${actionText}...`;
      const payload = {
        schoolCode: stationSession.schoolCode,
        uid,
        eventType,
        source,
        adminKey: stationSession.adminKey,
        role: 'super',
        metadata: { from: 'station', stationMode: checkinMode, stationSchoolCode: stationSession.schoolCode }
      };
      const data = await TappieAPI.adminRecordAttendance(payload);
      if (!data || !data.success) throw new Error(data?.message || data?.error || `登記${actionText}失敗`);
      const timeText = formatTaipeiTime(data?.event?.event_time || data?.event?.eventTime || data?.eventTime || new Date());
      if (log) log.innerText = `✅ ${currentStudent.student?.name || '學生'} 已登記${actionText}${timeText ? ' ' + timeText : ''}${data.duplicateRecent ? '（短時間重複，未新增第二筆）' : ''}`;
      renderStudentCard('checkin-result', currentStudent, `已登記${actionText}${timeText ? ' ' + timeText : ''}`);
    }

    function formatTaipeiTime(value) {
      const d = value ? new Date(value) : new Date();
      if (Number.isNaN(d.getTime())) return '';
      return d.toLocaleTimeString('zh-TW', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false });
    }

    function showScanError(message) {
      const target = currentView === 'checkin' ? 'checkin-log' : 'student-log';
      const el = document.getElementById(target);
      if (el) el.innerText = `⚠️ ${message || '讀卡失敗'}`;
    }

    document.getElementById('scanner-input')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const value = e.currentTarget.value;
        e.currentTarget.value = '';
        handleScan(value);
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeStationLogoutConfirm();
        closeStationSettings();
        return;
      }
      if (!stationSession) return;
      const active = document.activeElement;
      if (active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName) && active.id !== 'scanner-input') return;
      if (e.key === 'Enter') {
        const value = scannerBuffer.trim();
        scannerBuffer = '';
        if (value) handleScan(value);
        return;
      }
      if (e.key && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        scannerBuffer += e.key;
        clearTimeout(scannerTimer);
        scannerTimer = setTimeout(() => {
          const value = scannerBuffer.trim();
          scannerBuffer = '';
          if (value && value.length >= 6) handleScan(value);
        }, 360);
      }
    }, true);

    document.addEventListener('pointerdown', () => { if (!isEditableElement()) focusScanner(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) focusScanner(); });
    bootStation();
  </script>
</body>
</html>
