<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tappie學美語">
  <link rel="apple-touch-icon" href="/assets/app-icon.png">
  <title>Tappie 學生捷徑</title>
  <style>
    :root {
      --blue: #0066cc;
      --gold: #f1c40f;
      --text: #172033;
      --muted: #667085;
      --bg: #f5f7fb;
      --card: rgba(255,255,255,.86);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(22px, env(safe-area-inset-top)) 22px max(22px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 20% 8%, rgba(0,102,204,.18), transparent 34%),
        radial-gradient(circle at 92% 88%, rgba(241,196,15,.22), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    .card {
      width: min(440px, 100%);
      border-radius: 32px;
      padding: 30px 24px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.9);
      box-shadow: 0 24px 72px rgba(15,23,42,.14);
      text-align: center;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }
    .icon {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--blue), #5aa7ff);
      color: #fff;
      font-size: 34px;
      box-shadow: 0 16px 32px rgba(0,102,204,.28);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      letter-spacing: -.06em;
      line-height: 1.12;
    }
    .student-name {
      margin: 0 0 18px;
      color: var(--blue);
      font-weight: 900;
      font-size: 18px;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.72;
      font-weight: 650;
    }
    .steps {
      margin-top: 22px;
      padding: 18px;
      border-radius: 22px;
      background: rgba(255,255,255,.68);
      text-align: left;
      color: #344054;
      font-weight: 750;
      line-height: 1.7;
    }
    .steps strong { color: var(--text); }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 54px;
      margin-top: 18px;
      border: 0;
      border-radius: 18px;
      background: var(--blue);
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 14px 26px rgba(0,102,204,.22);
    }
    .button.secondary {
      background: rgba(16,24,40,.08);
      color: #344054;
      box-shadow: none;
    }
    .small {
      margin-top: 14px;
      font-size: 13px;
      color: #98a2b3;
    }
  </style>
</head>
<body>
  <main class="card" id="card">
    <div class="icon">🪄</div>
    <h1>正在準備 Tappie 學生捷徑</h1>
    <p>請稍候...</p>
  </main>

  <script src="./tappie-api.js?v=student-app-v1"></script>
  <script src="./tappie-student-session.js?v=student-session-v1"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const rawUid = String(params.get("uid") || params.get("id") || "").trim();
    const isInstallSetup = String(window.location.hash || "").toLowerCase() === "#install";
    const card = document.getElementById("card");

    function renderError(message) {
      card.innerHTML = `
        <div class="icon">⚠️</div>
        <h1>無法建立捷徑</h1>
        <p>${message}</p>
        <button class="button secondary" onclick="location.replace('/index.html')">回到 Tappie</button>
      `;
    }

    function renderInstallGuide(studentName) {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || "") && !window.MSStream;
      const title = studentName ? `建立「${studentName}」的 Tappie 捷徑` : "建立 Tappie 學生捷徑";
      const steps = isIOS
        ? `1. 點選 Safari 下方或上方的 <strong>分享</strong> 圖示<br>2. 向下滑動並選擇 <strong>加入主畫面</strong><br>3. 按下 <strong>加入</strong>`
        : `1. 點選瀏覽器右上角 <strong>⋮</strong> 選單<br>2. 選擇 <strong>加到主畫面</strong><br>3. 完成後從主畫面開啟 Tappie`;

      card.innerHTML = `
        <div class="icon">📱</div>
        <h1>${title}</h1>
        <p>請在這個頁面加入主畫面。完成後，下次從主畫面開啟，就會直接進入這位學生的 Tappie。</p>
        <div class="steps">${steps}</div>
        <button class="button secondary" onclick="openOnce()">先直接開啟學生主頁</button>
        <p class="small">這個頁面是學生專屬捷徑入口，請不要轉傳給他人。</p>
      `;
    }

    function openStudentDashboard(uid, source) {
      if (!uid) return renderError("缺少學生代碼，請重新感應卡片。");
      TappieStudentSession.setActive(uid, source || "student-app");
      window.location.replace("/dashboard.html");
    }

    function openOnce() {
      openStudentDashboard(rawUid, "student-app-open-once");
    }

    async function init() {
      if (!rawUid) {
        renderError("缺少學生代碼，請重新感應卡片或回到官網登入。");
        return;
      }

      try {
        const result = await TappieAPI.resolveStudentByUid(rawUid);
        const uid = result.uid || rawUid;
        const studentName = result.studentName || result.name || result.student?.name || "";

        // Dashboard 的「加入主畫面」按鈕會使用 #install 進入本頁。
        // 進入後立刻把 hash 從網址移除，讓使用者真正加入主畫面的 URL 是：
        // /student-app.html?uid=TP01-xxxx，而不是 /student-app.html?uid=TP01-xxxx#install。
        if (isInstallSetup) {
          try {
            const cleanUrl = `${window.location.pathname}?uid=${encodeURIComponent(uid)}`;
            window.history.replaceState(null, document.title, cleanUrl);
          } catch (_) {}
          renderInstallGuide(studentName);
          return;
        }

        // 沒有 #install 時，一律視為「啟動學生捷徑」。
        // 這樣即使某些手機把主畫面捷徑開成普通瀏覽器模式，而不是 standalone，
        // 也能正確建立 active student session 並進入 dashboard。
        openStudentDashboard(uid, "student-app");
      } catch (err) {
        console.error(err);
        renderError(err.message || "找不到此學生，請重新感應卡片或洽詢老師。");
      }
    }

    init();
  </script>
</body>
</html>
