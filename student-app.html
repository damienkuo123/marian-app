<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0066cc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tappie學美語">
  <link rel="apple-touch-icon" href="/assets/app-icon.png">
  <link rel="icon" href="/assets/app-icon.png">
  <title>Tappie 學生捷徑</title>
  <script>
    // Standalone / PWA 開啟時，越早隱藏 router loading，避免主畫面捷徑啟動時看到引導頁或 loading。
    (function () {
      try {
        const params = new URLSearchParams(window.location.search);
        const hasUid = String(params.get("uid") || params.get("id") || "").trim();
        const isInstallSetup = String(window.location.hash || "").toLowerCase() === "#install";
        const isDisplayMode = function (mode) {
          return window.matchMedia && window.matchMedia("(display-mode: " + mode + ")").matches;
        };
        const isStandaloneLike =
          window.navigator.standalone === true ||
          isDisplayMode("standalone") ||
          isDisplayMode("fullscreen") ||
          isDisplayMode("minimal-ui");

        if (hasUid && isStandaloneLike && !isInstallSetup) {
          document.documentElement.classList.add("standalone-fast-route");
        }
      } catch (_) {}
    })();
  </script>
  <style>
    :root { 
      --primary-blue: #0066cc; 
      --marian-yellow: #f39c12; 
      --marian-green: #2ecc71; 
      --marian-red: #e74c3c; 
      --gold: #f1c40f; 
      
      /* Dashboard 對齊：VisionOS 白玉毛玻璃 */
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-bg-strong: rgba(255, 255, 255, 0.82);
      --glass-border: rgba(255, 255, 255, 0.9);
      --glass-shadow: 0 15px 35px rgba(0, 0, 0, 0.05), inset 0 1px 1px rgba(255, 255, 255, 1), inset 0 -1px 1px rgba(255, 255, 255, 0.3);
      --text-main: #1a252f;
      --text-sub: #7f8c8d;
      --line-soft: rgba(255, 255, 255, 0.9);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; margin: 0; padding: 0; width: 100%; background-color: #f0f4f8; }

    html.standalone-fast-route body {
      opacity: 0;
      pointer-events: none;
    }

    html.standalone-fast-route .shell {
      display: none;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(22px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      color: var(--text-main);
      font-family: 'PingFang TC', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      z-index: -1;
      pointer-events: none;
      animation: floatOrb 16s infinite alternate ease-in-out;
    }

    body::before {
      width: 350px;
      height: 350px;
      background: rgba(0, 102, 204, 0.24);
      top: -90px;
      left: -150px;
    }

    body::after {
      width: 390px;
      height: 390px;
      background: rgba(243, 156, 18, 0.18);
      right: -160px;
      bottom: -70px;
      animation-delay: -5s;
    }

    @keyframes floatOrb { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(38px, -34px) scale(1.16); } }

    button,
    input,
    textarea,
    select { font: inherit; }

    .shell {
      width: min(430px, 100%);
      position: relative;
    }

    .shell::before {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 999px;
      background: rgba(46, 204, 113, 0.12);
      filter: blur(46px);
      top: 36%;
      left: 18%;
      z-index: -1;
      pointer-events: none;
    }

    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(35px) saturate(180%);
      -webkit-backdrop-filter: blur(35px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 36px;
      width: 100%;
      box-sizing: border-box;
      padding: 22px;
      position: relative;
      overflow: hidden;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.54), transparent 34%);
      pointer-events: none;
    }

    .content { position: relative; z-index: 1; }

    .hero {
      min-height: 205px;
      border-radius: 32px;
      padding: 28px 22px 26px;
      background: linear-gradient(145deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.54) 100%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,1);
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 32px;
      padding: 2px;
      background: linear-gradient(135deg, rgba(0,102,204,0.35), transparent 58%, rgba(241,196,15,0.24));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .app-icon-wrap {
      width: 92px;
      height: 92px;
      margin: 0 auto 18px;
      border-radius: 28px;
      padding: 7px;
      background: linear-gradient(135deg, rgba(255,255,255,1), rgba(255,255,255,0.55));
      border: 1px solid rgba(255,255,255,0.92);
      box-shadow: 0 14px 30px rgba(0, 102, 204, 0.15), inset 0 1px 0 rgba(255,255,255,1);
      position: relative;
      z-index: 1;
    }

    .app-icon {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 23px;
      object-fit: cover;
      background: linear-gradient(135deg, var(--primary-blue), #62b5ff);
    }

    .fallback-icon {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      border-radius: 23px;
      background: linear-gradient(135deg, var(--primary-blue), #62b5ff);
      color: white;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .eyebrow {
      background: linear-gradient(135deg, #fff, #fffaf0);
      color: #d35400;
      padding: 8px 18px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      margin-bottom: 16px;
      border: 1px solid rgba(241, 196, 15, 0.6);
      box-shadow: 0 8px 20px rgba(241, 196, 15, 0.16);
      letter-spacing: 1px;
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 0;
      color: var(--text-main);
      font-size: clamp(25px, 7vw, 31px);
      line-height: 1.18;
      letter-spacing: 1px;
      font-weight: 900;
      text-shadow: 0 2px 4px rgba(0,0,0,0.04);
      position: relative;
      z-index: 1;
    }

    .student-name {
      color: var(--primary-blue);
      font-weight: 900;
      white-space: nowrap;
    }

    .subtitle {
      max-width: 330px;
      margin: 14px auto 0;
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 900;
      line-height: 1.7;
      letter-spacing: 0.5px;
      position: relative;
      z-index: 1;
    }

    .benefits {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin: 18px 0;
    }

    .benefit {
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 14px;
      align-items: center;
      padding: 17px;
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.5) 100%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 14px 28px rgba(0,0,0,0.045), inset 0 1px 0 rgba(255,255,255,1);
      text-align: left;
    }

    .benefit-icon {
      width: 58px;
      height: 58px;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,1), rgba(255,255,255,0.55));
      box-shadow: 0 10px 20px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,1);
      border: 1px solid rgba(255,255,255,0.85);
    }

    .benefit-title {
      margin: 0 0 6px;
      color: var(--text-main);
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1.25;
    }

    .benefit-copy {
      margin: 0;
      color: var(--text-sub);
      font-size: 13px;
      line-height: 1.62;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .guide {
      padding: 20px;
      border-radius: 28px;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--glass-border);
      box-shadow: 0 14px 32px rgba(0,0,0,0.045), inset 0 1px 0 rgba(255,255,255,1);
      text-align: left;
    }

    .guide-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .guide-title {
      margin: 0;
      color: var(--text-main);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1.3;
    }

    .device-pill {
      flex: 0 0 auto;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(0,102,204,0.08);
      color: var(--primary-blue);
      border: 1px solid rgba(0,102,204,0.08);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .steps {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .step {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 11px;
      align-items: start;
      color: #344054;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.65;
      letter-spacing: 0.1px;
    }

    .step-num {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(0,102,204,0.08);
      color: var(--primary-blue);
      font-size: 12px;
      font-weight: 900;
      box-shadow: inset 0 1px 0 rgba(255,255,255,1);
    }

    .step strong { color: var(--text-main); font-weight: 900; }

    .notice {
      margin: 14px 0 0;
      padding: 13px 14px;
      border-radius: 18px;
      background: rgba(255,255,255,0.58);
      border: 1px solid rgba(255,255,255,0.86);
      color: var(--text-sub);
      font-size: 12px;
      line-height: 1.58;
      font-weight: 800;
      text-align: left;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .button {
      width: 100%;
      min-height: 58px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: 20px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
    }

    .button::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255,255,255,0.3), transparent);
      pointer-events: none;
    }

    .button:active { transform: scale(0.97); }

    .button.primary {
      color: #fff;
      background: linear-gradient(135deg, var(--primary-blue), #4ba3ff);
      box-shadow: 0 10px 25px rgba(0, 102, 204, 0.32), inset 0 -4px 0 rgba(0,0,0,0.08);
      border: 1px solid rgba(255,255,255,0.4);
    }

    .button.secondary {
      color: var(--primary-blue);
      background: rgba(255,255,255,0.62);
      box-shadow: 0 4px 15px rgba(0, 102, 204, 0.08);
      border: 1px solid rgba(255,255,255,1);
    }

    .button.hidden { display: none; }

    .footer-note {
      margin: 14px 4px 0;
      color: var(--text-sub);
      opacity: 0.82;
      font-size: 12px;
      line-height: 1.55;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.2px;
    }

    .loading,
    .error {
      min-height: 520px;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .loading-mark {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--primary-blue), #4ba3ff);
      color: #fff;
      font-size: 30px;
      box-shadow: 0 18px 38px rgba(0,102,204,0.24), inset 0 -3px 0 rgba(0,0,0,0.08);
      border: 1px solid rgba(255,255,255,0.4);
    }

    .loading h1,
    .error h1 {
      color: var(--text-main);
      font-size: 26px;
      line-height: 1.18;
      letter-spacing: 1px;
      font-weight: 900;
    }

    .loading p,
    .error p {
      max-width: 310px;
      margin: 12px auto 0;
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.65;
    }

    .spinner {
      width: 55px;
      height: 55px;
      border: 4px solid rgba(0, 102, 204, 0.1);
      border-top: 4px solid var(--primary-blue);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 24px auto 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (min-width: 430px) {
      .benefits { grid-template-columns: 1fr 1fr; }
      .benefit { grid-template-columns: 1fr; align-items: start; }
    }

    @media (max-width: 360px) {
      .card { padding: 18px; border-radius: 32px; }
      .hero { padding: 24px 18px; }
      .benefit { grid-template-columns: 50px 1fr; padding: 15px; }
      .benefit-icon { width: 50px; height: 50px; font-size: 26px; }
      .guide-top { align-items: flex-start; flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" id="card">
      <div class="content loading">
        <div>
          <div class="loading-mark">🪄</div>
          <h1>正在準備 Tappie 學生捷徑</h1>
          <p>正在確認學生資料與校區 App 圖示。</p>
          <div class="spinner" aria-hidden="true"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="./tappie-api.js?v=student-app-ui-v4"></script>
  <script src="./tappie-student-session.js?v=student-session-v1"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const rawUid = String(params.get("uid") || params.get("id") || "").trim();
    const isInstallSetup = String(window.location.hash || "").toLowerCase() === "#install";

    function isDisplayMode(mode) {
      return window.matchMedia && window.matchMedia(`(display-mode: ${mode})`).matches;
    }

    function isStandaloneMode() {
      return window.navigator.standalone === true ||
        isDisplayMode("standalone") ||
        isDisplayMode("fullscreen") ||
        isDisplayMode("minimal-ui");
    }

    const isStandalone = isStandaloneMode();
    const shouldFastRouteStandalone = !!rawUid && isStandalone && !isInstallSetup;
    const DEFAULT_ICON_URL = "/assets/app-icon.png";
    const card = document.getElementById("card");

    let resolvedUid = rawUid;
    let resolvedStudentName = "";
    let resolvedSchoolName = "";
    let resolvedIconUrl = DEFAULT_ICON_URL;
    let deferredPrompt = null;
    let manifestObjectUrl = "";

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
      updateNativeInstallButtonVisibility();
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch((err) => console.log("SW 註冊失敗", err));
      });
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function detectInstallEnvironment() {
      const ua = navigator.userAgent || navigator.vendor || window.opera || "";
      const isIPadOS = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
      const isIOS = /iPad|iPhone|iPod/i.test(ua) || isIPadOS;
      const isAndroid = /Android/i.test(ua);
      const isLineOrSocial = /Line|FBAN|FBAV|Instagram/i.test(ua);
      const isCriOS = /CriOS/i.test(ua);
      const isChrome = /Chrome|CriOS/i.test(ua) && !/Edg\//i.test(ua);
      const isEdge = /Edg\//i.test(ua);
      const isSamsung = /SamsungBrowser/i.test(ua);
      const isFirefox = /Firefox|FxiOS/i.test(ua);
      const isSafari = /Safari/i.test(ua) && !/Chrome|CriOS|FxiOS|Edg\//i.test(ua) && !/Android/i.test(ua);
      const isDesktop = !isIOS && !isAndroid;

      let label = "手機瀏覽器";
      if (isLineOrSocial) label = "內建瀏覽器";
      else if (isIOS && isSafari) label = "iOS Safari";
      else if (isIOS) label = "iPhone / iPad";
      else if (isAndroid && isSamsung) label = "Android Samsung";
      else if (isAndroid && isEdge) label = "Android Edge";
      else if (isAndroid && isChrome) label = "Android Chrome";
      else if (isAndroid) label = "Android";
      else if (isDesktop) label = "電腦瀏覽器";

      return { ua, isIOS, isAndroid, isSafari, isChrome, isSamsung, isEdge, isFirefox, isLineOrSocial, isDesktop, label };
    }

    function getInstallSteps(env) {
      if (env.isLineOrSocial) {
        return {
          title: "請先用正式瀏覽器開啟",
          note: "LINE、Facebook、Instagram 內建瀏覽器通常不能完整加入主畫面或啟用通知。請先用 Safari 或 Chrome 開啟後再操作。",
          steps: [
            "點右上角的 <strong>⋯</strong> 或 <strong>分享</strong> 選單。",
            "選擇 <strong>以 Safari 開啟</strong> 或 <strong>以 Chrome 開啟</strong>。",
            "回到本頁後，再依照加入主畫面的提示完成設定。"
          ]
        };
      }

      if (env.isIOS) {
        return {
          title: env.isSafari ? "iPhone / iPad 加入方式" : "建議改用 Safari 加入",
          note: env.isSafari
            ? "iOS 需要透過 Safari 的分享選單加入主畫面。完成後，主畫面會出現學生專屬 Tappie 圖示。"
            : "iPhone / iPad 建議使用 Safari 加入主畫面，圖示與全螢幕 App 體驗會比較穩定。",
          steps: [
            "點選 Safari 下方或上方的 <strong>分享</strong> 圖示。",
            "向下滑動，選擇 <strong>加入主畫面</strong>。",
            "確認名稱與圖示後，按下 <strong>加入</strong>。"
          ]
        };
      }

      if (env.isAndroid) {
        return {
          title: "Android 加入方式",
          note: "不同 Android 瀏覽器的字樣可能不同，常見名稱包含「安裝應用程式」、「加到主畫面」、「新增到主畫面」或「加入桌面」。",
          steps: [
            "點選瀏覽器右上角的 <strong>⋮</strong> 選單。",
            "選擇 <strong>安裝應用程式</strong>、<strong>加到主畫面</strong> 或類似選項。",
            "完成後，從手機主畫面的 Tappie 圖示開啟。"
          ]
        };
      }

      return {
        title: "電腦瀏覽器提示",
        note: "這個捷徑主要設計給手機和平板使用。若瀏覽器網址列出現安裝圖示，也可以安裝成桌面 App。",
        steps: [
          "檢查網址列右側是否出現 <strong>安裝</strong> 或 <strong>下載</strong> 圖示。",
          "依照瀏覽器提示完成安裝。",
          "學生平常仍建議使用手機主畫面捷徑開啟。"
        ]
      };
    }

    function getFirstDefined(...values) {
      for (const value of values) {
        if (value !== undefined && value !== null && String(value).trim()) return value;
      }
      return "";
    }

    async function getDashboardBranding(uid) {
      try {
        if (!window.TappieAPI || !uid) return null;
        if (typeof TappieAPI._get === "function" && TappieAPI.endpoints?.getDashboard) {
          return await TappieAPI._get(`${TappieAPI.endpoints.getDashboard}?uid=${encodeURIComponent(uid)}`);
        }
        if (typeof TappieAPI.getDashboard === "function") {
          return await TappieAPI.getDashboard(uid);
        }
      } catch (err) {
        console.warn("student-app getDashboard branding failed", err);
      }
      return null;
    }

    function setOrCreateLink(rel, href) {
      let link = document.querySelector(`link[rel="${rel}"]`);
      if (!link) {
        link = document.createElement("link");
        link.rel = rel;
        document.head.appendChild(link);
      }
      link.href = href;
      return link;
    }

    function updateInstallAssets({ uid, studentName, schoolName, iconUrl }) {
      const finalUid = uid || rawUid || "";
      const finalStudentName = String(studentName || "Tappie").trim();
      const finalSchoolName = String(schoolName || "").trim();
      const finalIconUrl = String(iconUrl || DEFAULT_ICON_URL).trim() || DEFAULT_ICON_URL;
      const appTitle = finalStudentName && finalStudentName !== "Tappie"
        ? `${finalStudentName}｜Tappie`
        : "Tappie 學美語";

      document.title = `${appTitle} 學生捷徑`;

      const appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (appleTitle) appleTitle.setAttribute("content", finalStudentName && finalStudentName !== "Tappie" ? finalStudentName : "Tappie學美語");

      setOrCreateLink("apple-touch-icon", finalIconUrl);
      setOrCreateLink("icon", finalIconUrl);

      const manifestJSON = {
        name: finalStudentName && finalStudentName !== "Tappie" ? `Tappie - ${finalStudentName}` : "Tappie 學美語",
        short_name: finalStudentName && finalStudentName.length <= 12 ? finalStudentName : "Tappie",
        description: finalSchoolName ? `${finalSchoolName} Tappie 學生主頁` : "Tappie 學生主頁",
        start_url: `/student-app.html?uid=${encodeURIComponent(finalUid)}`,
        scope: "/",
        display: "standalone",
        background_color: "#eef5ff",
        theme_color: "#0066cc",
        icons: [
          {
            src: finalIconUrl,
            sizes: "192x192 512x512",
            type: "image/png",
            purpose: "any maskable"
          }
        ]
      };

      const blob = new Blob([JSON.stringify(manifestJSON)], { type: "application/manifest+json" });
      const manifestUrl = URL.createObjectURL(blob);
      setOrCreateLink("manifest", manifestUrl);

      if (manifestObjectUrl) {
        setTimeout(() => URL.revokeObjectURL(manifestObjectUrl), 30000);
      }
      manifestObjectUrl = manifestUrl;
    }

    function updateNativeInstallButtonVisibility() {
      const btn = document.getElementById("native-install-btn");
      if (!btn) return;
      btn.classList.toggle("hidden", !deferredPrompt);
    }

    async function requestNativeInstall() {
      if (!deferredPrompt) return;
      const promptEvent = deferredPrompt;
      deferredPrompt = null;
      updateNativeInstallButtonVisibility();

      try {
        promptEvent.prompt();
        await promptEvent.userChoice;
      } catch (err) {
        console.warn("PWA install prompt failed", err);
      }
    }

    function renderError(message) {
      card.innerHTML = `
        <div class="content error">
          <div class="loading-mark">⚠️</div>
          <h1>無法建立學生捷徑</h1>
          <p>${escapeHtml(message || "請重新感應卡片，或洽詢老師確認學生資料。")}</p>
          <div class="actions">
            <button class="button secondary" onclick="location.replace('/index.html')">返回主頁</button>
          </div>
        </div>
      `;
    }

    function renderInstallGuide() {
      const env = detectInstallEnvironment();
      const guide = getInstallSteps(env);
      const safeStudentName = escapeHtml(resolvedStudentName || "學生");
      const safeSchoolName = escapeHtml(resolvedSchoolName || "Tappie");
      const safeIconUrl = escapeHtml(resolvedIconUrl || DEFAULT_ICON_URL);
      const stepsHtml = guide.steps.map((step, index) => `
        <li class="step">
          <span class="step-num">${index + 1}</span>
          <span>${step}</span>
        </li>
      `).join("");

      card.innerHTML = `
        <div class="content">
          <section class="hero">
            <div class="app-icon-wrap">
              <img class="app-icon" src="${safeIconUrl}" alt="Tappie App icon" onerror="this.outerHTML='<div class=&quot;fallback-icon&quot;>T</div>'">
            </div>
            <div class="eyebrow">${safeSchoolName}｜學生專屬捷徑</div>
            <h1>把 <span class="student-name">${safeStudentName}</span> 的 Tappie 加到主畫面</h1>
            <p class="subtitle">完成後，這台手機會出現學生專屬 Tappie App 圖示。</p>
          </section>

          <section class="benefits" aria-label="加入主畫面的好處">
            <article class="benefit">
              <div class="benefit-icon">⚡</div>
              <div>
                <h2 class="benefit-title">下次無需嗶卡</h2>
                <p class="benefit-copy">點擊 App 直接登入學生主頁，練習、點數與任務更快開始。</p>
              </div>
            </article>
            <article class="benefit">
              <div class="benefit-icon">🔔</div>
              <div>
                <h2 class="benefit-title">接收學生的上放學通知</h2>
                <p class="benefit-copy">在學生主頁開啟通知後，可接收到校、離校等即時提醒。</p>
              </div>
            </article>
          </section>

          <section class="guide" aria-label="加入主畫面教學">
            <div class="guide-top">
              <h2 class="guide-title">${escapeHtml(guide.title)}</h2>
              <span class="device-pill">${escapeHtml(env.label)}</span>
            </div>
            <ol class="steps">${stepsHtml}</ol>
            <p class="notice">${escapeHtml(guide.note)}</p>
          </section>

          <div class="actions">
            <button id="native-install-btn" class="button primary hidden" onclick="requestNativeInstall()">開啟安裝提示</button>
            <button class="button secondary" onclick="openStudentDashboard(resolvedUid, 'student-app-return-home')">返回主頁</button>
          </div>
          <p class="footer-note">這是學生專屬捷徑入口，請不要轉傳給他人。</p>
        </div>
      `;

      updateNativeInstallButtonVisibility();
    }

    function openStudentDashboard(uid, source) {
      const finalUid = String(uid || resolvedUid || rawUid || "").trim();
      if (!finalUid) {
        renderError("缺少學生代碼，請重新感應卡片。");
        return;
      }

      if (window.TappieStudentSession && typeof TappieStudentSession.setActive === "function") {
        TappieStudentSession.setActive(finalUid, source || "student-app");
      }
      window.location.replace("/dashboard.html");
    }

    async function init() {
      if (!rawUid) {
        document.documentElement.classList.remove("standalone-fast-route");
        renderError("缺少學生代碼，請重新感應卡片或回到官網登入。");
        return;
      }

      // 主畫面 App / standalone 模式：student-app.html 只當超快 router。
      // 不等 resolve-student / get-dashboard，不顯示 loading，不重新處理 icon；資料驗證交給 dashboard。
      if (shouldFastRouteStandalone) {
        openStudentDashboard(rawUid, "student-app-standalone-fast");
        return;
      }

      document.documentElement.classList.remove("standalone-fast-route");

      try {
        const result = await TappieAPI.resolveStudentByUid(rawUid);
        if (!result || result.success === false) {
          throw new Error(result?.message || "找不到此學生，請重新感應卡片或洽詢老師。");
        }

        resolvedUid = String(result.uid || result.student?.uid || rawUid).trim();
        resolvedStudentName = String(getFirstDefined(result.studentName, result.name, result.student?.name)).trim();
        resolvedSchoolName = String(getFirstDefined(result.school?.name, result.school?.schoolName, result.school?.schoolCode)).trim();

        const dashboardData = await getDashboardBranding(resolvedUid);
        if (dashboardData && dashboardData.success !== false) {
          resolvedStudentName = String(getFirstDefined(
            dashboardData.studentName,
            dashboardData.student?.name,
            resolvedStudentName
          )).trim();
          resolvedSchoolName = String(getFirstDefined(
            dashboardData.school?.name,
            dashboardData.schoolName,
            resolvedSchoolName
          )).trim();
          resolvedIconUrl = String(getFirstDefined(
            dashboardData.iconUrl,
            dashboardData.school?.iconUrl,
            dashboardData.branding?.iconUrl,
            DEFAULT_ICON_URL
          )).trim();
        }

        updateInstallAssets({
          uid: resolvedUid,
          studentName: resolvedStudentName,
          schoolName: resolvedSchoolName,
          iconUrl: resolvedIconUrl
        });

        // 保險 fallback：若早期 fast path 未命中，但後續判定為 standalone，仍直接進 dashboard。
        if (isStandalone && !isInstallSetup) {
          openStudentDashboard(resolvedUid, "student-app-standalone");
          return;
        }

        // Dashboard 的「加入主畫面」會導到 #install；這裡保留引導頁，不自動跳走。
        if (isInstallSetup) {
          renderInstallGuide();
          return;
        }

        // 一般瀏覽器直接開 student-app.html?uid=... 時，視為一次性進入主頁。
        openStudentDashboard(resolvedUid, "student-app-direct");
      } catch (err) {
        console.error(err);
        renderError(err.message || "找不到此學生，請重新感應卡片或洽詢老師。");
      }
    }

    init();
  </script>
</body>
</html>
