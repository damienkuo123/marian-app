<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tappie Scroll Video Test</title>
  <style>
    :root {
      --bg: #f7f7f4;
      --ink: #111827;
      --muted: #6b7280;
      --line: rgba(17,24,39,.12);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { overflow-x: hidden; }

    .top-note {
      position: fixed;
      z-index: 30;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.74);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 13px;
      color: rgba(17,24,39,.72);
      white-space: nowrap;
      box-shadow: 0 10px 40px rgba(17,24,39,.08);
    }

    .scroll-hero {
      position: relative;
      height: 520vh;
      background: var(--bg);
    }

    .sticky-stage {
      position: sticky;
      top: 0;
      height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background: var(--bg);
      isolation: isolate;
    }

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      background: var(--bg);
      z-index: 1;
    }

    .soft-vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(247,247,244,.32), rgba(247,247,244,0) 22%, rgba(247,247,244,0) 70%, rgba(247,247,244,.54)),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 42%, rgba(247,247,244,.24) 100%);
    }

    .hero-copy {
      position: absolute;
      z-index: 5;
      left: clamp(20px, 7vw, 92px);
      bottom: clamp(28px, 8vh, 86px);
      max-width: 460px;
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.66);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 6vw, 84px);
      line-height: .94;
      letter-spacing: -0.07em;
      font-weight: 780;
    }

    .sub {
      margin: 16px 0 0;
      font-size: clamp(15px, 1.7vw, 20px);
      line-height: 1.6;
      color: rgba(17,24,39,.66);
      max-width: 360px;
    }

    .progress-wrap {
      position: fixed;
      z-index: 31;
      left: 18px;
      right: 18px;
      bottom: 14px;
      height: 4px;
      border-radius: 999px;
      background: rgba(17,24,39,.08);
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: rgba(17,24,39,.58);
      transform-origin: left center;
    }

    .after {
      min-height: 90vh;
      display: grid;
      place-items: center;
      padding: 80px 24px;
      background: white;
      text-align: center;
    }

    .after-inner { max-width: 760px; }
    .after h2 { font-size: clamp(32px, 5vw, 64px); line-height: 1.02; letter-spacing: -0.055em; margin: 0 0 18px; }
    .after p { font-size: 18px; line-height: 1.8; color: rgba(17,24,39,.62); margin: 0; }

    @media (max-width: 768px) {
      .scroll-hero { height: 560vh; }
      .top-note { top: 12px; font-size: 12px; }
      .hero-copy {
        left: 20px;
        right: 20px;
        bottom: 34px;
        max-width: none;
      }
      .sub { max-width: 300px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scroll-hero { height: 100vh; }
      .hero-video { object-fit: cover; }
      .progress-wrap { display: none; }
    }
  </style>
</head>
<body>
  <div class="top-note">Scroll Video Test · Tappie Hero</div>
  <div class="progress-wrap" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>

  <main>
    <section class="scroll-hero" id="scrollHero">
      <div class="sticky-stage">
        <video
          id="heroVideo"
          class="hero-video"
          muted
          playsinline
          webkit-playsinline
          preload="auto"
          crossorigin="anonymous"
        >
          <source src="https://www.tappieapp.com/assets/video/tappie-hero-scroll.webm" type="video/webm" />
        </video>
        <div class="soft-vignette"></div>
        <div class="hero-copy">
          <div class="eyebrow">NFC Speaking Card</div>
          <h1>Tap.<br>Speak.<br>Grow.</h1>
          <p class="sub">把學生每天戴的名牌，變成開口說英文的入口。</p>
        </div>
      </div>
    </section>

    <section class="after">
      <div class="after-inner">
        <h2>測試頁結束</h2>
        <p>如果桌機與手機滑動都順，下一步就可以把這段 Hero scroll-video 整合進正式 index.html。</p>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const hero = document.getElementById('scrollHero');
      const video = document.getElementById('heroVideo');
      const progressBar = document.getElementById('progressBar');

      let duration = 0;
      let rafId = null;
      let isReady = false;
      let hasPrimed = false;

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function getProgress() {
        const rect = hero.getBoundingClientRect();
        const scrollable = hero.offsetHeight - window.innerHeight;
        const passed = -rect.top;
        return clamp(passed / scrollable, 0, 1);
      }

      function seekToScroll() {
        rafId = null;
        if (!isReady || !duration) return;

        const progress = getProgress();
        const targetTime = progress * duration;

        // Avoid excessive tiny seeks.
        if (Math.abs(video.currentTime - targetTime) > 0.035) {
          try { video.currentTime = targetTime; } catch (error) {}
        }

        progressBar.style.width = `${progress * 100}%`;
      }

      function requestSeek() {
        if (rafId) return;
        rafId = requestAnimationFrame(seekToScroll);
      }

      async function primeVideo() {
        if (hasPrimed) return;
        hasPrimed = true;
        try {
          video.muted = true;
          await video.play();
          video.pause();
          requestSeek();
        } catch (error) {
          requestSeek();
        }
      }

      video.addEventListener('loadedmetadata', () => {
        duration = video.duration || 0;
        isReady = true;
        video.pause();
        requestSeek();
      });

      video.addEventListener('canplay', requestSeek);
      window.addEventListener('scroll', () => {
        primeVideo();
        requestSeek();
      }, { passive: true });
      window.addEventListener('resize', requestSeek, { passive: true });
      window.addEventListener('orientationchange', () => setTimeout(requestSeek, 250), { passive: true });
      window.addEventListener('pointerdown', primeVideo, { passive: true, once: true });
      window.addEventListener('touchstart', primeVideo, { passive: true, once: true });

      requestSeek();
    })();
  </script>
</body>
</html>
