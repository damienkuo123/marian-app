<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tappie 嗶卡登入中...</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #333;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      font-size: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner">🪄</div>
    <h2>讀取卡片中...</h2>
  </div>

  <script src="./tappie-api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const uid = urlParams.get('uid') || urlParams.get('id');
    const cardId = urlParams.get('cardId') || urlParams.get('cardid');
    const adminAuth = localStorage.getItem('tappie_admin_key');

    function go(uidValue) {
      if (adminAuth) window.location.replace(`admin.html?id=${encodeURIComponent(uidValue)}&from=tap`);
      else window.location.replace(`dashboard.html?id=${encodeURIComponent(uidValue)}`);
    }

    async function initTap() {
      try {
        if (uid) {
          const result = await TappieAPI.resolveStudentByUid(uid);
          go(result.uid || uid);
          return;
        }

        if (cardId) {
          const result = await TappieAPI.resolveStudentByCard(cardId);
          go(result.uid);
          return;
        }

        document.body.innerHTML = "<h2>❌ 無效的卡片，請洽詢櫃檯老師。</h2>";
      } catch (err) {
        console.error(err);
        document.body.innerHTML = `<h2>❌ ${err.message || '查無此卡片'}</h2>`;
      }
    }

    initTap();
  </script>
</body>
</html>
