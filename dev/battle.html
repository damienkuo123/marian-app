          await playPhonicLocal(localKey, 2.0, k1, "var(--marian-yellow)");
          await new Promise(r => setTimeout(r, 200)); 
          await playPhonicLocal(localKey, 2.0, k2, "var(--marian-yellow)");
          await new Promise(r => setTimeout(r, 400)); 
          
          // 2. 雲端單字 (Azure API + 快取，1.8倍放大)
          await speakWordCloudCached(fullWord, 2, k3, "var(--primary-blue)");
      })();
  }
  // 3. 關閉視窗
  function closePhonicHelper() {
      document.getElementById('phonic-helper-overlay').style.display = 'none';
      window.speechSynthesis.cancel(); // 停止所有正在唸的聲音
  }

  /* =======================================================
   🚀 瑪麗安專屬：企業級語音引擎 (記憶體快取 + 擴大機)
   ======================================================= */
  let audioCtx = null;
  const audioBufferCache = new Map(); // 🧠 核心：全域記憶體，存過就不再花錢！
  
  function playAudioBuffer(buffer, gainValue, targetEl, activeColor) {
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      
      const gainNode = audioCtx.createGain();
      gainNode.gain.setValueAtTime(gainValue, audioCtx.currentTime); 
      
      source.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      
      if (targetEl) {
          targetEl.style.color = activeColor;
          targetEl.style.transform = "scale(1.15)";
      }
  
      source.start(0);
  
      return new Promise(resolve => {
          source.onended = () => {
              if (targetEl) {
                  targetEl.style.color = "#dfe6e9";
                  targetEl.style.transform = "scale(1)";
              }
              resolve();
          };
      });
  }
  
  // 雲端單字發音引擎：有快取用快取，沒快取才花錢問 Azure
  // 🚀 新增 rate 參數 (預設 -10% 是一般語速，慢速可以設 -45%)
  async function speakWordCloudCached(word, gainValue, targetEl, activeColor, rate = '-10%') {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      window.speechSynthesis.cancel(); // 關閉本地語音防干擾
  
      // 🚀 核心防護：快取鑰匙必須包含「語速」，否則正常版跟慢速版會拿到同一個音檔！
      const cacheKey = `${word.toLowerCase()}_${rate}`;
  
      // 🌟 1. 【防冤大頭機制】：如果在記憶體找到了，直接播
      if (audioBufferCache.has(cacheKey)) {
          await playAudioBuffer(audioBufferCache.get(cacheKey), gainValue, targetEl, activeColor);
          return;
      }
  
      // 🌟 2. 【去 Azure 拿聲音】：只有第一次會進來
      return new Promise((resolve, reject) => {
          if (!azureAuthToken || typeof SpeechSDK === 'undefined') {
              fallbackLocalTTS(word, targetEl, activeColor, rate, resolve);
              return;
          }
  
          try {
              const speechConfig = SpeechSDK.SpeechConfig.fromAuthorizationToken(azureAuthToken, azureRegionCode);
              speechConfig.speechSynthesisVoiceName = "en-US-JennyNeural"; 
              speechConfig.speechSynthesisOutputFormat = SpeechSDK.SpeechSynthesisOutputFormat.Riff24Khz16BitMonoPcm;
  
              const synthesizer = new SpeechSDK.SpeechSynthesizer(speechConfig, null); 
              // 🚀 將 rate 變數塞進 SSML 裡面
              const ssml = `<speak version='1.0' xml:lang='en-US'><voice name='en-US-JennyNeural'><prosody rate='${rate}'>${word}</prosody></voice></speak>`;
  
              synthesizer.speakSsmlAsync(ssml, async (result) => {
                  synthesizer.close();
                  if (result.audioData) {
                      try {
                          const audioBuffer = await audioCtx.decodeAudioData(result.audioData);
                          audioBufferCache.set(cacheKey, audioBuffer); // 🧠 存入帶有語速的快取
                          await playAudioBuffer(audioBuffer, gainValue, targetEl, activeColor);
                          resolve();
                      } catch (e) { fallbackLocalTTS(word, targetEl, activeColor, rate, resolve); }
                  } else {
                      fallbackLocalTTS(word, targetEl, activeColor, rate, resolve);
                  }
              }, (error) => {
                  synthesizer.close();
                  fallbackLocalTTS(word, targetEl, activeColor, rate, resolve);
              });
          } catch (e) { fallbackLocalTTS(word, targetEl, activeColor, rate, resolve); }
      });
  }
  
  // 🚀 防呆機制也要支援語速
  function fallbackLocalTTS(word, targetEl, activeColor, rate, resolve) {
      if (targetEl) { targetEl.style.color = activeColor; targetEl.style.transform = "scale(1.15)"; }
      const fallback = new SpeechSynthesisUtterance(word);
      fallback.lang = 'en-US';
      // 如果是慢速，將原生 TTS 的速率調低 (預設是 1.0)
      fallback.rate = (rate === '-10%') ? 0.9 : 0.6; 
      fallback.onend = () => {
          if (targetEl) { targetEl.style.color = "#dfe6e9"; targetEl.style.transform = "scale(1)"; }
          resolve();
      };
      window.speechSynthesis.speak(fallback);
  }
  
  // 💡 播放音標 (GitHub MP3 專用)
  async function playPhonicLocal(localKey, gainValue, targetEl, activeColor) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      
      try {
          const response = await fetch(`audio/${localKey}.mp3`);
          if (!response.ok) throw new Error("Audio 404");
          const arrayBuffer = await response.arrayBuffer();
          const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
          await playAudioBuffer(audioBuffer, gainValue, targetEl, activeColor);
      } catch(e) { console.warn("音標播放失敗"); }
  }
  // 🚀 新增：戰鬥室專用的讀音提示
  function playBattleHint() {
      // 給一點按鍵回饋
      const hintBtn = document.getElementById('hint-btn');
      if (hintBtn) {
          hintBtn.style.transform = "scale(0.9)";
          setTimeout(() => hintBtn.style.transform = "scale(1)", 150);
      }

      // 如果當前有單字，呼叫雲端語音引擎播放
      const targetWord = battleQuizArr[currentBattleRound]?.en;
      if (targetWord) {
          // 參數：單字, 音量放大倍率(2), 目標元素(null), 高亮顏色(null), 語速(-10%)
          speakWordCloudCached(targetWord, 1.8, null, null, '-10%');
      }
  }

  // =======================================================
  // 🧑‍⚖️ Supabase Battle Judge Final Adapter
  // 目的：
  // 1) 前端不再自行判勝 / 判中離，後端 Edge Function 是裁判。
  // 2) 技能重擊送 skillUsed=true，由後端判定「使用後即消耗，贏才 +2」。
  // 3) 倒數到期只呼叫 resolve-battle-timeout，由後端判定誰得分。
  // 4) 前端依後端 scoreDelta / skillEffect 播動畫與跳分。
  // =======================================================
  (function installSupabaseBattleJudgeFinal(){
    if (window.__tappieBattleJudgeFinalInstalled) return;
    window.__tappieBattleJudgeFinalInstalled = true;

    function roomArg(roomId) {
      const room = String(roomId || ROOM_ID || '').trim();
      if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(room)) return { roomId: room };
      return { roomCode: room };
    }

    async function getStatus(roomId) {
      if (!window.TappieAPI || !TappieAPI.getBattleStatus) throw new Error('TappieAPI.getBattleStatus 尚未載入');
      return await TappieAPI.getBattleStatus(STUDENT_ID, roomArg(roomId));
    }

    async function resolveTimeout(roomId) {
      if (!window.TappieAPI || !TappieAPI.resolveBattleTimeout) throw new Error('TappieAPI.resolveBattleTimeout 尚未載入');
      return await TappieAPI.resolveBattleTimeout({ uid: STUDENT_ID, ...roomArg(roomId) });
    }

    function myRoleOf(statusData) { return statusData?.me?.role || 'host'; }
    function isHostRole(statusData) { return myRoleOf(statusData) === 'host'; }
    function normalizeNum(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }

    function winnerRoleOf(statusData) {
      const winnerId = statusData?.room?.winnerStudentId;
      const hostId = statusData?.players?.host?.id;
      const guestId = statusData?.players?.guest?.id;
      if (winnerId && hostId && winnerId === hostId) return 'host';
      if (winnerId && guestId && winnerId === guestId) return 'guest';
      const h = normalizeNum(statusData?.room?.hostWins || statusData?.players?.host?.score);
      const g = normalizeNum(statusData?.room?.guestWins || statusData?.players?.guest?.score);
      if (h > g) return 'host';
      if (g > h) return 'guest';
      return 'draw';
    }

    function didIWin(statusData) {
      const wr = winnerRoleOf(statusData);
      return wr !== 'draw' && wr === myRoleOf(statusData);
    }

    function getMyOpImages(statusData) {
      const myA = statusData?.me?.avatar || null;
      const opA = statusData?.opponent?.avatar || null;
      const myImg = myA?.fullImg || myA?.full_img_url || window.currentMyImg || null;
      const opImg = opA?.fullImg || opA?.full_img_url || window.currentOpImg || null;
      if (myA) {
        window.currentMyRarity = myA.rarity || window.currentMyRarity || 'N';
        window.currentMyMask = myA.mask || myA.mask_url || window.currentMyMask || '';
      }
      if (opA) {
        window.currentOpRarity = opA.rarity || window.currentOpRarity || 'N';
        window.currentOpMask = opA.mask || opA.mask_url || window.currentOpMask || '';
      }
      return { myImg, opImg };
    }

    function showGachaEntrance(delayMs = 2600) {
      setTimeout(() => {
        const triggerOverlay = document.getElementById('gacha-trigger-overlay');
        const enterBtn = document.getElementById('btn-enter-gacha');
        if (!triggerOverlay || !enterBtn) {
          console.warn('找不到 gacha trigger overlay，直接進入 initGacha');
          if (typeof initGacha === 'function') initGacha(document.getElementById('op-name')?.innerText || '對手');
          return;
        }
        triggerOverlay.style.display = 'flex';
        setTimeout(() => { triggerOverlay.style.opacity = '1'; }, 50);
        enterBtn.onclick = () => {
          const impact = document.getElementById('impact-overlay');
          if (impact) impact.classList.remove('active');
          triggerOverlay.style.display = 'none';
          if (window.GlobalAudio) GlobalAudio.playGachaBGM();
          if (typeof initGacha === 'function') initGacha(document.getElementById('op-name')?.innerText || '對手');
        };
      }, delayMs);
    }

    function cleanupBattleTimers() {
      try {
        if (waitOpTimer) { clearInterval(waitOpTimer); waitOpTimer = null; }
        if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
        if (opponentWaitTimer) { clearTimeout(opponentWaitTimer); opponentWaitTimer = null; }
        if (currentLimitTimer) { clearInterval(currentLimitTimer); currentLimitTimer = null; }
      } catch (_) {}
      isChecking = false;
      sessionStorage.removeItem('active_battle_room');
    }

    async function showFinished(statusData, reasonHint = 'normal') {
      cleanupBattleTimers();
      const reason = statusData?.room?.finishReason || statusData?.room?.lastEvent?.finishReason || reasonHint || 'normal';
      const won = didIWin(statusData);
      const { myImg, opImg } = getMyOpImages(statusData);
      const myScore = isHostRole(statusData) ? normalizeNum(statusData?.room?.hostWins) : normalizeNum(statusData?.room?.guestWins);
      const opScore = isHostRole(statusData) ? normalizeNum(statusData?.room?.guestWins) : normalizeNum(statusData?.room?.hostWins);

      if (reason !== 'normal' && reason !== 'client_finish') {
        if (won) console.log('後端裁判判定對手逾時 / 中離，您獲勝。');
        else console.log('後端裁判判定您逾時 / 中離，對手獲勝。');
      }

      if (typeof showImpactOverlay === 'function') showImpactOverlay(myScore, opScore, true, myImg, opImg);
      if (won) showGachaEntrance(6500);
      else setTimeout(() => { window.location.href = `./lobby.html?id=${encodeURIComponent(STUDENT_ID)}`; }, 7000);
    }

    function renderScoreDots(statusData) {
      try {
        const myScore = isHostRole(statusData) ? normalizeNum(statusData?.room?.hostWins) : normalizeNum(statusData?.room?.guestWins);
        const opScore = isHostRole(statusData) ? normalizeNum(statusData?.room?.guestWins) : normalizeNum(statusData?.room?.hostWins);
        myTotalWins = myScore;
        opTotalWins = opScore;
        const myRounds = document.getElementById('my-rounds');
        const opRounds = document.getElementById('op-rounds');
        if (myRounds && typeof renderDots === 'function') myRounds.innerHTML = renderDots(myTotalWins, true);
        if (opRounds && typeof renderDots === 'function') opRounds.innerHTML = renderDots(opTotalWins, false);
      } catch (e) { console.warn('renderScoreDots failed', e); }
    }

    async function handleRoundResolved(roomId, resultData) {
      const statusData = await getStatus(roomId).catch(() => null);
      if (statusData?.success) getMyOpImages(statusData);

      const myIsHost = statusData ? isHostRole(statusData) : true;
      const round = resultData?.round || {};
      const battle = resultData?.battle || {};

      const hostScore = normalizeNum(round.hostScore);
      const guestScore = normalizeNum(round.guestScore);
      const myRoundScore = myIsHost ? hostScore : guestScore;
      const opRoundScore = myIsHost ? guestScore : hostScore;

      const delta = round.scoreDelta || { host: 0, guest: 0 };
      const nextHostWins = normalizeNum(battle.hostWins ?? statusData?.room?.hostWins);
      const nextGuestWins = normalizeNum(battle.guestWins ?? statusData?.room?.guestWins);
      const myNextWins = myIsHost ? nextHostWins : nextGuestWins;
      const opNextWins = myIsHost ? nextGuestWins : nextHostWins;

      const skillEffect = round.skillEffect || {};
      const mySkill = myIsHost ? skillEffect.host : skillEffect.guest;
      const opSkill = myIsHost ? skillEffect.guest : skillEffect.host;
      const isMyUlt = Boolean(mySkill?.success);
      const isOpUlt = Boolean(opSkill?.success);

      const imgs = statusData?.success ? getMyOpImages(statusData) : { myImg: null, opImg: null };
      const isFinal = Boolean(resultData?.battleFinished || battle.status === 'finished');

      // 先播原本戰鬥動畫，再切換下一回合 / 最終結算。
      if (typeof triggerBattleAnimations === 'function') {
        triggerBattleAnimations(myRoundScore, opRoundScore, isFinal, myNextWins, opNextWins, isMyUlt, isOpUlt, imgs.myImg, imgs.opImg);
      } else if (typeof showImpactOverlay === 'function') {
        showImpactOverlay(myRoundScore, opRoundScore, isFinal, imgs.myImg, imgs.opImg);
      }

      const ultDelay = (isMyUlt || isOpUlt) ? 1500 : 0;
      const animWait = ultDelay + (isFinal ? 6200 : 4800);

      setTimeout(async () => {
        const overlay = document.getElementById('impact-overlay');
        if (overlay) {
          overlay.classList.add('fade-out');
          setTimeout(() => overlay.classList.remove('active', 'fade-out'), 650);
        }

        const finalStatus = await getStatus(roomId).catch(() => statusData);
        if (finalStatus?.success) renderScoreDots(finalStatus);

        if (isFinal || finalStatus?.room?.status === 'finished') {
          await showFinished(finalStatus || statusData || {}, finalStatus?.room?.finishReason || 'normal');
        } else {
          currentBattleRound = Math.max(0, normalizeNum(battle.currentRound || finalStatus?.room?.currentRound) - 1);
          isChecking = false;
          startRoundCountdown(roomId);
        }
      }, animWait);
    }

    async function handleTimeout(roomId) {
      try {
        const data = await resolveTimeout(roomId);
        if (!data?.success) {
          console.warn('resolve-battle-timeout not resolved:', data);
          return data;
        }
        await handleRoundResolved(roomId, data);
        return data;
      } catch (err) {
        console.error('resolve-battle-timeout failed:', err);
        alert('回合逾時判定失敗：' + String(err.message || err));
        return null;
      }
    }

    // 覆蓋 submitBattleScore：送分、技能、回合判定全部以後端回傳為準。
    submitBattleScore = function(roomId, score) {
      if (currentLimitTimer) clearInterval(currentLimitTimer);
      const controls = document.getElementById('battle-controls');
      if (controls) controls.style.visibility = 'hidden';

      const myCard = document.getElementById('my-card');
      if (myCard) myCard.classList.remove('charging-mana', 'ultimate-charging');
      const bBtn = document.getElementById('battle-record-btn');
      if (bBtn) bBtn.classList.remove('active', 'ult-active', 'recording-active', 'ult-recording-active');

      const skillRequested = Boolean(isUltimateMode);
      const realScore = Math.max(0, Math.min(100, Math.round(score)));
      const roundNo = Number(currentBattleRound || 0) + 1;

      const timer = document.getElementById('battle-timer');
      const info = document.getElementById('battle-info');
      if (timer) timer.innerHTML = `<span class="neon-score">得分：${realScore}</span>`;
      if (info) info.innerText = skillRequested ? '技能重擊已送出，等待後端裁判...' : '等待對手...';

      (async () => {
        try {
          const data = await TappieAPI.submitBattleScore({
            uid: STUDENT_ID,
            ...roomArg(roomId),
            roundNo,
            score: realScore,
            skillUsed: skillRequested,
            skillType: skillRequested ? 'power_strike' : undefined,
            detailJson: {
              adapter: 'judge-final',
              skillRequested,
              clientRoundIndex: currentBattleRound,
            }
          });

          if (!data?.success) {
            if (data?.error === 'round_deadline_passed') {
              await handleTimeout(roomId);
              return;
            }
            throw new Error(data?.message || data?.error || 'submitBattleScore failed');
          }

          // 後端已接受技能，前端只記錄，不自行加分。
          if (data?.submitted?.skillAccepted) hasUsedSkill = true;

          if (data.roundComplete || data.battleFinished) {
            await handleRoundResolved(roomId, data);
            return;
          }

          if (waitOpTimer) clearInterval(waitOpTimer);
          waitOpTimer = setInterval(async () => {
            const status = await getStatus(roomId).catch(() => null);
            if (!status?.success) return;
            if (status.room?.status === 'finished') {
              clearInterval(waitOpTimer); waitOpTimer = null;
              await showFinished(status, status.room?.finishReason || 'normal');
              return;
            }

            const q = status.currentQuestion || {};
            const myRole = myRoleOf(status);
            const mySubmitted = myRole === 'host' ? q.hostSubmitted : q.guestSubmitted;
            const opSubmitted = myRole === 'host' ? q.guestSubmitted : q.hostSubmitted;
            if (mySubmitted && opSubmitted) {
              clearInterval(waitOpTimer); waitOpTimer = null;
              checkBoth(roomId);
              return;
            }

            if (q.deadline && Date.now() > new Date(q.deadline).getTime() + 5000) {
              clearInterval(waitOpTimer); waitOpTimer = null;
              await handleTimeout(roomId);
            }
          }, 2000);

        } catch (err) {
          console.error('submitBattleScore judge-final failed:', err);
          alert('送出對戰分數失敗：' + String(err.message || err));
          isChecking = false;
          if (controls) controls.style.visibility = 'visible';
        }
      })();
    };

    // 覆蓋 checkBoth：不再用前端猜中離；只讀後端狀態，必要時呼叫 timeout 裁判。
    checkBoth = async function(roomId) {
      if (isChecking) return;
      isChecking = true;
      try {
        const status = await getStatus(roomId);
        if (!status?.success) { isChecking = false; return; }

        if (status.room?.status === 'finished') {
          await showFinished(status, status.room?.finishReason || status.room?.lastEvent?.finishReason || 'normal');
          return;
        }

        const q = status.currentQuestion || {};
        if (q.hostSubmitted && q.guestSubmitted) {
          // 有些情況第二位送分後前端還沒收到 submit 回傳，等下一輪讀取。
          isChecking = false;
          return;
        }

        if (q.deadline && Date.now() > new Date(q.deadline).getTime() + 5000) {
          await handleTimeout(roomId);
          return;
        }

        isChecking = false;
      } catch (err) {
        console.warn('checkBoth judge-final failed:', err);
        isChecking = false;
      }
    };

    // 補強：錄音倒數歸零時，不直接判輸贏，只呼叫後端 timeout 裁判。
    window.tappieResolveBattleTimeout = handleTimeout;
  })();

</script>

<script>
// =======================================================
// 🧑‍⚖️ Battle Strict Sync Hotfix v3
// 修正：
// 1) 不能單方按「進入戰場」就自己開始。
// 2) 必須雙方都 setArenaReady 後，由後端 active + deadline 才開始。
// 3) 回合倒數以後端 round_deadline 為準。
// 4) 一方送分後等待舊回合 finished，不再用 hostScores.length 誤判。
// 5) 逾時只呼叫 resolve-battle-timeout，由後端判定。
// =======================================================
(function installBattleStrictSyncV3(){
  if (window.__tappieBattleStrictSyncV3Installed) return;
  window.__tappieBattleStrictSyncV3Installed = true;

  const POLL_MS = 1000;
  const GRACE_MS = 5000;
  let strictSyncTimer = null;
  let pendingRoundNo = null;
  let latestBattleStatus = null;

  function isUuidLike(value) {
    return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(value || ''));
  }

  function roomArg(roomId) {
    const room = String(roomId || ROOM_ID || '').trim();
    return isUuidLike(room) ? { roomId: room } : { roomCode: room };
  }

  async function getStatusStrict(roomId) {
    if (!window.TappieAPI || !TappieAPI.getBattleStatus) throw new Error('TappieAPI.getBattleStatus 尚未載入');
    const data = await TappieAPI.getBattleStatus(STUDENT_ID, roomArg(roomId));
    if (!data || !data.success) throw new Error(data?.message || data?.error || 'getBattleStatus failed');
    latestBattleStatus = data;
    return data;
  }

  async function resolveTimeoutStrict(roomId) {
    if (!window.TappieAPI || !TappieAPI.resolveBattleTimeout) throw new Error('TappieAPI.resolveBattleTimeout 尚未載入');
    const data = await TappieAPI.resolveBattleTimeout({ uid: STUDENT_ID, ...roomArg(roomId) });
    if (!data || !data.success) return data;
    return data;
  }

  function stopStrictSyncTimer() {
    if (strictSyncTimer) {
      clearInterval(strictSyncTimer);
      strictSyncTimer = null;
    }
  }

  function stopAllBattleTimersV3() {
    try { if (readyTimer) clearInterval(readyTimer); } catch(_) {}
    try { if (syncTimer) clearInterval(syncTimer); } catch(_) {}
    try { if (waitOpTimer) clearInterval(waitOpTimer); } catch(_) {}
    try { if (currentLimitTimer) clearInterval(currentLimitTimer); } catch(_) {}
    try { if (battleTimeout) clearTimeout(battleTimeout); } catch(_) {}
    readyTimer = null;
    syncTimer = null;
    waitOpTimer = null;
    currentLimitTimer = null;
    battleTimeout = null;
    stopStrictSyncTimer();
  }

  function myRoleOf(data) { return data?.me?.role || 'host'; }
  function isMeHost(data) { return myRoleOf(data) === 'host'; }
  function num(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }

  function updateQuizFromStatus(data) {
    battleQuizArr = (data.rounds || []).map(r => ({
      en: r.word || '',
      zh: r.zh || '',
      img: r.img || '',
      roundNo: r.roundNo,
      deadline: r.deadline,
      status: r.status
    })).filter(q => q.en);
    currentBattleRound = Math.max(0, num(data.room?.currentRound || 1) - 1);
  }

  function renderScoreDotsStrict(data) {
    const myScore = isMeHost(data) ? num(data.room?.hostWins) : num(data.room?.guestWins);
    const opScore = isMeHost(data) ? num(data.room?.guestWins) : num(data.room?.hostWins);
    myTotalWins = myScore;
    opTotalWins = opScore;
    const myRounds = document.getElementById('my-rounds');
    const opRounds = document.getElementById('op-rounds');
    if (myRounds && typeof renderDots === 'function') myRounds.innerHTML = renderDots(myScore, true);
    if (opRounds && typeof renderDots === 'function') opRounds.innerHTML = renderDots(opScore, false);
  }

  function getImagesFromStatus(data) {
    const myA = data?.me?.avatar || null;
    const opA = data?.opponent?.avatar || null;
    const myImg = myA?.fullImg || myA?.full_img_url || window.currentMyImg || null;
    const opImg = opA?.fullImg || opA?.full_img_url || window.currentOpImg || null;
    if (myA) {
      window.currentMyRarity = myA.rarity || window.currentMyRarity || 'N';
      window.currentMyMask = myA.mask || myA.mask_url || window.currentMyMask || '';
    }
    if (opA) {
      window.currentOpRarity = opA.rarity || window.currentOpRarity || 'N';
      window.currentOpMask = opA.mask || opA.mask_url || window.currentOpMask || '';
    }
    return { myImg, opImg };
  }

  function didIWinStrict(data) {
    const winnerId = data?.room?.winnerStudentId;
    const hostId = data?.players?.host?.id;
    const guestId = data?.players?.guest?.id;
    let winnerRole = 'draw';
    if (winnerId && hostId && winnerId === hostId) winnerRole = 'host';
    else if (winnerId && guestId && winnerId === guestId) winnerRole = 'guest';
    else if (num(data?.room?.hostWins) > num(data?.room?.guestWins)) winnerRole = 'host';
    else if (num(data?.room?.guestWins) > num(data?.room?.hostWins)) winnerRole = 'guest';
    return winnerRole !== 'draw' && winnerRole === myRoleOf(data);
  }

  function showGachaEntranceStrict(delayMs = 6500) {
    setTimeout(() => {
      const triggerOverlay = document.getElementById('gacha-trigger-overlay');
      const enterBtn = document.getElementById('btn-enter-gacha');
      if (!triggerOverlay || !enterBtn) {
        if (typeof initGacha === 'function') initGacha(document.getElementById('op-name')?.innerText || '對手');
        return;
      }
      triggerOverlay.style.display = 'flex';
      setTimeout(() => { triggerOverlay.style.opacity = '1'; }, 50);
      enterBtn.onclick = () => {
        const impact = document.getElementById('impact-overlay');
        if (impact) impact.classList.remove('active');
        triggerOverlay.style.display = 'none';
        if (window.GlobalAudio) GlobalAudio.playGachaBGM();
        if (typeof initGacha === 'function') initGacha(document.getElementById('op-name')?.innerText || '對手');
      };
    }, delayMs);
  }

  async function showFinishedStrict(data, reasonHint = 'normal') {
    stopAllBattleTimersV3();
    sessionStorage.removeItem('active_battle_room');
    const fresh = data?.success ? data : await getStatusStrict(ROOM_ID).catch(() => data);
    const won = didIWinStrict(fresh);
    const { myImg, opImg } = getImagesFromStatus(fresh);
    const myScore = isMeHost(fresh) ? num(fresh.room?.hostWins) : num(fresh.room?.guestWins);
    const opScore = isMeHost(fresh) ? num(fresh.room?.guestWins) : num(fresh.room?.hostWins);
    if (typeof showImpactOverlay === 'function') showImpactOverlay(myScore, opScore, true, myImg, opImg);
    if (won) showGachaEntranceStrict(6500);
    else setTimeout(() => { window.location.href = `./lobby.html?id=${encodeURIComponent(STUDENT_ID)}`; }, 7000);
  }

  function buildResultFromStatusRound(status, roundNo) {
    const r = (status.rounds || []).find(x => num(x.roundNo) === num(roundNo)) || status.currentQuestion || {};
    const hostDelta = num(r.hostScoreDelta);
    const guestDelta = num(r.guestScoreDelta);
    const hostSkillSuccess = Boolean(r.hostSkillUsed && hostDelta >= 2);
    const guestSkillSuccess = Boolean(r.guestSkillUsed && guestDelta >= 2);
    let winnerRole = 'draw';
    if (num(r.hostScore) > num(r.guestScore)) winnerRole = 'host';
    else if (num(r.guestScore) > num(r.hostScore)) winnerRole = 'guest';
    return {
      success: true,
      roundComplete: true,
      battleFinished: status.room?.status === 'finished',
      round: {
        roundNo: num(roundNo),
        hostScore: num(r.hostScore),
        guestScore: num(r.guestScore),
        winnerRole,
        scoreDelta: { host: hostDelta, guest: guestDelta },
        skillEffect: {
          host: { used: Boolean(r.hostSkillUsed), success: hostSkillSuccess, delta: hostDelta, type: r.hostSkillUsed ? 'power_strike' : null },
          guest: { used: Boolean(r.guestSkillUsed), success: guestSkillSuccess, delta: guestDelta, type: r.guestSkillUsed ? 'power_strike' : null }
        }
      },
      battle: {
        status: status.room?.status,
        finishReason: status.room?.finishReason,
        currentRound: status.room?.currentRound,
        hostWins: status.room?.hostWins,
        guestWins: status.room?.guestWins,
        winnerStudentId: status.room?.winnerStudentId
      }
    };
  }

  async function processJudgeResultStrict(roomId, resultData) {
    const status = await getStatusStrict(roomId).catch(() => latestBattleStatus);
    if (status?.success) {
      updateQuizFromStatus(status);
      renderScoreDotsStrict(status);
      getImagesFromStatus(status);
    }
    const myIsHost = status ? isMeHost(status) : true;
    const round = resultData?.round || {};
    const battle = resultData?.battle || {};
    const myRoundScore = myIsHost ? num(round.hostScore) : num(round.guestScore);
    const opRoundScore = myIsHost ? num(round.guestScore) : num(round.hostScore);
    const skillEffect = round.skillEffect || {};
    const mySkill = myIsHost ? skillEffect.host : skillEffect.guest;
    const opSkill = myIsHost ? skillEffect.guest : skillEffect.host;
    const isMyUlt = Boolean(mySkill?.success);
    const isOpUlt = Boolean(opSkill?.success);
    const nextHostWins = num(battle.hostWins ?? status?.room?.hostWins);
    const nextGuestWins = num(battle.guestWins ?? status?.room?.guestWins);
    const myNextWins = myIsHost ? nextHostWins : nextGuestWins;
    const opNextWins = myIsHost ? nextGuestWins : nextHostWins;
    const imgs = status?.success ? getImagesFromStatus(status) : { myImg: null, opImg: null };
    const isFinal = Boolean(resultData?.battleFinished || battle.status === 'finished' || status?.room?.status === 'finished');

    if (typeof triggerBattleAnimations === 'function') {
      triggerBattleAnimations(myRoundScore, opRoundScore, isFinal, myNextWins, opNextWins, isMyUlt, isOpUlt, imgs.myImg, imgs.opImg);
    } else if (typeof showImpactOverlay === 'function') {
      showImpactOverlay(myRoundScore, opRoundScore, isFinal, imgs.myImg, imgs.opImg);
    }

    const animWait = (isMyUlt || isOpUlt ? 1500 : 0) + (isFinal ? 6200 : 4800);
    setTimeout(async () => {
      const overlay = document.getElementById('impact-overlay');
      if (overlay) {
        overlay.classList.add('fade-out');
        setTimeout(() => overlay.classList.remove('active', 'fade-out'), 650);
      }
      const fresh = await getStatusStrict(roomId).catch(() => status);
      if (fresh?.success) renderScoreDotsStrict(fresh);
      if (isFinal || fresh?.room?.status === 'finished') {
        await showFinishedStrict(fresh || status || {}, fresh?.room?.finishReason || 'normal');
      } else {
        updateQuizFromStatus(fresh || status || {});
        roundSubmitted = false;
        isChecking = false;
        startRoundCountdown(roomId);
      }
    }, animWait);
  }

  async function handleTimeoutStrict(roomId) {
    const data = await resolveTimeoutStrict(roomId);
    if (!data?.success) {
      if (data?.error !== 'deadline_not_reached') console.warn('resolve timeout ignored:', data);
      return data;
    }
    if (data.battleCancelled) {
      const fresh = await getStatusStrict(roomId).catch(() => null);
      await handleBattleCancelledStrict(fresh, data);
      return data;
    }
    await processJudgeResultStrict(roomId, data);
    return data;
  }

  async function handleBattleCancelledStrict(status, fallback = {}) {
    stopAllBattleTimersV3();
    sessionStorage.removeItem('active_battle_room');
    const role = myRoleOf(status || latestBattleStatus || {});
    const room = status?.room || fallback?.room || {};
    const offenderRole = room.offenderRole || room.lastEvent?.offenderRole || fallback?.result?.offenderRole || '';
    const cancelReason = room.cancelReason || room.lastEvent?.cancelReason || fallback?.result?.cancelReason || 'cancelled';
    let msg = '對戰已取消。';
    if (cancelReason === 'entry_timeout') {
      msg = offenderRole === role
        ? '因為你未進入戰場，故對戰取消。'
        : '因為對方未進入戰場，所以對戰取消。';
    } else if (cancelReason === 'opponent_left') {
      msg = offenderRole === role
        ? '因為你中離，所以對戰取消。'
        : '因為對方中離，所以對戰取消。';
    }
    alert(msg);
    window.location.href = `./lobby.html?id=${encodeURIComponent(STUDENT_ID)}`;
  }

  function showWaitingForBothReady(status) {
    const timer = document.getElementById('battle-timer');
    const info = document.getElementById('battle-info');
    const word = document.getElementById('target-word');
    const hReady = Boolean(status?.room?.hostReady);
    const gReady = Boolean(status?.room?.guestReady);
    const readyDeadline = status?.room?.readyDeadline || status?.room?.lastEvent?.readyDeadline || null;
    let remainText = '';
    if (readyDeadline) {
      const remain = Math.max(0, Math.ceil((new Date(readyDeadline).getTime() - Date.now()) / 1000));
      remainText = `｜等待剩餘 ${remain} 秒`;
      if (timer) timer.innerText = remain > 0 ? remain : 0;
    } else if (timer) {
      timer.innerText = '';
    }
    if (word) word.innerText = '等待雙方進入戰場';
    if (info) {
      info.innerText = `同步中：房主 ${hReady ? '✅' : '⌛'}　挑戰者 ${gReady ? '✅' : '⌛'}${remainText}`;
      info.style.color = '#f1c40f';
    }
  }

  // 取代原本 initArena：不再用 hostScores.length 誤判，也不設本地 60 秒等待勝負。
  window.initArena = initArena = function(roomId) {
    stopAllBattleTimersV3();
    currentBattleRound = 0;
    roundSubmitted = false;
    isChecking = false;
    const controls = document.getElementById('battle-controls');
    if (controls) controls.style.visibility = 'hidden';
    const word = document.getElementById('target-word');
    if (word) word.innerText = '戰場同步中...';
    const timer = document.getElementById('battle-timer');
    if (timer) timer.innerText = '';
    const info = document.getElementById('battle-info');
    if (info) { info.innerText = '正在向後端裁判報到...'; info.style.color = '#a4b0be'; }

    (async () => {
      try {
        if (!window.TappieAPI || !TappieAPI.setArenaReady) throw new Error('TappieAPI.setArenaReady 尚未載入');
        await TappieAPI.setArenaReady({ uid: STUDENT_ID, ...roomArg(roomId), ready: true });
        strictSyncTimer = setInterval(async () => {
          try {
            const status = await getStatusStrict(roomId);
            updateQuizFromStatus(status);
            renderScoreDotsStrict(status);
            if (typeof updateArenaUI === 'function') updateArenaUI(roomId, true);

            if (status.room?.status === 'cancelled' || status.room?.status === 'expired') {
              stopStrictSyncTimer();
              await handleBattleCancelledStrict(status);
              return;
            }

            if (status.room?.status === 'finished') {
              stopStrictSyncTimer();
              await showFinishedStrict(status, status.room?.finishReason || 'normal');
              return;
            }

            if (status.room?.status === 'ready' && status.room?.readyDeadline && Date.now() > new Date(status.room.readyDeadline).getTime()) {
              stopStrictSyncTimer();
              const result = await handleTimeoutStrict(roomId);
              if (result?.battleCancelled) return;
              return;
            }

            const ready = Boolean(status.room?.hostReady && status.room?.guestReady);
            const active = status.room?.status === 'active' && status.currentQuestion?.status === 'active';
            if (!ready || !active) {
              showWaitingForBothReady(status);
              return;
            }

            stopStrictSyncTimer();
            startRoundCountdown(roomId);
          } catch (e) {
            console.warn('等待雙方 Ready 同步中...', e);
          }
        }, POLL_MS);
      } catch (err) {
        alert('進入戰場同步失敗：' + String(err.message || err));
      }
    })();
  };

  // 取代原本 startRoundCountdown：題目與倒數都以後端 currentQuestion / deadline 為準。
  window.startRoundCountdown = startRoundCountdown = function(roomId) {
    stopAllBattleTimersV3();
    roundSubmitted = false;
    isChecking = false;

    (async () => {
      const status = await getStatusStrict(roomId).catch(err => {
        console.error('startRoundCountdown getStatus failed', err);
        return null;
      });
      if (!status?.success) return;
      if (status.room?.status === 'cancelled' || status.room?.status === 'expired') {
        await handleBattleCancelledStrict(status);
        return;
      }
      if (status.room?.status === 'finished') {
        await showFinishedStrict(status, status.room?.finishReason || 'normal');
        return;
      }
      updateQuizFromStatus(status);
      renderScoreDotsStrict(status);
      const q = status.currentQuestion;
      if (!q || q.status !== 'active') {
        // 尚未 active，回到等候雙方 ready / 後端啟動回合。
        initArena(roomId);
        return;
      }

      const myCard = document.getElementById('my-card');
      const opCard = document.getElementById('op-card');
      const arenaBg = document.getElementById('battle-arena');
      const stageCenter = document.querySelector('.arena-stage-center');
      if(myCard) myCard.classList.remove('charging-mana', 'ultimate-charging', 'winner-glory', 'loser-shatter', 'take-damage');
      if(opCard) opCard.classList.remove('charging-mana', 'ultimate-charging', 'winner-glory', 'loser-shatter', 'take-damage');
      if(arenaBg) arenaBg.classList.remove('screen-flash-red', 'screen-flash-cyan', 'screen-flash-gold', 'ultimate-mode-bg');
      if(stageCenter) stageCenter.classList.remove('hide-stage');
      isUltimateMode = false;
      const target = document.getElementById('target-word');
      if (target) target.classList.remove('ultimate-word');
      const rb = document.getElementById('battle-record-btn');
      if (rb) { rb.classList.remove('ultimate-record-btn','recording-active','ult-recording-active','processing-locked'); rb.innerHTML = '🎤'; rb.style.pointerEvents='auto'; }
      const skillBtn = document.getElementById('skill-btn');
      if (skillBtn) { skillBtn.style.display = hasUsedSkill ? 'none' : 'block'; skillBtn.style.pointerEvents='auto'; }
      const hintBtn = document.getElementById('hint-btn');
      if (hintBtn) { hintBtn.style.display = 'block'; hintBtn.style.pointerEvents='auto'; }
      const controls = document.getElementById('battle-controls');
      if (controls) controls.style.visibility = 'hidden';
      const roundNum = document.getElementById('round-num');
      if (roundNum) roundNum.innerText = `第 ${q.roundNo} 局 / 先得 5 分獲勝`;
      if (target) target.innerText = 'READY?';
      const info = document.getElementById('battle-info');
      if (info) { info.innerText = '後端裁判已啟動本回合'; info.style.color = '#a4b0be'; }

      let preCount = 3;
      readyTimer = setInterval(() => {
        const timer = document.getElementById('battle-timer');
        if (timer) timer.innerText = preCount > 0 ? preCount : '';
        if (preCount > 0 && window.GlobalAudio) GlobalAudio.play('countdown');
        preCount--;
        if (preCount < 0) {
          clearInterval(readyTimer); readyTimer = null;
          showActiveQuestionAndTimer(roomId, q);
        }
      }, 1000);
    })();
  };

  function showActiveQuestionAndTimer(roomId, q) {
    const target = document.getElementById('target-word');
    if (target) {
      target.innerText = q.word || '';
      const len = (q.word || '').length;
      if (len > 35) target.style.fontSize = 'clamp(18px, 4vw, 26px)';
      else if (len > 20) target.style.fontSize = 'clamp(24px, 5vw, 36px)';
      else if (len > 10) target.style.fontSize = 'clamp(32px, 6vw, 48px)';
      else target.style.fontSize = 'clamp(42px, 8vw, 64px)';
    }
    const controls = document.getElementById('battle-controls');
    if (controls) { controls.style.display='flex'; controls.style.visibility='visible'; }
    startRecordingBattle(roomId);
  }

  // 取代原本本地 10 秒總回合倒數：以後端 deadline 顯示，deadline 到只呼叫裁判。
  window.startRecordingBattle = startRecordingBattle = function(roomId) {
    if(currentLimitTimer) clearInterval(currentLimitTimer);
    currentLimitTimer = setInterval(async () => {
      const status = await getStatusStrict(roomId).catch(() => null);
      const q = status?.currentQuestion;
      if (!q || status?.room?.status === 'finished' || status?.room?.status === 'cancelled' || status?.room?.status === 'expired') {
        clearInterval(currentLimitTimer); currentLimitTimer = null;
        if (status?.room?.status === 'cancelled' || status?.room?.status === 'expired') await handleBattleCancelledStrict(status);
        else if (status?.room?.status === 'finished') await showFinishedStrict(status, status.room?.finishReason || 'normal');
        return;
      }
      const remainingMs = q.deadline ? new Date(q.deadline).getTime() - Date.now() : 0;
      const remaining = Math.max(0, Math.ceil(remainingMs / 1000));
      const timer = document.getElementById('battle-timer');
      if (timer) timer.innerText = remaining;
      if (remainingMs <= -GRACE_MS && !roundSubmitted) {
        clearInterval(currentLimitTimer); currentLimitTimer = null;
        roundSubmitted = true;
        const controls = document.getElementById('battle-controls');
        if (controls) controls.style.visibility = 'hidden';
        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        await handleTimeoutStrict(roomId);
      }
    }, 500);
  };

  // 取代 checkBoth：直接看後端該回合是否 resolved，不用 hostScores.length。
  window.checkBoth = checkBoth = async function(roomId) {
    if (isChecking) return;
    isChecking = true;
    try {
      const status = await getStatusStrict(roomId);
      const roundNo = pendingRoundNo || (currentBattleRound + 1);
      const r = (status.rounds || []).find(x => num(x.roundNo) === num(roundNo));
      if (status.room?.status === 'finished') {
        const result = buildResultFromStatusRound(status, roundNo);
        await processJudgeResultStrict(roomId, result);
        return;
      }
      if (r && (r.status === 'finished' || r.status === 'timeout')) {
        const result = buildResultFromStatusRound(status, roundNo);
        await processJudgeResultStrict(roomId, result);
        return;
      }
      isChecking = false;
    } catch (err) {
      console.warn('checkBoth strict failed', err);
      isChecking = false;
    }
  };

  // 取代 submitBattleScore：送出後等待「該回合」被後端 resolved，而不是等目前 currentQuestion。
  window.submitBattleScore = submitBattleScore = function(roomId, score) {
    if (currentLimitTimer) { clearInterval(currentLimitTimer); currentLimitTimer = null; }
    const controls = document.getElementById('battle-controls');
    if (controls) controls.style.visibility = 'hidden';
    const myCard = document.getElementById('my-card');
    if (myCard) myCard.classList.remove('charging-mana', 'ultimate-charging');
    const bBtn = document.getElementById('battle-record-btn');
    if (bBtn) bBtn.classList.remove('active','ult-active','recording-active','ult-recording-active');
    const skillRequested = Boolean(isUltimateMode);
    const realScore = Math.max(0, Math.min(100, Math.round(score)));
    const roundNo = Number(currentBattleRound || 0) + 1;
    pendingRoundNo = roundNo;
    const timer = document.getElementById('battle-timer');
    const info = document.getElementById('battle-info');
    if (timer) timer.innerHTML = `<span class="neon-score">得分：${realScore}</span>`;
    if (info) info.innerText = skillRequested ? '技能重擊已送出，等待後端裁判...' : '等待對手...';

    (async () => {
      try {
        if (!window.TappieAPI || !TappieAPI.submitBattleScore) throw new Error('TappieAPI.submitBattleScore 尚未載入');
        const data = await TappieAPI.submitBattleScore({
          uid: STUDENT_ID,
          ...roomArg(roomId),
          roundNo,
          score: realScore,
          skillUsed: skillRequested,
          skillType: skillRequested ? 'power_strike' : undefined,
          detailJson: { adapter: 'sync-v3', skillRequested, clientRoundIndex: currentBattleRound }
        });
        if (!data?.success) {
          if (data?.error === 'round_deadline_passed') {
            await handleTimeoutStrict(roomId);
            return;
          }
          throw new Error(data?.message || data?.error || 'submitBattleScore failed');
        }
        if (skillRequested) hasUsedSkill = true;
        if (data.roundComplete || data.battleFinished) {
          await processJudgeResultStrict(roomId, data);
          return;
        }
        if (waitOpTimer) clearInterval(waitOpTimer);
        waitOpTimer = setInterval(async () => {
          try {
            const status = await getStatusStrict(roomId);
            const r = (status.rounds || []).find(x => num(x.roundNo) === num(roundNo));
            if (status.room?.status === 'finished' || (r && (r.status === 'finished' || r.status === 'timeout'))) {
              clearInterval(waitOpTimer); waitOpTimer = null;
              await processJudgeResultStrict(roomId, buildResultFromStatusRound(status, roundNo));
              return;
            }
            if (r?.deadline && Date.now() > new Date(r.deadline).getTime() + GRACE_MS) {
              clearInterval(waitOpTimer); waitOpTimer = null;
              await handleTimeoutStrict(roomId);
            }
          } catch (e) { console.warn('waiting resolved poll failed', e); }
        }, POLL_MS);
      } catch (err) {
        console.error('submitBattleScore sync-v3 failed:', err);
        alert('送出對戰分數失敗：' + String(err.message || err));
        roundSubmitted = false;
        isChecking = false;
        if (controls) controls.style.visibility = 'visible';
      }
    })();
  };

})();
</script>


  <!-- =======================================================
       ✅ Supabase AI Battle Runtime Patch MVP
       - 保留原本戰場 CSS / 動畫 / 盲盒
       - mode=ai / battle_type=ai 時，送分改走 submit-ai-battle-score
       - AI 名稱保留：初階Ai / 中階Ai / 高階Ai / 活動Boss
       ======================================================= -->
  <script>
  (function installSupabaseAiBattleRuntimePatch(){
    const params = new URLSearchParams(window.location.search);
    const STUDENT_ID_FOR_AI = params.get('id') || window.STUDENT_ID || '';
    const ROOM_CODE_FOR_AI = params.get('roomCode') || params.get('roomId') || params.get('code') || '';
    const AI_LEVEL_FROM_URL = params.get('aiLevel') || '';
    const AI_IMG_MAP = {
      '初階Ai': '/assets/Ai_L1.webp',
      '中階Ai': '/assets/Ai_M1.webp',
      '高階Ai': '/assets/Ai_H1.webp',
      '活動Boss': '/assets/BOX_COVER_SSR.webp'
    };

    // ✅ 沿用原 GAS 的 AI 角色 ID / 稀有度 / mask 規則
    // AI_EASY: N，不套 mask
    // AI_MED: R，mask = /assets/Ai_M1_tr.webp
    // AI_HARD: SR，mask = /assets/Ai_H1_tr.webp
    const AI_AVATAR_MAP = {
      '初階Ai': { id:'AI_EASY', name:'初階Ai', img:'/assets/Ai_L1.webp', fullImg:'/assets/Ai_L1.webp', mask:'', rarity:'N', theme:'theme-tech', category:'ai' },
      '中階Ai': { id:'AI_MED', name:'中階Ai', img:'/assets/Ai_M1.webp', fullImg:'/assets/Ai_M1.webp', mask:'/assets/Ai_M1_tr.webp', rarity:'R', theme:'theme-tech', category:'ai' },
      '高階Ai': { id:'AI_HARD', name:'高階Ai', img:'/assets/Ai_H1.webp', fullImg:'/assets/Ai_H1.webp', mask:'/assets/Ai_H1_tr.webp', rarity:'SR', theme:'theme-tech', category:'ai' },
      '活動Boss': { id:'AI_BOSS', name:'活動Boss', img:'/assets/BOX_COVER_SSR.webp', fullImg:'/assets/BOX_COVER_SSR.webp', mask:'', rarity:'SSR', theme:'theme-magic', category:'boss' }
    };

    function aiAvatarByName(name){
      const n = String(name || AI_LEVEL_FROM_URL || '');
      if (n.includes('初階')) return AI_AVATAR_MAP['初階Ai'];
      if (n.includes('中階')) return AI_AVATAR_MAP['中階Ai'];
      if (n.includes('高階')) return AI_AVATAR_MAP['高階Ai'];
      if (n.includes('活動Boss') || n.includes('突發') || n.includes('Boss')) return AI_AVATAR_MAP['活動Boss'];
      return AI_AVATAR_MAP['初階Ai'];
    }

    // 讓原本 arena 的 characterAssets 查得到 AI 圖鑑資料
    window.characterAssets = window.characterAssets || {};
    Object.values(AI_AVATAR_MAP).forEach(a => {
      window.characterAssets[a.id] = { name:a.name, img:a.img, mask:a.mask, rarity:a.rarity, theme:a.theme };
      window.characterAssets[a.name] = { name:a.name, img:a.img, mask:a.mask, rarity:a.rarity, theme:a.theme };
    });

    function isUuidLikeAi(value){
      return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(value || ''));
    }

    function aiImageByName(name){
      return aiAvatarByName(name).img || '/assets/Ai_m.webp';
    }

    async function getStatusForAiPatch(room){
      if (!window.TappieAPI || !TappieAPI.getBattleStatus) throw new Error('TappieAPI.getBattleStatus 尚未載入');
      const arg = isUuidLikeAi(room) ? { roomId: room } : { roomCode: room };
      return await TappieAPI.getBattleStatus(STUDENT_ID_FOR_AI, arg);
    }

    function normalizeAiLegacyStatus(data){
      const room = data?.room || {};
      const players = data?.players || {};
      const host = players.host || {};
      const guest = players.guest || {};
      const rounds = Array.isArray(data?.rounds) ? data.rounds : [];
      const meRole = data?.me?.role || 'host';
      const isMeHost = meRole === 'host';
      const aiName = guest.name || data?.opponent?.name || AI_LEVEL_FROM_URL || '初階Ai';
      const fallbackAiAvatar = aiAvatarByName(aiName);
      const aiAvatar = guest.avatar || fallbackAiAvatar;
      const aiImg = aiAvatar?.fullImg || aiAvatar?.full_img_url || aiAvatar?.img || aiImageByName(aiName);
      const hostImg = host.avatar?.fullImg || host.avatar?.full_img_url || '/assets/gacha-box.png';
      const hostScores = rounds.map(r => {
        if (!r.hostSubmitted) return -1;
        const base = Number(r.hostScore ?? 0);
        return r.hostSkillUsed ? base + 1000 : base;
      });
      const guestScores = rounds.map(r => {
        if (!r.guestSubmitted) return -1;
        const base = Number(r.guestScore ?? 0);
        return r.guestSkillUsed ? base + 1000 : base;
      });
      const quiz = rounds.map(r => ({
        en: r.word || '',
        zh: r.zh || '',
        img: r.img || '',
        roundNo: r.roundNo
      })).filter(q => q.en);

      return {
        success: true,
        status: room.status === 'finished' ? 'Active' : (room.status === 'cancelled' ? 'Canceled' : 'Active'),
        roomId: room.roomCode || ROOM_CODE_FOR_AI,
        roomCode: room.roomCode || ROOM_CODE_FOR_AI,
        hostId: STUDENT_ID_FOR_AI,
        guestId: 'AI_PLAYER',
        winnerId: room.status === 'finished'
          ? ((Number(data?.me?.score || 0) > Number(data?.opponent?.score || 0)) ? STUDENT_ID_FOR_AI : 'AI_PLAYER')
          : '',
        hostName: host.name || data?.me?.name || '玩家',
        guestName: aiName,
        opponentName: aiName,
        hostImg,
        guestImg: aiImg,
        opponentImg: aiImg,
        hostRarity: host.avatar?.rarity || 'SSR',
        guestRarity: aiAvatar?.rarity || 'N',
        hostMask: host.avatar?.mask || '',
        guestMask: aiAvatar?.mask || aiAvatar?.mask_url || '',
        hostTheme: host.avatar?.theme || host.avatar?.category || 'theme-magic',
        guestTheme: aiAvatar?.theme || aiAvatar?.category || 'theme-tech',
        hostScores,
        guestScores,
        quiz,
        currentRound: room.currentRound || 1,
        raw: data
      };
    }

    const previousFetch = window.fetch;
    window.fetch = async function(input, init){
      const urlString = typeof input === 'string' ? input : (input && input.url ? input.url : '');
      try {
        if (urlString && typeof GAS_URL !== 'undefined' && urlString.includes(GAS_URL)) {
          const url = new URL(urlString);
          const action = url.searchParams.get('action') || '';
          const room = url.searchParams.get('roomId') || url.searchParams.get('roomCode') || ROOM_CODE_FOR_AI;

          if (action === 'arena_ready') {
            const status = await getStatusForAiPatch(room).catch(()=>null);
            if (status?.room?.battleType === 'ai' || status?.room?.battleType === 'boss') {
              return new Response(JSON.stringify({ success: true, status: 'Active', raw: status }), { headers: { 'Content-Type': 'application/json' }});
            }
          }

          if (action === 'get_battle_status') {
            const status = await getStatusForAiPatch(room);
            if (status?.room?.battleType === 'ai' || status?.room?.battleType === 'boss') {
              return new Response(JSON.stringify(normalizeAiLegacyStatus(status)), { headers: { 'Content-Type': 'application/json' }});
            }
          }

          if (action === 'submit_battle_score') {
            const status = await getStatusForAiPatch(room).catch(()=>null);
            if (status?.room?.battleType === 'ai' || status?.room?.battleType === 'boss') {
              if (!window.TappieAPI || !TappieAPI.submitAiBattleScore) throw new Error('TappieAPI.submitAiBattleScore 尚未載入');
              const rawRound = Number(url.searchParams.get('round') || 0);
              const roundNo = rawRound <= 0 ? 1 : rawRound + 1;
              let rawScore = Number(url.searchParams.get('score') || 0);
              const skillUsed = rawScore > 500;
              let score = skillUsed ? Math.max(0, rawScore - 1000) : rawScore;
              score = Math.max(0, Math.min(100, Math.round(score)));
              const payload = isUuidLikeAi(room)
                ? { uid: STUDENT_ID_FOR_AI, roomId: room, roundNo, score, skillUsed, skillType: skillUsed ? 'power_strike' : '' }
                : { uid: STUDENT_ID_FOR_AI, roomCode: room, roundNo, score, skillUsed, skillType: skillUsed ? 'power_strike' : '' };
              const result = await TappieAPI.submitAiBattleScore(payload);
              // 回傳舊版可接受的 OK，同時保留 raw，後續 checkBoth 會再抓 get_battle_status。
              // 若後端回傳錯誤，直接把 message 傳回，避免前端靜默顯示 0。
              if (!result?.success) {
                return new Response(JSON.stringify({ success:false, status:'Error', message: result?.message || result?.error || 'submit-ai-battle-score failed', raw: result }), { status: 500, headers: { 'Content-Type': 'application/json' }});
              }
              return new Response(JSON.stringify({ success: true, status: 'OK', raw: result, hostScore: result?.round?.hostScore, guestScore: result?.round?.guestScore, aiScore: result?.round?.guestScore }), { headers: { 'Content-Type': 'application/json' }});
            }
          }
        }
      } catch (err) {
        console.error('AI Battle Runtime Patch Error:', err);
        return new Response(JSON.stringify({ success:false, status:'Error', message:String(err.message || err) }), { status: 500, headers: { 'Content-Type':'application/json' }});
      }
      return previousFetch(input, init);
    };
  })();
  </script>



  <!-- =======================================================
       ✅ AI Battle v3 Final Adapter
       - AI 送分不再走 PvP submit-battle-score
       - 建房時已預先生成 10 回合 AI 分數
       - Avatar 優先吃 Supabase avatars 表，fallback 才用 Google Sheet 原始路徑
       ======================================================= -->
  <script>
  (function installAiBattleV3FinalAdapter(){
    const params = new URLSearchParams(window.location.search);
    const UID = params.get('id') || window.STUDENT_ID || '';
    const ROOM = params.get('roomCode') || params.get('roomId') || params.get('code') || window.ROOM_ID || '';
    const POLL_MS_LOCAL = 900;

    const fallbackAvatarByName = (name) => {
      const n = String(name || '');
      if (n.includes('初階')) return { id:'AI_EASY', name:'初階Ai', fullImg:'/assets/Ai_L1.webp', mask:'', rarity:'N', theme:'theme-magic', category:'ai' };
      if (n.includes('中階')) return { id:'AI_MED', name:'中階Ai', fullImg:'/assets/Ai_M1.webp', mask:'/assets/Ai_M1_tr.webp', rarity:'R', theme:'theme-magic', category:'ai' };
      if (n.includes('高階')) return { id:'AI_HARD', name:'高階Ai', fullImg:'/assets/Ai_H1.webp', mask:'/assets/Ai_H1_tr.webp', rarity:'SR', theme:'theme-fire', category:'ai' };
      if (n.includes('Boss') || n.includes('活動')) return { id:'AI_BOSS', name:'活動Boss', fullImg:'/assets/BOX_COVER_SSR.webp', mask:'', rarity:'SSR', theme:'theme-magic', category:'boss' };
      return { id:'AI_MED', name:'中階Ai', fullImg:'/assets/Ai_M1.webp', mask:'/assets/Ai_M1_tr.webp', rarity:'R', theme:'theme-magic', category:'ai' };
    };

    function isAiStatus(status){
      const t = String(status?.room?.battleType || '').toLowerCase();
      return t === 'ai' || t === 'boss';
    }

    function roomArgLocal(room){
      const r = String(room || ROOM || '');
      return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(r)
        ? { roomId: r }
        : { roomCode: r };
    }

    async function getAiStatus(room){
      if (!window.TappieAPI || !TappieAPI.getBattleStatus) throw new Error('TappieAPI.getBattleStatus 尚未載入');
      return await TappieAPI.getBattleStatus(UID, roomArgLocal(room));
    }

    // 補強 AI avatar 顯示：優先吃 get-battle-status 回傳的 players.guest.avatar。
    function applyAiAvatarFromStatus(status){
      try {
        if (!isAiStatus(status)) return;
        const guest = status?.players?.guest || {};
        const aiName = guest.name || status?.opponent?.name || '中階Ai';
        const fallback = fallbackAvatarByName(aiName);
        const avatar = guest.avatar || status?.opponent?.avatar || fallback;
        const img = avatar.fullImg || avatar.full_img_url || avatar.img || fallback.fullImg;
        const mask = avatar.mask || avatar.mask_url || fallback.mask || '';
        const rarity = avatar.rarity || fallback.rarity || 'R';
        const theme = avatar.theme || avatar.category || fallback.theme || 'theme-magic';

        window.characterAssets = window.characterAssets || {};
        window.characterAssets[guest.avatarId || fallback.id] = { name: aiName, img, mask, rarity, theme };
        window.characterAssets[aiName] = { name: aiName, img, mask, rarity, theme };

        const opCard = document.getElementById('op-card');
        const opCardBg = document.getElementById('op-card-bg');
        if (opCardBg && img) opCardBg.style.backgroundImage = `url('${img}')`;
        if (opCard) {
          opCard.setAttribute('data-rarity', rarity);
          if (mask) {
            opCard.classList.add('masked');
            opCard.style.setProperty('--mask', mask.includes('url(') ? mask : `url('${mask}')`);
          } else {
            opCard.classList.remove('masked');
            opCard.style.removeProperty('--mask');
          }
        }
      } catch (e) {
        console.warn('applyAiAvatarFromStatus failed', e);
      }
    }

    const previousCheckBoth = window.checkBoth;
    window.checkBoth = checkBoth = async function(roomId){
      try {
        const status = await getAiStatus(roomId).catch(()=>null);
        if (isAiStatus(status)) applyAiAvatarFromStatus(status);
      } catch(_e) {}
      return previousCheckBoth ? previousCheckBoth(roomId) : undefined;
    };

    const previousSubmit = window.submitBattleScore;
    window.submitBattleScore = submitBattleScore = function(roomId, score){
      (async () => {
        const status = await getAiStatus(roomId).catch(()=>null);
        if (!isAiStatus(status)) {
          if (previousSubmit) return previousSubmit(roomId, score);
          throw new Error('submitBattleScore 原始函式不存在');
        }

        // AI 模式：直接送 submit-ai-battle-score，後端同回合產生 AI 分數並 resolved。
        if (currentLimitTimer) { clearInterval(currentLimitTimer); currentLimitTimer = null; }
        const controls = document.getElementById('battle-controls');
        if (controls) controls.style.visibility = 'hidden';
        const myCard = document.getElementById('my-card');
        if (myCard) myCard.classList.remove('charging-mana', 'ultimate-charging');
        const bBtn = document.getElementById('battle-record-btn');
        if (bBtn) bBtn.classList.remove('active','ult-active','recording-active','ult-recording-active');

        const skillRequested = Boolean(isUltimateMode);
        const realScore = Math.max(0, Math.min(100, Math.round(Number(score || 0))));
        const roundNo = Number(currentBattleRound || 0) + 1;
        pendingRoundNo = roundNo;
        const timer = document.getElementById('battle-timer');
        const info = document.getElementById('battle-info');
        if (timer) timer.innerHTML = `<span class="neon-score">得分：${realScore}</span>`;
        if (info) info.innerText = skillRequested ? '技能重擊已送出，AI 裁判判定中...' : 'AI 裁判判定中...';

        try {
          if (!window.TappieAPI || !TappieAPI.submitAiBattleScore) throw new Error('TappieAPI.submitAiBattleScore 尚未載入');
          const result = await TappieAPI.submitAiBattleScore({
            uid: UID,
            ...roomArgLocal(roomId),
            roundNo,
            score: realScore,
            skillUsed: skillRequested,
            skillType: skillRequested ? 'power_strike' : undefined,
            detailJson: { adapter: 'ai-v3-final', skillRequested, clientRoundIndex: currentBattleRound }
          });

          if (!result?.success) throw new Error(result?.message || result?.error || 'submit-ai-battle-score failed');
          if (skillRequested) hasUsedSkill = true;

          // 讓既有動畫流程用後端資料處理，不直接手動改 UI。
          if (waitOpTimer) clearInterval(waitOpTimer);
          waitOpTimer = setInterval(async () => {
            try {
              const st = await getAiStatus(roomId);
              applyAiAvatarFromStatus(st);
              const r = (st.rounds || []).find(x => Number(x.roundNo) === Number(roundNo));
              if (st.room?.status === 'finished' || (r && (r.status === 'finished' || r.status === 'timeout'))) {
                clearInterval(waitOpTimer); waitOpTimer = null;
                if (previousCheckBoth) return previousCheckBoth(roomId);
              }
            } catch(e) { console.warn('AI v3 wait resolved failed', e); }
          }, POLL_MS_LOCAL);

          // AI 後端已經立即 resolved，立即觸發一次既有處理。
          setTimeout(() => { if (previousCheckBoth) previousCheckBoth(roomId); }, 150);
        } catch (err) {
          console.error('submitBattleScore AI v3 failed:', err);
          alert('送出 AI 對戰分數失敗：' + String(err.message || err));
          roundSubmitted = false;
          isChecking = false;
          if (controls) controls.style.visibility = 'visible';
        }
      })();
    };
  })();
  </script>



  <!-- =======================================================
       ✅ Boss UI Fix v1
       - 回 lobby 一律清除 v= 參數，只保留 id
       - 最終勝負立繪至少停留 6.5 秒後才顯示抽獎 / 返回
       ======================================================= -->
  <script>
  (function installBossUiFixV1(){
    const cleanLobbyUrl = () => `./lobby.html?id=${encodeURIComponent(STUDENT_ID)}`;
    window.TappieCleanLobbyUrl = cleanLobbyUrl;
    window.TappieReturnLobbyClean = function(){ window.location.href = cleanLobbyUrl(); };

    function forceCleanLobbyLinks(){
      document.querySelectorAll('a[href*="lobby.html"]').forEach(a => {
        try { a.setAttribute('href', cleanLobbyUrl()); } catch(_) {}
      });
    }
    setInterval(forceCleanLobbyLinks, 1500);

    // 防止最後一擊後，抽獎按鈕太快蓋掉 WIN / LOSE 立繪。
    function keepImpactVisibleForFinal(){
      const overlay = document.getElementById('impact-overlay');
      if (!overlay || !overlay.classList.contains('is-final')) return;
      overlay.classList.add('active');
      overlay.classList.remove('fade-out');
    }

    const patchLater = () => {
      try {
        if (typeof window.showGachaEntranceStrict === 'function' && !window.showGachaEntranceStrict.__bossUiFix) {
          const old = window.showGachaEntranceStrict;
          window.showGachaEntranceStrict = function(delayMs){
            keepImpactVisibleForFinal();
            return old.call(this, Math.max(Number(delayMs || 0), 6500));
          };
          window.showGachaEntranceStrict.__bossUiFix = true;
        }
        if (typeof window.showGachaEntrance === 'function' && !window.showGachaEntrance.__bossUiFix) {
          const old = window.showGachaEntrance;
          window.showGachaEntrance = function(delayMs){
            keepImpactVisibleForFinal();
            return old.call(this, Math.max(Number(delayMs || 0), 6500));
          };
          window.showGachaEntrance.__bossUiFix = true;
        }
      } catch(e) { console.warn('Boss UI Fix patchLater failed', e); }
    };
    patchLater();
    setTimeout(patchLater, 1000);
    setTimeout(patchLater, 3000);
  })();
  </script>
