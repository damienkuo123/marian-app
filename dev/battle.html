  function renderWord() {
    const current = quizData[currentIndex];
    if (!current) return;

    // 🚀 強制顯示進度條容器 (防止它因為切換模式被隱藏)
    const progContainer = document.getElementById('progress-container');
    if (progContainer) progContainer.style.display = 'block';

    document.getElementById('idx-display').innerText = currentIndex + 1;
    document.getElementById('word-display').innerText = current.en;
    document.getElementById('zh-display').innerText = current.zh;

    // 更新進度條藍色填充區的寬度
    if (quizData.length > 0) {
        const progressPercent = ((currentIndex + 1) / quizData.length) * 100;
        document.getElementById('progress-fill').style.width = progressPercent + "%";
    }
    
    const currentScore = scores[currentIndex];
    const currentFeedback = (window.feedbacks && window.feedbacks[currentIndex]) ? window.feedbacks[currentIndex] : "";
    document.getElementById('feedback').innerHTML = currentScore !== null ? `得分：${currentScore}<br><small>${currentFeedback}</small>` : "";

    // 🚀 【關鍵宣告區】—— 沒這幾行，後面都會死機
    const playBtn = document.getElementById('play-btn'); // 👈 這行一定要回來！
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const backBtn = document.getElementById('back-summary-btn');
    const rb = document.getElementById('record-btn');
    
    // 🚀 手術位置：在宣告 wordDisplay 與 existingReport 之前
    const wordDisplay = document.getElementById('word-display');
    const charCount = current.en.length; // 🚀 計算包含空格與符號的總字數

    // 🧠 智慧縮放核心：使用 CSS clamp 確保在手機與平板上都能完美顯示
    if (charCount > 20) {
        // 中長句子：字體微微放大，並給予極大的行高 (2.0) 來容納小燈泡
        wordDisplay.style.fontSize = "clamp(28px, 6vw, 42px)";  
        wordDisplay.style.lineHeight = "1.6"; 
    } else if (charCount > 10) {
        // 短句子：字體再放大，行高也適度撐開 (1.8)
        wordDisplay.style.fontSize = "clamp(36px, 7vw, 54px)";  
        wordDisplay.style.lineHeight = "1.6"; 
    } else {
        // 單字：視覺中心，霸氣大字，單行不需要擔心擋字問題
        wordDisplay.style.fontSize = "clamp(48px, 9vw, 72px)";  
        wordDisplay.style.lineHeight = "1.6"; 
    }


    const existingReport = azureReports[currentIndex];
    
    if (existingReport) {
        // 如果有唸過，顯示變色版
        wordDisplay.innerHTML = generateColoredHTML(existingReport, current.en);
    } else {
        // 如果還沒唸，顯示乾淨的預設版
        wordDisplay.innerText = current.en;
        wordDisplay.style.color = "#0d47a1"; // 回復預設深藍色
    }
    
    // 🚀 全面解鎖邏輯
    if (playBtn) playBtn.disabled = false; // 現在它認識 playBtn 了，不會報錯

    if (rb) {
        rb.style.display = 'flex';  
        rb.style.pointerEvents = "auto"; 
        rb.style.opacity = "1";
        // 🚀 確保所有狀態都被清洗乾淨
        rb.classList.remove('recording-active', 'processing-locked');
    }

    if (isReReading) {
      prevBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      backBtn.style.display = 'inline-block';
      backBtn.disabled = false;
    } else {
      backBtn.style.display = 'none';
      prevBtn.style.display = 'inline-block';
      prevBtn.disabled = (currentIndex === 0);
      nextBtn.style.display = 'inline-block';
      nextBtn.disabled = false;
      nextBtn.innerText = currentIndex === quizData.length - 1 ? "查看結算" : "下一題 ▶";
    }

    isGrading = false;
    isRecording = false;
    document.getElementById('status').innerText = "點擊開始錄音";
    document.getElementById('status').style.color = "#636e72"; 
  }
  
  let isGrading = false; 
  let tooQuietFlag = false; 

  const rb = document.getElementById('record-btn');
  let practiceRecorder;
  let practiceChunks = [];
  let isRecording = false;

  if(rb) {
    const togglePracticeRecord = async (e) => { 
        e.preventDefault();
        
        // 🛑 如果正在評分中，直接阻擋
        if(isGrading) return;

        // 🔵 狀態 A：如果目前沒有在錄音 -> 啟動錄音
        if (!isRecording) {
            isRecording = true;
            rb.classList.add('recording-active'); // 變藍色
            
            if (!sysAudioCtx) sysAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (sysAudioCtx.state === 'suspended') sysAudioCtx.resume();
            
            if (!globalMicStream) {
                alert("麥克風未授權，請重新整理網頁！");
                isRecording = false; rb.classList.remove('recording-active');
                return;
            }

            practiceRecorder = new MediaRecorder(globalMicStream);
            practiceChunks = [];
            practiceRecorder.ondataavailable = ev => { if(ev.data.size > 0) practiceChunks.push(ev.data); };
            practiceRecorder.start();

            document.getElementById('status').innerText = "🔵 錄音中... (再次點擊結束)";
            // 🚀 修復點：改用標準的色碼，或正確抓取變數
            document.getElementById('status').style.color = "#0066cc"; 
            document.getElementById('feedback').innerHTML = ""; 
            document.getElementById('prev-btn').disabled = true;
            document.getElementById('next-btn').disabled = true;
            document.getElementById('back-summary-btn').disabled = true;
            
            // 10 秒防呆截斷
            if (practiceTimeout) clearTimeout(practiceTimeout);
            practiceTimeout = setTimeout(() => {
                if (isRecording) {
                    console.log("⏱️ 錄音超時 10 秒，強制截斷！");
                    togglePracticeRecord(e); // 模擬第二次點擊
                }
            }, 12000);

        } 
        // 🔴 狀態 B：如果目前正在錄音 -> 停止錄音並送出
        else {
            isRecording = false;
            if (practiceTimeout) clearTimeout(practiceTimeout); // 拆除炸彈 
            
            // 拔除藍色，換上灰色鎖定裝甲
            rb.classList.remove('recording-active'); 
            rb.classList.add('processing-locked');
            
            if (!practiceRecorder || practiceRecorder.state !== "recording") {
                document.getElementById('status').innerText = "🚨 錄音異常，請重試";
                document.getElementById('status').style.color = "#e74c3c";
                isGrading = false; 
                rb.classList.remove('processing-locked'); // 解鎖按鈕
                document.getElementById('next-btn').disabled = false;
                if (currentIndex > 0) document.getElementById('prev-btn').disabled = false;
                return;
            }

            isGrading = true;
            document.getElementById('status').innerText = "⚙️ 封裝音檔中...";
            document.getElementById('status').style.color = "#f1c40f";

            practiceRecorder.onstop = async () => {
                const rawBlob = new Blob(practiceChunks); 
                
                if (practiceChunks.length === 0 || rawBlob.size < 500) {
                    document.getElementById('status').innerText = "🚨 錄音太短，請重唸";
                    document.getElementById('status').style.color = "#e74c3c";
                    rb.classList.remove('processing-locked'); // 🚀 失敗也要解鎖按鈕
                    renderWord(); 
                    return;
                }
                
                try {
                    const voiceOk = await incrementVoiceUsageOrBlock(MODE === 'challenge' ? 'battle_practice_challenge' : 'battle_practice_review');
                    if (!voiceOk) {
                        isGrading = false;
                        rb.classList.remove('processing-locked');
                        renderWord();
                        return;
                    }

                    const wavFile = await createWavFileFromBlob(rawBlob);
                    document.getElementById('status').innerText = "🟢 傳送至聲學引擎...";
                    document.getElementById('status').style.color = "#3498db";

                    const targetWord = quizData[currentIndex].en;
                    const speechConfig = SpeechSDK.SpeechConfig.fromAuthorizationToken(azureAuthToken, azureRegionCode);
                    speechConfig.speechRecognitionLanguage = "en-US";
                    
                    const audioConfig = SpeechSDK.AudioConfig.fromWavFileInput(wavFile);
                    const pronConfig = new SpeechSDK.PronunciationAssessmentConfig(
                        targetWord, SpeechSDK.PronunciationAssessmentGradingSystem.HundredMark,
                        SpeechSDK.PronunciationAssessmentGranularity.Phoneme, true
                    );

                    const recognizer = new SpeechSDK.SpeechRecognizer(speechConfig, audioConfig);
                    pronConfig.applyTo(recognizer);

                    recognizer.recognizeOnceAsync(
                        (result) => {
                            if (result.reason === SpeechSDK.ResultReason.RecognizedSpeech) {
                                document.getElementById('status').innerText = "呼叫導師評論中...";
                                let rawAzureData = SpeechSDK.PronunciationAssessmentResult.fromResult(result).detailResult;
                                azureReports[currentIndex] = rawAzureData;

                                // 🚀 核心升級：導入 10 秒絕對斬斷防護網 (AbortController)
                                const abortController = new AbortController();
                                const fetchTimeout = setTimeout(() => {
                                    abortController.abort(); // ⏱️ 10秒一到，無情斬斷連線！
                                }, 12000);

                                TappieAPI.submitPractice({
                                    uid: STUDENT_ID,
                                    unitName: TARGET_UNIT,
                                    word: targetWord,
                                    mode: MODE,
                                    azureRaw: rawAzureData
                                }).then(data => {
                                    clearTimeout(fetchTimeout); // ✅ 平安歸來，拆除炸彈
                                    return data;
                                }).then(data => {
                                    scores[currentIndex] = data.practice?.score ?? data.score; 
                                    if(!window.feedbacks) window.feedbacks = [];
                                    window.feedbacks[currentIndex] = data.practice?.feedback || data.feedback || '已完成評分';
                                    
                                    // 🚀 成功！解除灰色裝甲，恢復原始紅色按鈕
                                    rb.classList.remove('processing-locked');
                                    renderWord();
                                }).catch((err) => {
                                    clearTimeout(fetchTimeout); // 💣 發生錯誤也要拆除炸彈
                                    
                                    // 判斷是因為 Timeout 被我們斬斷，還是真的發生錯誤
                                    if (err.name === 'AbortError') {
                                        document.getElementById('status').innerText = "⚠️ 網路壅塞，請重按麥克風";
                                    } else {
                                        document.getElementById('status').innerText = "⚠️ 導師寫評語失敗";
                                    }
                                    
                                    document.getElementById('status').style.color = "#e74c3c";
                                    rb.classList.remove('processing-locked'); // 🛡️ 強制解鎖按鈕
                                    renderWord();
                                });

                            } else {
                                document.getElementById('status').innerText = "❌ 發音含糊或無關，請重唸";
                                document.getElementById('status').style.color = "#e74c3c";
                                rb.classList.remove('processing-locked');
                                renderWord();
                            }
                            recognizer.close();
                        },
                        (err) => {
                            document.getElementById('status').innerText = "🚨 引擎連線錯誤";
                            document.getElementById('status').style.color = "#e74c3c";
                            rb.classList.remove('processing-locked');
                            renderWord();
                            recognizer.close();
                        }
                    );
                } catch(err) {
                    console.error(err);
                    document.getElementById('status').innerText = "🚨 音檔處理失敗，請重試";
                    document.getElementById('status').style.color = "#e74c3c";
                    rb.classList.remove('processing-locked');
                    renderWord(); 
                }
            };
            practiceRecorder.stop();
        }
    };

    // 🚀 核心修復：騙過系統的「放開」偵測！
    // 改用 pointerdown 觸發，並在錄音期間攔截所有「放開」的訊號，音樂就不會自己跑出來了
    rb.onpointerdown = togglePracticeRecord;
    rb.onclick = null; // 確保不會與舊事件衝突
    
    // 🛡️ 訊號攔截結界
    rb.onpointerup = (e) => { 
        if (isRecording) { e.stopImmediatePropagation(); e.stopPropagation(); e.preventDefault(); } 
    };
    rb.onpointerout = (e) => { 
        if (isRecording) { e.stopImmediatePropagation(); e.stopPropagation(); e.preventDefault(); } 
    };
    rb.onpointercancel = (e) => { 
        if (isRecording) { e.stopImmediatePropagation(); e.stopPropagation(); e.preventDefault(); } 
    };
  }

        submitBtn.style.backgroundColor = "#27ae60";

        let reward = 0;
        if (systemRewardTiers && systemRewardTiers.length > 0) {
            for (let t of systemRewardTiers) {
                if (avg >= t.min) { reward = t.pts; break; }
            }
        }

            rewardHint.style.color = "#d35400";

            rewardHint.innerText = `✅ 挑戰成功！`;

  function updateArenaUI(roomId, isInit = false) {
    // 🚀 補上 &id=${STUDENT_ID}
    fetch(`${GAS_URL}?action=get_battle_status&id=${STUDENT_ID}&roomId=${roomId}&t=${new Date().getTime()}`)
      .then(res => res.json()).then(data => {
        const isMeHost = (normalizeStr(STUDENT_ID) === normalizeStr(data.hostId));
        const myNameEl = document.getElementById('my-name');
        if (myNameEl) myNameEl.innerText = isMeHost ? data.hostName : (data.guestName || "挑戰者");

        window.myTheme = isMeHost ? data.hostTheme : data.guestTheme;
        window.opTheme = isMeHost ? data.guestTheme : data.hostTheme;

        // 取得雙方圖片網址 (🚀 對手變數改成 let 才能被覆蓋)
        const myImgUrl = isMeHost ? data.hostImg : data.guestImg;
        let opImgUrl = isMeHost ? data.guestImg : data.hostImg;

        // 取得雙方 Rarity 和 Mask
        const finalMyRarity = isMeHost ? (data.hostRarity || 'N') : (data.guestRarity || 'N');
        let finalOpRarity = isMeHost ? (data.guestRarity || 'N') : (data.hostRarity || 'N');
        const finalMyMask = isMeHost ? (data.hostMask || '') : (data.guestMask || '');
        let finalOpMask = isMeHost ? (data.guestMask || '') : (data.hostMask || '');

        let finalOpName = isMeHost ? (data.guestName || "對手") : data.hostName;

        // 🚀 核心攔截：萬能 AI 與 Boss 遮罩補完計畫！
        if (isEventMode && EVENT_AVATAR && window.characterAssets && window.characterAssets[EVENT_AVATAR]) {
            const boss = window.characterAssets[EVENT_AVATAR];
            finalOpName = `[活動] ${boss.name}`;
            opImgUrl = boss.img; 
            finalOpRarity = boss.rarity || 'SSR'; 
            finalOpMask = boss.mask || ''; 
        } else if (finalOpName.includes('Ai')) {
            // 自動去圖鑑中匹配 Ai 的專屬遮罩
            const aiAvatar = Object.values(window.characterAssets || {}).find(c => c.name === finalOpName);
            if (aiAvatar) {
                opImgUrl = aiAvatar.img || opImgUrl;
                finalOpRarity = aiAvatar.rarity || 'N';
                finalOpMask = aiAvatar.mask || '';
            }
        }

        document.getElementById('op-name').innerText = finalOpName;

        // 存為全域變數供結算畫面使用
        window.currentMyRarity = finalMyRarity; window.currentMyMask = finalMyMask;
        window.currentOpRarity = finalOpRarity; window.currentOpMask = finalOpMask;

        // 🚀 寫入我方戰場卡片 (套用 3D 結構的背景)
        const myCardEl = document.getElementById('my-card');
        const myCardBg = document.getElementById('my-card-bg');
        if (myCardBg && myImgUrl) myCardBg.style.backgroundImage = `url('${myImgUrl}')`;
        myCardEl.setAttribute('data-rarity', finalMyRarity);
        if (finalMyMask) {
            myCardEl.classList.add('masked');
            myCardEl.style.setProperty('--mask', finalMyMask.includes('url(') ? finalMyMask : `url('${finalMyMask}')`);
        } else { myCardEl.classList.remove('masked'); }
        
        // 🚀 寫入對手戰場卡片
        const opCardEl = document.getElementById('op-card');
        const opCardBg = document.getElementById('op-card-bg');
        if (opCardBg && opImgUrl) opCardBg.style.backgroundImage = `url('${opImgUrl}')`;
        opCardEl.setAttribute('data-rarity', finalOpRarity);
        if (finalOpMask) {
            opCardEl.classList.add('masked');
            opCardEl.style.setProperty('--mask', finalOpMask.includes('url(') ? finalOpMask : `url('${finalOpMask}')`);
        } else { opCardEl.classList.remove('masked'); }

        document.getElementById('battle-arena').classList.add('battle-ready');

        // 更新圓點分數 (🚀 嚴格對齊版)
        const hS = data.hostScores || [];
        const gS = data.guestScores || [];
        myTotalWins = 0; opTotalWins = 0;
        
        // 我們不先 filter 掉 -1，而是直接用迴圈一局一局比對！
        // 只有雙方陣列在同一個局數都有值，且都不是 -1 (準備狀態)，才進行勝負判定。
        const commonLen = Math.min(hS.length, gS.length);
        
        for(let i = 0; i < commonLen; i++) { 
            let hostScore = hS[i];
            let guestScore = gS[i];
            
            // 🚀 關鍵防護：如果有人這局的分數是 -1，代表他還沒交卷，這局絕對不能結算！
            if (hostScore === -1 || guestScore === -1) {
                continue; // 跳過這局，不給任何人亮燈
            }
            
            // 將大招分數還原為基礎分數來比較
            let realHost = hostScore > 500 ? hostScore - 1000 : hostScore;
            let realGuest = guestScore > 500 ? guestScore - 1000 : guestScore;

            if (realHost > realGuest) {
                const inc = isMU ? 2 : 1;
                isMeHost ? myTotalWins += inc : opTotalWins += inc; 
            } else if (realGuest > realHost) {
                const inc = isOU ? 2 : 1;
                isMeHost ? opTotalWins += inc : myTotalWins += inc; 
            }
        }
        
        document.getElementById('my-rounds').innerHTML = renderDots(myTotalWins, true);
        document.getElementById('op-rounds').innerHTML = renderDots(opTotalWins, false);

        // 啟動互動引擎 (把場上所有的 card 都掃描一次)
        setTimeout(() => { initInteractiveHoloCards(); }, 500);
      });
  }

    return html;
  }

  const battleBtn = document.getElementById('battle-record-btn');
  let battleRecorder;
  let battleChunks = [];
  let isBattleRecording = false;

  if(battleBtn) {
    const toggleBattleRecord = async (e) => { 
        e.preventDefault();
        
        // 🛑 如果這回合已經送出了，直接阻擋
        if (roundSubmitted) return;

        // 🔵 狀態 A：如果目前沒有在錄音 -> 啟動錄音
        if (!isBattleRecording) {
            isBattleRecording = true;
            
            // 強制切斷所有正在播放的讀音
            window.speechSynthesis.cancel();
            if (audioCtx && audioCtx.state === 'running') {
                audioCtx.suspend().then(() => audioCtx.resume());
            }
            clearInterval(currentLimitTimer);

            // 一按下錄音，就隱藏那兩個懸浮按鈕
            const hintBtn = document.getElementById('hint-btn');
            const skillBtn = document.getElementById('skill-btn');
            if (hintBtn) hintBtn.style.display = 'none';
            if (skillBtn) skillBtn.style.display = 'none';

            // 觸發按鈕與卡片的充能狀態
            const myCard = document.getElementById('my-card'); 
            if (isUltimateMode) {
                battleBtn.classList.add('ult-recording-active'); // 變金色大招狀態
                if(myCard) myCard.classList.add('ultimate-charging'); 
            } else {
                battleBtn.classList.add('recording-active'); // 變藍色錄音狀態
                if(myCard) myCard.classList.add('charging-mana');     
            }

            // 🚀 核心防護 1：喚醒系統音效引擎
            if (!sysAudioCtx) sysAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (sysAudioCtx.state === 'suspended') await sysAudioCtx.resume();

            // 🚀 核心防護 2：檢查麥克風心跳，若被瀏覽器強制休眠則立刻重啟！
            if (!globalMicStream || !globalMicStream.active || globalMicStream.getAudioTracks()[0].readyState === 'ended') { 
                console.log("麥克風休眠，重新申請權限...");
                try {
                    globalMicStream = await navigator.mediaDevices.getUserMedia({ 
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1, sampleRate: 16000 } 
                    });
                } catch (err) {
                    alert("⚠️ 無法連線麥克風，請確認權限！"); 
                    isBattleRecording = false;
                    battleBtn.classList.remove('recording-active', 'ult-recording-active');
                    return; 
                }
            }

            battleRecorder = new MediaRecorder(globalMicStream);
            battleChunks = [];
            battleRecorder.ondataavailable = ev => { if (ev.data.size > 0) battleChunks.push(ev.data); };
            battleRecorder.start();
            
            document.getElementById('battle-info').innerText = "🔴 錄音中... (再次點擊結束)";
            document.getElementById('battle-info').style.color = "#eb3b5a";
            
            // 10 秒防呆截斷
            if (battleTimeout) clearTimeout(battleTimeout);
            battleTimeout = setTimeout(() => {
                if (isBattleRecording) {
                    console.log("⏱️ 戰鬥錄音超時 10 秒，強制發射！");
                    toggleBattleRecord(e); // 模擬第二次點擊
                }
            }, 12000);

        }
        // 🔴 狀態 B：如果目前正在錄音 -> 停止錄音並送出
        else {
            isBattleRecording = false;
            if (battleTimeout) clearTimeout(battleTimeout); // 拆除炸彈
            
            // 拔除錄音狀態，換上灰色鎖定裝甲
            battleBtn.classList.remove('recording-active', 'ult-recording-active'); 
            battleBtn.classList.add('processing-locked');
            
            // 卡片充能立刻停止
            const myCard = document.getElementById('my-card');
            if(myCard) myCard.classList.remove('charging-mana', 'ultimate-charging');
            
            if (!battleRecorder || battleRecorder.state !== "recording") return;
            
            roundSubmitted = true; 
            document.getElementById('battle-info').innerText = "⚙️ 封裝音檔中...";
            document.getElementById('battle-info').style.color = "#f1c40f";

            battleRecorder.onstop = async () => {
                const rawBlob = new Blob(battleChunks); 
                
                // 防呆，短按空包彈直接給 0 分
                if (battleChunks.length === 0 || rawBlob.size < 500) {
                    document.getElementById('battle-info').innerText = "🚨 錄音太短，挑戰失敗";
                    document.getElementById('battle-info').style.color = "#e74c3c";
                    submitBattleScore(ROOM_ID, 0);
                    return;
                }
                
                try {
                    const voiceOk = await incrementVoiceUsageOrBlock('battle_round');
                    if (!voiceOk) {
                        roundSubmitted = false;
                        battleBtn.classList.remove('processing-locked', 'recording-active', 'ult-recording-active');
                        battleBtn.style.pointerEvents = 'auto';
                        document.getElementById('battle-info').innerText = "🎙️ 今日口說額度已用完";
                        document.getElementById('battle-info').style.color = "#e74c3c";
                        return;
                    }

                    const wavFile = await createWavFileFromBlob(rawBlob);
                    document.getElementById('battle-info').innerText = "🟢 傳送至聲學引擎...";
                    document.getElementById('battle-info').style.color = "#3498db";

                    const targetWord = battleQuizArr[currentBattleRound].en;
                    const speechConfig = SpeechSDK.SpeechConfig.fromAuthorizationToken(azureAuthToken, azureRegionCode);
                    speechConfig.speechRecognitionLanguage = "en-US";
                    
                    const audioConfig = SpeechSDK.AudioConfig.fromWavFileInput(wavFile);
                    const pronConfig = new SpeechSDK.PronunciationAssessmentConfig(
                        targetWord, SpeechSDK.PronunciationAssessmentGradingSystem.HundredMark,
                        SpeechSDK.PronunciationAssessmentGranularity.Phoneme, true
                    );

                    const recognizer = new SpeechSDK.SpeechRecognizer(speechConfig, audioConfig);
                    pronConfig.applyTo(recognizer);

                    recognizer.recognizeOnceAsync(
                        (result) => {
                            if (result.reason === SpeechSDK.ResultReason.RecognizedSpeech) {
                                const pronResult = SpeechSDK.PronunciationAssessmentResult.fromResult(result);
                                let accScore = pronResult.accuracyScore || 0;
                                let compScore = pronResult.completenessScore || 0;
                                let fluScore = pronResult.fluencyScore || 0;
                                
                                let baseScore = (accScore * 0.5) + (compScore * 0.3) + (fluScore * 0.2);
                                let missingCount = 0, brokenCount = 0, dynamicPhonemePenalty = 0;

                                if (pronResult.detailResult && pronResult.detailResult.Words) {
                                    pronResult.detailResult.Words.forEach(w => {
                                        let wAssess = w.PronunciationAssessment || {};
                                        let wScore = wAssess.AccuracyScore !== undefined ? wAssess.AccuracyScore : 0;
                                        let errType = wAssess.ErrorType || "";
                                        
                                        if (errType === "Omission" || wScore === 0 || !w.Phonemes || w.Phonemes.length === 0) {
                                            missingCount++;
                                        } else if (wScore > 0 && wScore < 50) {
                                            brokenCount++; 
                                        } else if (w.Phonemes) {
                                            w.Phonemes.forEach(p => {
                                                let pAssess = p.PronunciationAssessment || {};
                                                let pScore = pAssess.AccuracyScore !== undefined ? pAssess.AccuracyScore : 0;
                                                let baseP = 2.0; 
                                                if (pScore >= 95) dynamicPhonemePenalty += 0;       
                                                else if (pScore >= 90) dynamicPhonemePenalty += baseP * 1.0; 
                                                else if (pScore >= 85) dynamicPhonemePenalty += baseP * 1.3; 
                                                else if (pScore >= 80) dynamicPhonemePenalty += baseP * 1.5; 
                                                else if (pScore >= 75) dynamicPhonemePenalty += baseP * 1.7; 
                                                else if (pScore >= 70) dynamicPhonemePenalty += baseP * 1.9; 
                                                else if (pScore >= 65) dynamicPhonemePenalty += baseP * 2.1; 
                                                else if (pScore >= 60) dynamicPhonemePenalty += baseP * 2.3; 
                                                else dynamicPhonemePenalty += baseP * 3.0;
                                            });
                                        }
                                    });
                                }

                                let wordCount = pronResult.detailResult.Words ? pronResult.detailResult.Words.length : 1;
                                let scaleFactor = Math.max(1, Math.sqrt(wordCount)); 
                                                                
                                let penalty = ((missingCount * 15) + (brokenCount * 10) + dynamicPhonemePenalty) / scaleFactor;
                                
                                // 📉 流暢度殺手鐧 (🚀 動態寬容版：長句子不重罰結巴)
                                if (wordCount <= 3) {
                                    if (fluScore < 50) penalty += 15; 
                                    else if (fluScore < 75) penalty += 6;  
                                } else {
                                    if (fluScore < 50) penalty += 5; 
                                    else if (fluScore < 75) penalty += 2;
                                }
                                                                
                                let strictScore = Math.max(0, Math.min(100, Math.round(baseScore - penalty)));
                                if (strictScore % 5 === 0 && strictScore !== 0 && strictScore !== 100) {
                                    strictScore += (Math.random() > 0.5 ? 1 : -1); 
                                }
                                
                                document.getElementById('battle-info').innerText = "✅ 判定完成！";
                                submitBattleScore(ROOM_ID, strictScore);
                            } else {
                                document.getElementById('battle-info').innerText = "❌ 發音含糊或無關";
                                submitBattleScore(ROOM_ID, 0);
                            }
                            recognizer.close();
                        },
                        (err) => {
                            document.getElementById('battle-info').innerText = "🚨 引擎連線錯誤";
                            submitBattleScore(ROOM_ID, 0);
                            recognizer.close();
                        }
                    );
                } catch(err) {
                    console.error(err);
                    document.getElementById('battle-info').innerText = "🚨 音檔轉碼失敗";
                    submitBattleScore(ROOM_ID, 0);
                }
            };
            battleRecorder.stop();
        }
    };

    // 🚀 核心修復：戰鬥模式同步騙過系統的「放開」偵測
    battleBtn.onpointerdown = toggleBattleRecord;
    battleBtn.onclick = null; // 確保不會與舊事件衝突
    
    // 🛡️ 訊號攔截結界
    battleBtn.onpointerup = (e) => { 
        if (isBattleRecording) { e.stopImmediatePropagation(); e.stopPropagation(); e.preventDefault(); } 
    };
    battleBtn.onpointerout = (e) => { 
        if (isBattleRecording) { e.stopImmediatePropagation(); e.stopPropagation(); e.preventDefault(); } 
    };
    battleBtn.onpointercancel = (e) => { 
        if (isBattleRecording) { e.stopImmediatePropagation(); e.stopPropagation(); e.preventDefault(); } 
    };
  }

  function submitBattleScore(roomId, score) {
    if (currentLimitTimer) clearInterval(currentLimitTimer);
    document.getElementById('battle-controls').style.visibility = 'hidden';

    const myCard = document.getElementById('my-card');
    if(myCard) myCard.classList.remove('charging-mana', 'ultimate-charging');
    const bBtn = document.getElementById('battle-record-btn');
    if(bBtn) bBtn.classList.remove('active', 'ult-active');

    // 🚀 大招機制判斷
    let finalScore = score;
    let delayTime = 0; 
    if (isUltimateMode) {
        finalScore = score + 1000; 
        delayTime = 1500; 
    }

    setTimeout(() => {
        document.getElementById('battle-timer').innerHTML = `<span class="neon-score">得分：${score}</span>`;
        document.getElementById('battle-info').innerText = "等待對手...";
    }, 0); 

    // 🚀 核心升級：把 currentBattleRound 加上去！
    fetch(`${GAS_URL}?action=submit_battle_score&id=${STUDENT_ID}&roomId=${roomId}&score=${finalScore}&round=${currentBattleRound}&t=${new Date().getTime()}`)
      .then(res => res.json())
      .then((data) => { 
        // 🚀 B 慢吞吞送出分數時，發現房間早就被 A 關閉了
        if (data.status === "Finished") {
            if (window.GlobalAudio) GlobalAudio.play('popupClose'); // 播放失敗音效
            alert("⏱️ 糟糕！您送出分數的時間太晚囉！\n對手等候超時，系統已判定對手獲勝！");
            
            // 強制呼叫「0 - 5」的戰敗結算畫面給 B 看，讓他心服口服
            showImpactOverlay(0, 5, true, null, null); 
            
            setTimeout(() => {
                window.location.href = `./lobby.html?id=${encodeURIComponent(STUDENT_ID)}`;
            }, 6500); // 讓他看完敗北動畫再踢回大廳
            return;
        }

        if(waitOpTimer) clearInterval(waitOpTimer); 
        isChecking = false;
        
        // 🚀 留守者補償機制：最多等真人對手 24 秒 (12次 x 2秒)
        let maxWaitChecks = 12; 
        
        const checkBothWrapper = () => {
            // 🚀 核心防護：如果對手是 AI，我們【絕對不扣減等待次數】，讓他變成無限期等待！
            // 判定方式：只要對手名稱包含 Ai 或 活動，就視為機器人
            const opNameElement = document.getElementById('op-name');
            const isOpponentAI = opNameElement && (opNameElement.innerText.includes("Ai") || opNameElement.innerText.includes("活動"));

            if (!isOpponentAI) {
                maxWaitChecks--;
            }

            if (maxWaitChecks <= 0) {
                clearInterval(waitOpTimer);
                alert("對手網路不穩或已逃跑，系統判定您獲勝！🎉");
                
                fetch(`${GAS_URL}?action=claim_timeout_win&id=${STUDENT_ID}&roomId=${roomId}`)
                  .then(() => {
                      showImpactOverlay(5, 0, true, null, null); 
                      
                      setTimeout(() => {
                          const triggerOverlay = document.getElementById('gacha-trigger-overlay');
                          const enterBtn = document.getElementById('btn-enter-gacha');
                          triggerOverlay.style.display = 'flex';
                          setTimeout(() => { triggerOverlay.style.opacity = '1'; }, 50);
                          enterBtn.onclick = () => {
                              const opponentName = document.getElementById('op-name').innerText;
                              document.getElementById('impact-overlay').classList.remove('active');
                              triggerOverlay.style.display = 'none';
                              if (window.GlobalAudio) GlobalAudio.playGachaBGM();
                              initGacha(opponentName);
                          };
                      }, 6500);
                  });
                return;
            }
            checkBoth(roomId);
        };

        checkBothWrapper(); 
        waitOpTimer = setInterval(checkBothWrapper, 2000);
      });
  }

  // 🚀 特效調度器：掛載絕對光球，避免殘留
  function triggerBattleAnimations(myNum, opNum, isFinal, myTotalWins, opTotalWins, isMyUlt, isOpUlt, myImgUrl, opImgUrl) {
    const myCard = document.getElementById('my-card'); 
    const opCard = document.getElementById('op-card');
    const arenaBg = document.getElementById('battle-arena');

    // 清除舊動畫狀態
    const animations = ['charging-mana', 'ultimate-charging', 'winner-glory', 'loser-shatter', 'take-damage'];
    if(myCard) myCard.classList.remove(...animations); 
    if(opCard) opCard.classList.remove(...animations);
    if(arenaBg) arenaBg.classList.remove('screen-flash-red', 'screen-flash-cyan', 'screen-flash-gold');
    void myCard.offsetWidth; void opCard.offsetWidth;

    let delayBeforeAttack = 0;
    if (myNum > opNum && isMyUlt) {
        // 🚀 埋點：大招切入音效
        if (window.GlobalAudio) GlobalAudio.play('cutin');
        playCutinAnimation(`url('${myImgUrl}')`, true);
        delayBeforeAttack = 1500; 
    } else if (opNum > myNum && isOpUlt) {
        // 🚀 埋點：大招切入音效
        if (window.GlobalAudio) GlobalAudio.play('cutin');
        playCutinAnimation(`url('${opImgUrl}')`, false);
        delayBeforeAttack = 1500;
    }

    setTimeout(() => {
        const myContainer = myCard.closest('.my-container');
        const opContainer = opCard.closest('.op-container');

        // 🚀 動態生成掛在 arena 上的物理光球
        function createBlast(type, delay = 0, isUlt = false) { // 加入 isUlt 參數判斷是否為大招
           setTimeout(() => {
             // 🚀 埋點：光球發射音效 (根據是否為大招播放不同聲音)
             if (window.GlobalAudio) GlobalAudio.play(isUlt ? 'fireUlt' : 'fireNormal');
             
             const blast = document.createElement('div');
             blast.className = `blast-particle ${type}`;
             arenaBg.appendChild(blast);
             setTimeout(() => blast.remove(), 1000); // 播完自毀
           }, delay);
        }

        if (myNum > opNum) { 
          if(myCard) {
            if(myContainer) myContainer.classList.add('recoil-my'); 
            if (isMyUlt) {
                myCard.classList.add('ultimate-charging'); 
                createBlast('blast-ult-my', 100, true); createBlast('blast-ult-my', 300, true); // 傳入 true 代表是大招
                if(arenaBg) arenaBg.classList.add('screen-flash-gold');
            } else {
                myCard.classList.add('charging-mana'); 
                createBlast('blast-my', 100, false);
                if(arenaBg) arenaBg.classList.add('screen-flash-cyan'); 
            }
            if(isFinal) setTimeout(() => myCard.classList.add('winner-glory'), 800);
          }
          if(opCard) {
              opCard.classList.add(isFinal ? 'loser-shatter' : 'take-damage');
              // 🚀 埋點：受擊音效 (配合動畫的 0.5s 延遲)
              setTimeout(() => { if (window.GlobalAudio) GlobalAudio.play('hit'); }, 500);
          }
        }
        else if (myNum < opNum) { 
          if(opCard) {
            if(opContainer) opContainer.classList.add('recoil-op'); 
            if (isOpUlt) {
                opCard.classList.add('ultimate-charging'); 
                createBlast('blast-ult-op', 100, true); createBlast('blast-ult-op', 300, true);
                if(arenaBg) arenaBg.classList.add('screen-flash-gold');
            } else {
                opCard.classList.add('charging-mana'); 
                createBlast('blast-op', 100, false);
                if(arenaBg) arenaBg.classList.add('screen-flash-red'); 
            }
            if(isFinal) setTimeout(() => opCard.classList.add('winner-glory'), 800);
          }
          if(myCard) {
              myCard.classList.add(isFinal ? 'loser-shatter' : 'take-damage');
              // 🚀 埋點：受擊音效
              setTimeout(() => { if (window.GlobalAudio) GlobalAudio.play('hit'); }, 500);
          }
        }

        updateCardDamage(myCard, opTotalWins);
        updateCardDamage(opCard, myTotalWins);

        // 🚀 如果是最後一局 (isFinal)，多等 0.8 秒，讓卡片徹底碎裂掉出螢幕後，結算畫面才彈出！
        let impactDelay = isFinal ? 2400 : 1600;

        setTimeout(() => {
          // 清除光球與後座力殘留
          if(myCard) myCard.classList.remove('charging-mana', 'ultimate-charging');
          if(opCard) opCard.classList.remove('charging-mana', 'ultimate-charging');
          if(myContainer) myContainer.classList.remove('recoil-my');
          if(opContainer) opContainer.classList.remove('recoil-op');
          
          showImpactOverlay(myNum, opNum, isFinal, myImgUrl, opImgUrl);
        }, 1600); 

    }, delayBeforeAttack); 
  }

  // 2. 檢查雙方分數 (修復括號錯誤、整合抽獎系統、並加入嚴格鎖定機制)
  function checkBoth(roomId) {
    if(isChecking) return; 
    isChecking = true;
    // 🚀 補上 &id=${STUDENT_ID}
    fetch(`${GAS_URL}?action=get_battle_status&id=${STUDENT_ID}&roomId=${roomId}&t=${new Date().getTime()}`)
      .then(res => res.json()).then(data => {
        // 🚀 新增：如果發現房間突然結束了，且勝利者是我！(對手 F5 逃跑了)
        if (data.status === "Finished" && normalizeStr(data.winnerId) === normalizeStr(STUDENT_ID)) {
            clearInterval(waitOpTimer);
            alert("對手已逃跑，您獲得了最終勝利！🏆");
            showImpactOverlay(5, 0, true, null, null); 
            
            // 🚀 補上這段：3.5 秒後彈出抽盲盒按鈕
            setTimeout(() => {
                const triggerOverlay = document.getElementById('gacha-trigger-overlay');
                const enterBtn = document.getElementById('btn-enter-gacha');
                triggerOverlay.style.display = 'flex';
                setTimeout(() => { triggerOverlay.style.opacity = '1'; }, 50);
                enterBtn.onclick = () => {
                    const opponentName = document.getElementById('op-name').innerText;
                    document.getElementById('impact-overlay').classList.remove('active');
                    triggerOverlay.style.display = 'none';
                    if (window.GlobalAudio) GlobalAudio.playGachaBGM();
                    initGacha(opponentName);
                };
            }, 6500);
            return;
        }

        const hS = data.hostScores.filter(s => s !== -1);
        const gS = data.guestScores.filter(s => s !== -1);

        if (hS.length > currentBattleRound && gS.length > currentBattleRound) {
          // 🚀 發現雙方都答題了！立刻把輪詢的計時器殺死，防止重複進入此區塊！
          clearInterval(waitOpTimer);
          waitOpTimer = null; 
          
          const isMeHost = (normalizeStr(STUDENT_ID) === normalizeStr(data.hostId));
          const rawMyS = isMeHost ? hS[currentBattleRound] : gS[currentBattleRound];
          const rawOpS = isMeHost ? gS[currentBattleRound] : hS[currentBattleRound];
          
          const myImgUrl = isMeHost ? data.hostImg : data.guestImg;
          let opImgUrl = isMeHost ? data.guestImg : data.hostImg;

          // 🚀 核心攔截：把結算畫面與大招切入畫面的圖片也強制換成 Boss！
          if (isEventMode && EVENT_AVATAR && window.characterAssets && window.characterAssets[EVENT_AVATAR]) {
              opImgUrl = window.characterAssets[EVENT_AVATAR].img;
          }

          const myUltThisRound = rawMyS > 500;
          const opUltThisRound = rawOpS > 500;

          const myS = myUltThisRound ? rawMyS - 1000 : rawMyS;
          const opS = opUltThisRound ? rawOpS - 1000 : rawOpS;
        
          myTotalWins = 0; opTotalWins = 0;
          for(let i=0; i <= currentBattleRound; i++) {
              let rawM = isMeHost ? hS[i] : gS[i];
              let rawO = isMeHost ? gS[i] : hS[i];
              let isMU = rawM > 500;
              let isOU = rawO > 500;
              let finalM = isMU ? rawM - 1000 : rawM;
              let finalO = isOU ? rawO - 1000 : rawO;
              if(finalM > finalO) myTotalWins += (isMU ? 2 : 1);
              else if(finalO > finalM) opTotalWins += (isOU ? 2 : 1);
          }

          document.getElementById('my-rounds').innerHTML = renderDots(myTotalWins, true);
          document.getElementById('op-rounds').innerHTML = renderDots(opTotalWins, false);

          const isFinal = (myTotalWins >= 5 || opTotalWins >= 5 || currentBattleRound >= 9);
        
          triggerBattleAnimations(myS, opS, isFinal, myTotalWins, opTotalWins, myUltThisRound, opUltThisRound, myImgUrl, opImgUrl);
        
          let delayBeforeAttack = ( (myS > opS && myUltThisRound) || (opS > myS && opUltThisRound) ) ? 1500 : 0;
          
          // 🚀 同步修正：如果這一局有人拿到 5 分，總等待時間要加上碎裂動畫的時間差
          let baseAnimTime = isFinal ? 2400 : 1600;
          let totalWaitTime = delayBeforeAttack + baseAnimTime + 2800;

          setTimeout(() => {
              const overlay = document.getElementById('impact-overlay');
              // 🚀 觸發帥氣的飛出退場動畫
              overlay.classList.add('fade-out');
              
              setTimeout(() => {
                  overlay.classList.remove('active', 'fade-out'); 
                  
                  if (isFinal) { 
                      // 🚀 攔截點：判斷是我方獲勝還是對手獲勝
                      if (myTotalWins > opTotalWins) {
                          
                          // 🚀 延遲 3.5 秒 (讓玩家有充分時間看清楚華麗的 3D 結算卡片與分數)
                          setTimeout(() => {
                              const triggerOverlay = document.getElementById('gacha-trigger-overlay');
                              const enterBtn = document.getElementById('btn-enter-gacha');
                              
                              triggerOverlay.style.display = 'flex';
                              
                              // 給一點點延遲讓 CSS transition 生效
                              setTimeout(() => {
                                  triggerOverlay.style.opacity = '1';
                              }, 50);

                              // 綁定點擊事件
                              enterBtn.onclick = () => {
                                  const opponentName = document.getElementById('op-name').innerText;
                                  
                                  // 隱藏兩個舊畫面
                                  document.getElementById('impact-overlay').classList.remove('active');
                                  triggerOverlay.style.display = 'none';
                                  
                                  // 🚀 呼叫 GlobalAudio 專屬方法，切換抽卡音樂
                                  if (window.GlobalAudio) {
                                      GlobalAudio.playGachaBGM();
                                  }
                                  
                                  initGacha(opponentName);
                              };

                  isChecking = false;

  // 🚀 核心：唯一的轉盤！從 0~100 轉出結果
  function drawSinglePrize() {
      // 讀取從後台傳來的直列清單，若無則用預設
      const pool = (window.gamiConfig && window.gamiConfig.gachaItems && window.gamiConfig.gachaItems.length > 0) 
                   ? window.gamiConfig.gachaItems 
                   : DEFAULT_GACHA_ITEMS;

      let totalProb = pool.reduce((sum, item) => sum + Number(item.prob), 0);
      let rand = Math.random() * totalProb; // 如果管理員乖乖設定，這裡的分母就是剛好 100
      let selectedItem = pool[0]; // 防呆保底

      for (let item of pool) {
          if (rand < item.prob) {
              selectedItem = item;
              break;
          }
          rand -= item.prob;
      }

      let boxRarity = selectedItem.rarity || 'N';
      let glowClass = 'crack-white';
      if (boxRarity === 'SR') glowClass = 'crack-purple';
      if (boxRarity === 'SSR') glowClass = 'crack-gold';

      return {
          type: selectedItem.type,
          value: selectedItem.value,
          boxRarity: boxRarity, // 順便把這層的外盒顏色回傳給系統
          label: selectedItem.type === 'points' ? `${selectedItem.value} 點` : boxRarity,
          class: `prize-${boxRarity}`,
          glow: glowClass
      };
  }

  function initGacha(opponentName) {
    window.wonPoints = 0;   
    window.wonAvatars = []; 
    // 🚀 強制預載所有盲盒與角色圖片，徹底消滅白底破圖！
    Object.values(BOX_COVERS).forEach(src => { new Image().src = src; });
    Object.values(characterAssets).forEach(c => { new Image().src = c.img; });
    
    // 🚀 偵測是否為突發事件模式 (看網址有沒有 &isEvent=true)
    const isEventMode = new URLSearchParams(window.location.search).get('isEvent') === 'true';
    
    const overlay = document.getElementById('gacha-overlay');
    const board = document.getElementById('gacha-board');
    const picksSpan = document.getElementById('picks-left');
    
    // 🚀 1. 讀取動態設定的抽獎次數
    const picksConf = window.gamiConfig ? window.gamiConfig.gachaPicks : { "初階Ai": 1, "中階Ai": 2, "高階Ai": 3, "玩家對戰": 3, "活動Boss": 1 };

    if (isEventMode) {
        // 🚀 防呆：Boss 最多只能抽 1 次！
        let bossPicks = picksConf["活動Boss"] || 1;
        gachaPicksLeft = Math.max(1, Math.min(1, bossPicks)); 
    } else {
        // 一般對戰依照難度給予動態次數
        if (opponentName.includes("初階")) gachaPicksLeft = picksConf["初階Ai"];
        else if (opponentName.includes("中階")) gachaPicksLeft = picksConf["中階Ai"];
        else if (opponentName.includes("高階") || opponentName.includes("Ai")) gachaPicksLeft = picksConf["高階Ai"];
        else gachaPicksLeft = picksConf["玩家對戰"]; 
        
        // 🚀 終極防爆防呆機制：不管管理員設多少，強制鎖死在 1 ~ 6 次之間！
        gachaPicksLeft = Math.max(1, Math.min(6, gachaPicksLeft));
    }

    picksSpan.innerText = gachaPicksLeft;
    gachaWonItems = [];
    isGachaResolving = false;
    focusedCardIndex = -1;
    board.innerHTML = ""; 

    // 🚀 2. 決定要產生幾張卡片

    gachaCardsData = [];
    
    for(let i = 0; i < cardCount; i++) {
        let randomWord = battleQuizArr.length > 0 ? battleQuizArr[Math.floor(Math.random() * battleQuizArr.length)].en : "OPEN";
        let boxRarity, prize;

        if (isEventMode) {
            // (活動 Boss 邏輯不變)

                bossRarity = window.characterAssets[EVENT_AVATAR].rarity || 'SSR';

                else if (bossRarity === 'R') { prizeClass = 'prize-R'; prizeGlow = 'crack-white'; }
                else if (bossRarity === 'N') { prizeClass = 'prize-N'; prizeGlow = 'crack-white'; }
            }

            boxRarity = bossRarity; 
            if (Math.random() < 0.3) {
                prize = { type: 'avatar', value: EVENT_AVATAR, label: '活動限定', class: prizeClass, glow: prizeGlow };
            } else {
                prize = { type: 'points', value: 10, label: '10 點', class: 'prize-N', glow: 'crack-white' };
            }
        } else {
            // 🚀 一般模式：一鍵抽出卡片與對應外盒！

  function bindVoiceLock(index) {
      const btn = document.getElementById(`lock-btn-${index}`);
      const status = document.getElementById(`lock-status-${index}`);
      const cardData = gachaCardsData[index];
      let gachaRecorder;
      let gachaChunks = [];

      // 🚀 將 Gacha 改為單擊 Toggle 邏輯
      const toggleGachaRecord = async (e) => {
          e.preventDefault();
          
          // 🛑 狀態防護：如果卡片已翻開、沒次數了，或是正在判定中，直接阻擋
          if (cardData.flipped || gachaPicksLeft <= 0 || isGachaResolving || btn.style.pointerEvents === "none") return;

          // 🔵 狀態 A：如果目前沒有在錄音 -> 啟動錄音
          if (!isGachaRecording) {
              isGachaRecording = true;
              
              // 強制切斷所有正在播放的讀音
              window.speechSynthesis.cancel();
              if (audioCtx && audioCtx.state === 'running') {
                  audioCtx.suspend().then(() => audioCtx.resume());
              }

              // 🚀 核心防護 1：喚醒系統音效引擎
              if (!sysAudioCtx) sysAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
              if (sysAudioCtx.state === 'suspended') await sysAudioCtx.resume();

              // 🚀 核心防護 2：檢查麥克風心跳，若被瀏覽器強制休眠則立刻重啟！
              if (!globalMicStream || !globalMicStream.active || globalMicStream.getAudioTracks()[0].readyState === 'ended') { 
                  console.log("麥克風休眠，重新申請權限...");
                  try {
                      globalMicStream = await navigator.mediaDevices.getUserMedia({ 
                          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1, sampleRate: 16000 } 
                      });
                  } catch (err) {
                      alert("⚠️ 無法連線麥克風，請確認權限！"); 
                      isGachaRecording = false; 
                      return; 
                  }
              }

              gachaChunks = [];
              btn.classList.add('recording'); // 套用 Gacha 專屬的紅色脈衝動畫
              status.innerText = "🔴 錄音中... (再次點擊判定)";
              status.style.color = "#eb3b5a";

              gachaRecorder = new MediaRecorder(globalMicStream);
              gachaRecorder.ondataavailable = ev => { if(ev.data.size > 0) gachaChunks.push(ev.data); };
              gachaRecorder.start();
              
          } 
          // 🔴 狀態 B：如果目前正在錄音 -> 停止錄音並進行判定
          else {
              isGachaRecording = false;
              btn.classList.remove('recording');
              btn.style.pointerEvents = "none"; // 判定中暫時封印按鈕

              status.innerText = "⚙️ 封裝音檔中...";
              status.style.color = "#f1c40f";

              if (!gachaRecorder || gachaRecorder.state !== "recording") {
                  btn.style.pointerEvents = "auto";
                  return;
              }

              gachaRecorder.onstop = async () => {
                  const rawBlob = new Blob(gachaChunks);
                  
                  // 防呆，短按空包彈直接阻擋
                  if (gachaChunks.length === 0 || rawBlob.size < 500) {
                      status.innerText = "🚨 錄音太短，請重試";
                      status.style.color = "#e74c3c";
                      btn.style.pointerEvents = "auto"; // 失敗也要解鎖按鈕
                      return;
                  }

                  try {
                      const voiceOk = await incrementVoiceUsageOrBlock('battle_gacha_unlock');
                      if (!voiceOk) {
                          status.innerText = "🎙️ 今日口說額度已用完";
                          status.style.color = "#e74c3c";
                          btn.style.pointerEvents = "auto";
                          return;
                      }

                      const wavFile = await createWavFileFromBlob(rawBlob);
                      status.innerText = "🔵 驗證密語中...";
                      status.style.color = "#3498db";

                      // 🚀 保留原本的 Token 判斷
                      if (!azureAuthToken) {
                         status.innerText = "🚨 系統授權到期，請重新整理網頁";
                         status.style.color = "#e74c3c";
                         btn.style.pointerEvents = "auto";
                         return;
                      }

                      const speechConfig = SpeechSDK.SpeechConfig.fromAuthorizationToken(azureAuthToken, azureRegionCode);
                      speechConfig.speechRecognitionLanguage = "en-US";
                      const audioConfig = SpeechSDK.AudioConfig.fromWavFileInput(wavFile);
                      const pronConfig = new SpeechSDK.PronunciationAssessmentConfig(
                          cardData.word, SpeechSDK.PronunciationAssessmentGradingSystem.HundredMark,
                          SpeechSDK.PronunciationAssessmentGranularity.Phoneme, true
                      );

                      const recognizer = new SpeechSDK.SpeechRecognizer(speechConfig, audioConfig);
                      pronConfig.applyTo(recognizer);

                      recognizer.recognizeOnceAsync((result) => {
                          btn.style.pointerEvents = "auto"; // 判定完成，解開按鈕封印
                          if (result.reason === SpeechSDK.ResultReason.RecognizedSpeech) {
                              const pronResult = SpeechSDK.PronunciationAssessmentResult.fromResult(result);
                              if ((pronResult.accuracyScore || 0) >= 70) {
                                  status.innerText = "封印解除！";
                                  status.style.color = "#26de81";
                                  triggerReveal(index);
                              } else {
                                  status.innerText = "密語不夠準確，請重唸";
                                  status.style.color = "#e74c3c";
                              }
                          } else {
                              status.innerText = "未辨識到密語";
                              status.style.color = "#e74c3c";
                          }
                          recognizer.close();
                      }, (err) => {
                          console.error("Azure 辨識錯誤:", err);
                          status.innerText = "🚨 引擎連線錯誤，請重試";
                          status.style.color = "#e74c3c";
                          btn.style.pointerEvents = "auto"; // 必須解開按鈕，否則卡死
                          recognizer.close();
                      });
                  } catch(err) {
                      status.innerText = "判定失敗，請重試";
                      btn.style.pointerEvents = "auto";
                  }
              };
              gachaRecorder.stop();
          }
      };
      
      // 🚀 核心修復：騙過系統的「放開」偵測！
      // 綁定點擊事件，並在錄音期間攔截所有「放開」的訊號，確保背景音樂不會自己跑出來
      btn.onpointerdown = toggleGachaRecord;
      btn.onclick = null; // 確保不會與舊事件衝突
      
      // 🛡️ 訊號攔截結界
      btn.onpointerup = (e) => { 
          if (isGachaRecording) { e.stopImmediatePropagation(); e.stopPropagation(); e.preventDefault(); } 
      };
      btn.onpointerout = (e) => { 
          if (isGachaRecording) { e.stopImmediatePropagation(); e.stopPropagation(); e.preventDefault(); } 
      };
      btn.onpointercancel = (e) => { 
          if (isGachaRecording) { e.stopImmediatePropagation(); e.stopPropagation(); e.preventDefault(); } 
      };
  }

  // 🚀 觸發封印碎裂與翻開動畫
  function triggerReveal(index) {
      const cardEl = document.getElementById(`gacha-card-${index}`);
      const cardRoot = cardEl.querySelector('.card'); 
      const prizeInfo = gachaCardsData[index].prize;
      
      cardEl.classList.add(prizeInfo.glow);
      
      const unlockUi = cardEl.querySelector('.unlock-ui');
      if (unlockUi) unlockUi.style.display = 'none';
      
      // 🚀 提速 1：把原本的 1000ms 改成 400ms，語音辨識成功後光速翻牌！
      setTimeout(() => {
          if (window.GlobalAudio) GlobalAudio.play('shatter');
          
          gachaCardsData[index].flipped = true;
          cardEl.classList.add('flipped');

          let prizeRarity = 'N';
          if (prizeInfo.class === 'prize-R') prizeRarity = 'R';
          if (prizeInfo.class === 'prize-SR') prizeRarity = 'SR';
          if (prizeInfo.class === 'prize-SSR') prizeRarity = 'SSR';
          if (cardRoot) cardRoot.setAttribute('data-rarity', prizeRarity);
          
          let prizeToAdd = { ...prizeInfo }; 
          
          if (prizeToAdd.type === 'avatar' && characterAssets[prizeToAdd.value] && characterAssets[prizeToAdd.value].mask) {
              cardRoot.classList.add('masked');
              cardRoot.style.setProperty('--mask', `url('${characterAssets[prizeToAdd.value].mask}')`);
          } else {
              cardRoot.classList.remove('masked');
              cardRoot.style.removeProperty('--mask');
          }
          
          if (prizeToAdd.type === 'avatar') {
              const charId = prizeToAdd.value;
              const alreadyOwnedInAccount = (window.myUnlockedAvatars || []).includes(charId);
              const alreadyGotInThisGacha = window.wonAvatars.includes(charId);
              
              if (alreadyOwnedInAccount || alreadyGotInThisGacha) {
                  const charName = characterAssets[charId] ? characterAssets[charId].name : prizeToAdd.label;
                  prizeToAdd.realLabel = `(重複) ${charName} → 轉為 100 點`; 
                  window.wonPoints += 100; 
              } else {
                  prizeToAdd.realLabel = characterAssets[charId] ? characterAssets[charId].name : prizeToAdd.label;
                  window.wonAvatars.push(charId); 
              }
          } else {
              window.wonPoints += prizeToAdd.value; 
              prizeToAdd.realLabel = prizeToAdd.label;
          }
          
          gachaWonItems.push(prizeToAdd);
          gachaPicksLeft--;
          document.getElementById('picks-left').innerText = gachaPicksLeft;

          if (gachaPicksLeft <= 0) {
              isGachaResolving = true;
              document.getElementById('gacha-subtitle').innerHTML = "<span style='color:#e74c3c'>次數已用盡！請點擊畫面繼續</span>";
          } else {
              document.getElementById('gacha-subtitle').innerHTML = "點擊畫面繼續抽獎";
          }

          // 🚀 核心修復：賦予放大後的卡片「點擊收合」的超能力！
          // 我們利用一個覆蓋全螢幕的隱形透明按鈕來接收點擊，確保不管點哪裡都能順利收合
          const clickReceiver = document.createElement('div');
          clickReceiver.style.position = 'fixed';
          clickReceiver.style.inset = '0';
          clickReceiver.style.zIndex = '10001'; // 確保蓋在所有東西上面
          document.body.appendChild(clickReceiver);

          // 為了防止玩家在動畫還沒跑完就狂點，我們加一個小小的 0.5 秒防呆延遲
          setTimeout(() => {
              clickReceiver.onclick = () => {
                  // 移除這個隱形接收器
                  document.body.removeChild(clickReceiver);

                  if (isGachaResolving) {
                      // 如果是最後一次抽獎，點擊後先把沒抽中的卡片翻開給玩家看
                      const allCards = document.querySelectorAll('.gacha-card');
                      gachaCardsData.forEach((c, i) => {
                          if (!c.flipped) allCards[i].classList.add('flipped', 'missed');
                      });
                      
                      document.getElementById('gacha-subtitle').innerHTML = "即將進入結算...";
                      
                      // 欣賞 1.5 秒遺憾的卡片後，自動進入結算畫面
                      setTimeout(() => {
                          cancelFocus();
                          showGachaSummary();
                      }, 1500);
                  } else {
                      // 如果還有次數，點擊後就只是單純把這張卡片收起來
                      cancelFocus();
                      document.getElementById('gacha-subtitle').innerHTML = `剩餘開啟次數：<span id="picks-left">${gachaPicksLeft}</span> 次`;
                  }
              };
          }, 500); // 👈 翻開後 0.5 秒才允許點擊收合，保護動畫完整性

      }, 400); 
  }

  // 顯示戰利品並發送 Supabase claim-gacha
  function showGachaSummary() {
    const listEl = document.getElementById('gacha-won-list');
    let html = "";

    // 保留原本前端盲盒動畫算出的戰利品摘要。
    // 重要：實際發獎以 window.wonPoints / window.wonAvatars 為準。
    gachaWonItems.forEach(item => {
        html += `<div style="font-size: 14px; line-height: 1.6; font-weight: bold;">${item.realLabel}</div>`;
    });

    const pendingPoints = Number(window.wonPoints || 0);
    const pendingAvatars = Array.isArray(window.wonAvatars) ? window.wonAvatars : [];

    html += `
      <div style="margin-top: 14px; padding: 12px; border-radius: 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);">
        <div style="font-size: 13px; color:#a4b0be; font-weight:900; letter-spacing:1px;">本次前端抽獎結算</div>
        <div style="font-size: 18px; color:#f1c40f; font-weight:900; margin-top:4px;">點數 +${pendingPoints}</div>
        ${pendingAvatars.length ? `<div style="font-size: 13px; margin-top:4px;">角色：${pendingAvatars.join(', ')}</div>` : ''}
      </div>
    `;

    if (!gachaWonItems.length && !pendingPoints && !pendingAvatars.length) {
        html = `<div style="font-size: 14px; line-height: 1.6; font-weight: bold;">目前沒有可領取的盲盒獎勵。</div>`;
    }

    listEl.innerHTML = html;
    document.getElementById('gacha-summary-popup').classList.add('show');

    const claimBtn = document.getElementById('gacha-claim-btn');
    claimBtn.onclick = async () => {
        claimBtn.innerText = "發放獎勵中...";
        claimBtn.style.pointerEvents = "none";

        try {
            const addPoints = Number(window.wonPoints || 0);
            const avatars = Array.isArray(window.wonAvatars) ? window.wonAvatars : [];
            let data = null;

            if (window.TappieAPI && TappieAPI.claimGacha) {
                data = await TappieAPI.claimGacha({
                    uid: STUDENT_ID,
                    source: 'battle_reward',
                    roomCode: ROOM_ID,
                    addPoints,
                    avatars,
                    metadata: {
                      client: 'battle_html_v4',
                      wonItems: gachaWonItems.map(item => ({
                        label: item.label,
                        realLabel: item.realLabel,
                        type: item.type,
                        value: item.value,
                        rarity: item.rarity
                      }))
                    }
                });
            } else {
                const qs = new URLSearchParams({
                    uid: STUDENT_ID,
                    source: 'battle_reward',
                    roomCode: ROOM_ID || '',
                    addPoints: String(addPoints)
                });
                if (avatars.length) qs.set('avatars', avatars.join(','));
                data = await fetch(`${TappieAPI.supabaseBaseUrl}/claim-gacha?${qs.toString()}`).then(r => r.json());
            }

            if (!data || !data.success) {
                throw new Error(data?.message || data?.error || 'Supabase claim-gacha failed');
            }

            const result = data.result || {};
            const added = Number(data.points?.added ?? result.addPoints ?? addPoints ?? 0);
            const after = data.points?.after;
            const unlocked = result.unlocked || [];
            const duplicates = result.duplicates || [];

            listEl.innerHTML += `
              <div style="margin-top: 18px; padding: 14px; border-radius: 18px; background: rgba(0,0,0,0.45); border: 1px solid rgba(241,196,15,0.45);">
                <div style="font-size: 16px; color:#f1c40f; font-weight:900; letter-spacing:1px;">✅ Supabase 領獎成功</div>
                <div style="font-size: 14px; margin-top: 8px;">發放點數：+${added}</div>
                ${unlocked.length ? `<div style="font-size: 14px; margin-top: 4px;">新解鎖角色：${unlocked.map(x => x.avatarId || x).join(', ')}</div>` : ''}
                ${duplicates.length ? `<div style="font-size: 14px; margin-top: 4px;">已擁有角色：${duplicates.map(x => x.avatarId || x).join(', ')}</div>` : ''}
                ${after !== undefined ? `<div style="font-size: 14px; margin-top: 4px;">最新點數：${after}</div>` : ''}
              </div>
            `;

            claimBtn.innerText = "返回大廳";
            claimBtn.style.pointerEvents = "auto";
            claimBtn.onclick = () => {
                window.location.href = `./lobby.html?id=${encodeURIComponent(STUDENT_ID)}`;
            };

        } catch (err) {
            console.error('Supabase claim gacha failed:', err);
            listEl.innerHTML += `
              <div style="margin-top: 18px; padding: 14px; border-radius: 18px; background: rgba(231,76,60,0.18); border: 1px solid rgba(231,76,60,0.6); color:#fff;">
                ⚠️ 領獎失敗：${String(err.message || err)}
              </div>
            `;
            claimBtn.innerText = "返回大廳";
            claimBtn.style.pointerEvents = "auto";
            claimBtn.onclick = () => {
                window.location.href = `./lobby.html?id=${encodeURIComponent(STUDENT_ID)}`;
            };
        }
    };
  }

  // 🌈 頂級 3D 互動閃卡引擎 (全場域適配版)
  // =======================================================
  function initInteractiveHoloCards() {
      // 🚀 加入 .gacha-card .card，讓盲盒也能感應滑鼠與陀螺儀！
      const cards = document.querySelectorAll('#portal-my-card, #portal-op-card, #my-card, #op-card, #impact-card, .gacha-card .card');
      
      cards.forEach(card => {
          // 🚀 致命修復：必須用 querySelectorAll 抓出正面與背面的「所有」特效圖層！
          const targetLayers = [card, ...card.querySelectorAll('.card__shine'), ...card.querySelectorAll('.card__glare')];
          let bounds;
          let ticking = false;

          function updateCard(x, y) {
              const leftX = x / bounds.width;
              const topY = y / bounds.height;
              const center = { x: leftX - 0.5, y: topY - 0.5 };
              const distance = Math.sqrt(center.x**2 + center.y**2);

              const pointerX = `${leftX * 100}%`;
              const pointerY = `${topY * 100}%`;
              const pointerFromCenter = Math.min(Math.max(distance * 2, 0), 1);

              card.style.setProperty('--rotate-x', `${center.y * -20}deg`); 
              card.style.setProperty('--rotate-y', `${center.x * 20}deg`);
              
              // 🚀 讓所有圖層都吃到滑鼠參數
              targetLayers.forEach(layer => {
                  if(layer) {
                      layer.style.setProperty('--pointer-x', pointerX);
                      layer.style.setProperty('--pointer-y', pointerY);
                      layer.style.setProperty('--pointer-from-center', pointerFromCenter);
                      layer.style.setProperty('--pointer-from-top', topY);
                      layer.style.setProperty('--pointer-from-left', leftX);
                  }
              });
              ticking = false;
          }
          
          function rotateToMouse(e) {
              if (!bounds) bounds = card.getBoundingClientRect();
              const clientX = e.touches ? e.touches[0].clientX : e.clientX;
              const clientY = e.touches ? e.touches[0].clientY : e.clientY;
              const mouseX = clientX - bounds.left;
              const mouseY = clientY - bounds.top;
              
              if (!ticking) {
                  requestAnimationFrame(() => updateCard(mouseX, mouseY));
                  ticking = true;
              }
          }

          function resetTilt() {
              card.style.transition = "transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
              card.style.setProperty('--rotate-x', '0deg');
              card.style.setProperty('--rotate-y', '0deg');
              
              // 🚀 同步更新：這裡也要用 targetLayers 來重置所有圖層
              targetLayers.forEach(layer => {
                  if(layer) {
                      layer.style.setProperty('--pointer-from-center', '0.5'); 
                      layer.style.setProperty('--pointer-x', '50%');
                      layer.style.setProperty('--pointer-y', '50%');
                  }
              });
              setTimeout(() => { card.style.transition = "none"; }, 500);
          }

          function startInteraction() {
              bounds = card.getBoundingClientRect(); 
              card.style.transition = "none"; 
          }

          card.addEventListener('pointerenter', startInteraction);
          card.addEventListener('pointermove', rotateToMouse);
          card.addEventListener('pointerleave', resetTilt);
          
          card.addEventListener('touchstart', startInteraction, {passive: true});
          card.addEventListener('touchmove', rotateToMouse, {passive: true});
          card.addEventListener('touchend', resetTilt);
      });
  }
