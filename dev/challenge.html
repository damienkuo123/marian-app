<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#eef4fb">
  <title>Tappie 口說對決｜Arena Gate v0.3</title>
  <link rel="stylesheet" href="./challenge.css?v=20260801-v03">
</head>
<body>
  <main class="challenge-app" id="challengeApp">
    <header class="battle-topbar">
      <button class="back-button" id="backButton" type="button" aria-label="返回挑戰">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5.5 9 12l6.5 6.5"/></svg>
      </button>
      <div class="title-block"><span>TAPPIE CHALLENGE</span><strong>口說對決</strong></div>
      <div class="coin-chip"><i>T</i><strong id="coinCount">220</strong></div>
    </header>

    <section class="arena-shell" aria-label="3D 對戰舞台">
      <div class="arena-sky"></div>
      <div class="arena-horizon"></div>
      <div class="arena-floor-grid"></div>
      <div class="arena-light arena-light-player"></div>
      <div class="arena-light arena-light-opponent"></div>

      <div class="score-hud">
        <div class="score-side score-player"><span>你</span><strong id="playerScore">0</strong></div>
        <div class="round-status"><b id="roundLabel">ROUND 1</b><span>先得 3 分</span></div>
        <div class="score-side score-opponent"><strong id="opponentScore">0</strong><span>對手</span></div>
      </div>

      <div class="opponent-nameplate">
        <span id="difficultyLabel">一般</span>
        <strong id="opponentName">橘光探險家</strong>
      </div>

      <div class="opponent-runtime-stage" id="opponentRuntimeStage">
        <img class="opponent-fallback" id="opponentFallback" src="./assets/opponent-fallback.png" alt="對手角色">
        <iframe
          id="opponentRuntimeFrame"
          title="LayerLab 對手角色 Runtime"
          src="https://assets.tappieapp.com/avatars/layerlab/casual/2026.07.30-m2.5b4r3a4b/index.html"
          allow="fullscreen; autoplay"
          scrolling="no"
          loading="eager"
          referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <div class="runtime-status" id="runtimeStatus">對手角色載入中</div>
      </div>

      <div class="player-foreground" aria-label="我方角色前景">
        <div class="player-depth-shadow"></div>
        <img src="./assets/player.png" alt="我方角色">
      </div>
      <div class="player-nameplate"><span>PLAYER</span><strong id="playerName">Damien</strong></div>

      <div class="arena-center-mark" aria-hidden="true"><i></i></div>
      <div class="arena-caption" id="arenaCaption">面對對手，準備開口</div>
    </section>

    <section class="control-deck">
      <div class="question-row">
        <div><span>Buildings · 第 <b id="questionNumber">1</b> 題</span><p>We are going to the <strong>museum</strong>.</p></div>
        <button class="audio-button" type="button" aria-label="播放題目">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9v6l5 3V6z"/></svg>
        </button>
      </div>

      <button class="record-button" id="recordButton" type="button"><i></i><span>開始錄音</span></button>

      <div class="skill-row">
        <div class="energy-block">
          <div class="energy-heading"><strong>招式能量</strong><span id="energyHint">完成 3 題即可使用</span></div>
          <div class="energy-pips" id="energyPips" aria-label="招式能量 0 / 3"><i></i><i></i><i></i></div>
        </div>
        <button class="skill-button" id="skillButton" type="button" disabled>
          <span>⚡</span><div><strong>重擊</strong><small>勝出得 2 分</small></div>
        </button>
      </div>
    </section>

    <div class="round-result" id="roundResult" aria-hidden="true">
      <div class="round-result-card"><span id="resultLabel">回合勝利</span><div><strong id="mySpeechScore">88</strong><b>:</b><strong id="enemySpeechScore">74</strong></div><p id="resultCopy">獲得 1 分</p></div>
    </div>

    <div class="skill-cutin" id="skillCutin" aria-hidden="true"><div class="skill-ray"></div><span>⚡</span><strong>重擊發動</strong><small>本回合勝出時獲得 2 分</small></div>

    <div class="end-sheet" id="endSheet" aria-hidden="true">
      <div class="end-card"><span>CHALLENGE CLEAR</span><h2>挑戰成功</h2><strong id="finalScore">3 : 1</strong><p>下一步將接入慶祝動畫與勝利寶箱。</p><button id="finishBattle" type="button">回到挑戰</button></div>
    </div>
  </main>

  <aside class="prototype-panel" aria-label="模型控制">
    <span>ARENA COMPOSITION GATE</span>
    <h2>回合測試</h2>
    <p>正式學生介面不會顯示此面板。</p>
    <button data-result="win">88：74　我方勝</button>
    <button data-result="tie">82：82　同分</button>
    <button data-result="lose">76：86　對手勝</button>
    <button id="resetBattle" class="muted">重設本場</button>
  </aside>

  <script src="./challenge.js?v=20260801-v03"></script>
</body>
</html>
