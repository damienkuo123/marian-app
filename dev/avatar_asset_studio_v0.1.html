<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tappie Avatar Asset Studio v0.1</title>
<style>
:root{--ink:#203448;--muted:#728498;--blue:#278ee4;--panel:#fff;--line:#dbe5ef;--bg:#edf4fb}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--ink);background:linear-gradient(145deg,#edf6ff,#f3efff);min-height:100vh}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}h1{font-size:18px;margin:0}.badge{padding:6px 10px;border-radius:999px;background:#eaf4ff;color:#2677bd;font-weight:800;font-size:11px}.layout{display:grid;grid-template-columns:minmax(460px,1.2fr) minmax(340px,.8fr);gap:16px;padding:16px;max-width:1400px;margin:auto}.card{background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.95);border-radius:24px;box-shadow:0 14px 35px rgba(55,83,111,.10);overflow:hidden}.card h2{font-size:15px;margin:0;padding:15px 17px;border-bottom:1px solid var(--line)}.stage-wrap{padding:16px}.stage-shell{position:relative;width:min(100%,720px);aspect-ratio:1;margin:auto;border-radius:22px;overflow:hidden;background:#f8fbff;border:1px solid var(--line);touch-action:none}.stage-shell svg{width:100%;height:100%;display:block}.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}button,.button{border:0;border-radius:14px;padding:11px 14px;font-weight:850;color:#3b5064;background:#e7eef6;cursor:pointer}.primary{color:white;background:linear-gradient(145deg,#39b9ff,#116ed6);box-shadow:0 4px 0 #1653a1}.green{color:white;background:linear-gradient(145deg,#55d4b5,#168f7c)}.gold{color:#583800;background:linear-gradient(145deg,#ffe37b,#f2b52c)}input,select{width:100%;height:42px;border:1px solid #ccd9e6;border-radius:12px;padding:0 10px;background:white;color:var(--ink);font-weight:700}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}.field label{display:block;margin:0 0 5px;font-size:10px;color:var(--muted);font-weight:900}.span2{grid-column:span 2}.tabs{display:flex;gap:7px;padding:11px 14px;border-bottom:1px solid var(--line);overflow:auto}.tab{white-space:nowrap;padding:8px 11px;border-radius:999px}.tab.active{background:#318fe0;color:white}.section{display:none}.section.active{display:block}.range-row{display:grid;grid-template-columns:1fr 80px;gap:8px;align-items:center}.range-row input[type=range]{padding:0}.hint{margin:0 14px 14px;padding:12px;border-radius:15px;background:#f0f6fc;color:#6e8194;font-size:11px;line-height:1.55}.test-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:14px}.test{aspect-ratio:1;border-radius:16px;background:#f6f9fd;overflow:hidden;border:1px solid var(--line)}.test svg{width:100%;height:100%}.drop{display:block;padding:13px;text-align:center;border:2px dashed #b9ccde;border-radius:16px;background:#f7fbff;color:#668096;font-size:12px;font-weight:800}.drop input{display:none}.status{padding:9px 14px;color:#668096;font-size:11px}.footer-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:14px;border-top:1px solid var(--line)}@media(max-width:900px){.layout{grid-template-columns:1fr;padding:10px}.stage-shell{max-height:65vh}.test-grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="top"><h1>Tappie Avatar Asset Studio</h1><span class="badge">v0.1 · 前端工具</span></header>
<main class="layout"><section class="card"><h2>512 × 512 標準化畫布</h2><div class="stage-wrap"><div class="stage-shell" id="stage"></div></div><div class="toolbar"><button id="editAsset" class="primary">編輯物件</button><button id="editLogo">編輯 Logo 槽</button><button id="snap">吸附錨點</button><button id="toggleGuides">顯示／隱藏基準線</button></div><p class="hint">拖曳畫布中的物件或 Logo 槽。物件會輸出為固定 512×512 SVG；Logo 槽只記錄在 manifest，前端會自動套入各校區既有 Logo。</p><h2>跨角色測試</h2><div class="test-grid" id="tests"></div></section>
<section class="card"><div class="tabs"><button class="tab active" data-tab="asset">物件</button><button class="tab" data-tab="logo">Logo 槽</button><button class="tab" data-tab="export">匯出</button></div>
<div class="section active" id="assetSec"><div class="fields"><label class="drop span2">上傳 SVG 物件<input type="file" id="svgFile" accept="image/svg+xml,.svg"></label><div class="field"><label>Asset ID</label><input id="assetId" value="hat-brand-cap-01"></div><div class="field"><label>顯示名稱</label><input id="assetName" value="校徽棒球帽"></div><div class="field"><label>分類</label><select id="category"><option value="headwear">headwear</option><option value="hair">hair</option><option value="top">top</option><option value="glasses">glasses</option><option value="frame">frame</option><option value="expression">expression</option></select></div><div class="field"><label>前後圖層</label><select id="layer"><option value="front">front</option><option value="back">back</option><option value="accessory">accessory</option></select></div><div class="field"><label>價格</label><input id="price" type="number" value="520"></div><div class="field"><label>z-index</label><input id="zIndex" type="number" value="80"></div><div class="field span2"><label>吸附錨點</label><select id="anchor"><option value="headwear">帽子／頭部</option><option value="eyes">眼睛</option><option value="top">上衣／胸口</option><option value="frame">頭像框</option><option value="free">自由位置</option></select></div><div class="field"><label>X</label><div class="range-row"><input id="x" type="range" min="0" max="512" value="256"><input id="xNum" type="number" value="256"></div></div><div class="field"><label>Y</label><div class="range-row"><input id="y" type="range" min="0" max="512" value="95"><input id="yNum" type="number" value="95"></div></div><div class="field"><label>Scale</label><div class="range-row"><input id="scale" type="range" min="0.05" max="3" step="0.01" value="0.68"><input id="scaleNum" type="number" step="0.01" value="0.68"></div></div><div class="field"><label>Rotation</label><div class="range-row"><input id="rotation" type="range" min="-180" max="180" value="0"><input id="rotationNum" type="number" value="0"></div></div><div class="field span2"><label><input id="flip" type="checkbox" style="width:auto;height:auto"> 水平翻轉</label></div></div></div>
<div class="section" id="logoSec"><div class="fields"><label class="drop span2">上傳校區 Logo 預覽<input type="file" id="logoFile" accept="image/*"></label><div class="field"><label>啟用 Logo Slot</label><select id="logoEnabled"><option value="true">啟用</option><option value="false">關閉</option></select></div><div class="field"><label>形狀</label><select id="logoShape"><option value="circle">circle</option><option value="roundrect">roundrect</option><option value="shield">shield</option></select></div><div class="field"><label>X</label><input id="logoX" type="number" value="256"></div><div class="field"><label>Y</label><input id="logoY" type="number" value="112"></div><div class="field"><label>寬度</label><input id="logoW" type="number" value="72"></div><div class="field"><label>高度</label><input id="logoH" type="number" value="72"></div><div class="field"><label>內距</label><input id="logoPadding" type="number" value="7"></div><div class="field"><label>旋轉</label><input id="logoRotation" type="number" value="0"></div></div></div>
<div class="section" id="exportSec"><div class="fields"><div class="field span2"><label>輸出路徑預覽</label><input id="pathPreview" readonly></div></div><p class="hint">ZIP 會包含標準化 SVG、manifest.json 與 README。將解壓後資料夾放入 <b>/assets/avatar/</b>，Renderer 依 manifest 讀取定位與 Logo 槽。</p><div class="footer-actions"><button id="downloadSvg">下載 SVG</button><button id="downloadJson">下載 manifest</button><button id="downloadZip" class="primary">下載資產 ZIP</button><button id="downloadPng">下載預覽 PNG</button></div></div><div class="status" id="status">已載入示範帽子。可直接拖曳或上傳自己的 SVG。</div></section></main>
<script>
const S={svg:'',viewBox:[0,0,512,512],x:256,y:95,scale:.68,rotation:0,flip:false,edit:'asset',guides:true,logoData:'',logo:{enabled:true,shape:'circle',x:256,y:112,w:72,h:72,padding:7,rotation:0}};
const demo=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 260"><path d="M80 190C92 65 169 17 262 17c105 0 181 58 190 173Z" fill="#F4B52D"/><path d="M72 187h390c24 0 36 22 18 35-57 39-138 47-237 34-82-11-140-28-184-49Z" fill="#D99318"/><path d="M138 93c51-48 133-61 199-31" fill="none" stroke="#fff" stroke-opacity=".32" stroke-width="24" stroke-linecap="round"/></svg>`;
S.svg=demo;
const anchors={headwear:[256,95],eyes:[256,230],top:[256,380],frame:[256,256],free:null};
function sanitize(text){const d=new DOMParser().parseFromString(text,'image/svg+xml'),root=d.documentElement;if(root.nodeName.toLowerCase()!=='svg')throw Error('不是有效 SVG');root.querySelectorAll('script,foreignObject,iframe,object,embed').forEach(n=>n.remove());root.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||(/^(href|xlink:href)$/i.test(a.name)&&/^https?:/i.test(a.value)))n.removeAttribute(a.name)}));const vb=(root.getAttribute('viewBox')||`0 0 ${root.getAttribute('width')||512} ${root.getAttribute('height')||512}`).trim().split(/[ ,]+/).map(Number);S.viewBox=vb.length===4&&vb.every(Number.isFinite)?vb:[0,0,512,512];root.removeAttribute('width');root.removeAttribute('height');return root.outerHTML;}
function assetInner(){const d=new DOMParser().parseFromString(S.svg,'image/svg+xml');return d.documentElement.innerHTML;}
function baseAvatar(skin='#D89168',hair='#333B49'){return `<g opacity=".38"><path d="M118 512c7-116 57-174 138-174s131 58 138 174" fill="#49AEE9"/><rect x="225" y="318" width="62" height="69" rx="25" fill="#B8664D"/><ellipse cx="142" cy="235" rx="31" ry="43" fill="${skin}"/><ellipse cx="370" cy="235" rx="31" ry="43" fill="${skin}"/><path d="M137 172c0-80 51-126 119-126s119 46 119 126v107c0 79-51 126-119 126s-119-47-119-126Z" fill="${skin}"/><path d="M145 171c-4-82 47-132 120-132 67 0 112 44 113 119-29-17-48-40-60-67-35 40-83 63-173 80Z" fill="${hair}"/><ellipse cx="214" cy="240" rx="26" ry="35" fill="white"/><ellipse cx="303" cy="240" rx="26" ry="35" fill="white"/><circle cx="221" cy="245" r="12" fill="#2d3138"/><circle cx="296" cy="245" r="12" fill="#2d3138"/></g>`}
function transform(){const [vx,vy,vw,vh]=S.viewBox,cx=vx+vw/2,cy=vy+vh/2,sx=S.flip?-S.scale:S.scale;return `translate(${S.x} ${S.y}) rotate(${S.rotation}) scale(${sx} ${S.scale}) translate(${-cx} ${-cy})`;}
function logoShape(id='slot'){const l=S.logo;if(!l.enabled)return'';const x=l.x-l.w/2,y=l.y-l.h/2,p=l.padding;let shape=l.shape==='roundrect'?`<rect x="${x}" y="${y}" width="${l.w}" height="${l.h}" rx="${Math.min(l.w,l.h)*.22}"/>`:l.shape==='shield'?`<path d="M${l.x} ${y} L${x+l.w} ${y+l.h*.22} L${x+l.w*.82} ${y+l.h*.82} L${l.x} ${y+l.h} L${x+l.w*.18} ${y+l.h*.82} L${x} ${y+l.h*.22}Z"/>`:`<ellipse cx="${l.x}" cy="${l.y}" rx="${l.w/2}" ry="${l.h/2}"/>`;let content=S.logoData?`<image href="${S.logoData}" x="${x+p}" y="${y+p}" width="${l.w-2*p}" height="${l.h-2*p}" preserveAspectRatio="xMidYMid meet" clip-path="url(#${id})"/>`:`<text x="${l.x}" y="${l.y+8}" text-anchor="middle" font-size="28" font-weight="900" fill="#176FCC">LOGO</text>`;return `<g transform="rotate(${l.rotation} ${l.x} ${l.y})"><defs><clipPath id="${id}">${shape}</clipPath></defs><g fill="white" stroke="#2d8ee1" stroke-width="3">${shape}</g>${content}<g fill="none" stroke="#ff6868" stroke-width="2" stroke-dasharray="7 5">${shape}</g></g>`}
function render(){const guides=S.guides?`<g stroke="#6f91b2" stroke-width="1.5" stroke-dasharray="8 7" opacity=".45"><path d="M256 0v512M0 256h512"/><path d="M0 95h512M0 230h512M0 380h512"/></g><g fill="#65809b" font-size="12" font-weight="700"><text x="8" y="91">HEAD</text><text x="8" y="226">EYES</text><text x="8" y="376">TOP</text></g>`:'';document.getElementById('stage').innerHTML=`<svg id="canvasSvg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#f9fcff"/>${baseAvatar()}${guides}<g id="assetG" transform="${transform()}">${assetInner()}</g>${logoShape('stageLogo')}</svg>`;renderTests();updatePath();}
function renderTests(){const variants=[['#71423C','#392C34'],['#9A5A42','#283443'],['#D89168','#4B2F2B'],['#F2B88D','#333B49']];document.getElementById('tests').innerHTML=variants.map((v,i)=>`<div class="test"><svg viewBox="0 0 512 512"><rect width="512" height="512" fill="#f8fbff"/>${baseAvatar(...v)}<g transform="${transform()}">${assetInner()}</g>${logoShape('testLogo'+i)}</svg></div>`).join('')}
function bindPair(range,num,key){const r=document.getElementById(range),n=document.getElementById(num);function set(v){S[key]=Number(v);r.value=S[key];n.value=S[key];render()}r.oninput=e=>set(e.target.value);n.oninput=e=>set(e.target.value)}bindPair('x','xNum','x');bindPair('y','yNum','y');bindPair('scale','scaleNum','scale');bindPair('rotation','rotationNum','rotation');
document.getElementById('flip').onchange=e=>{S.flip=e.target.checked;render()};document.getElementById('anchor').onchange=()=>{};document.getElementById('snap').onclick=()=>{const a=anchors[document.getElementById('anchor').value];if(a){S.x=a[0];S.y=a[1];sync();render()}};document.getElementById('toggleGuides').onclick=()=>{S.guides=!S.guides;render()};document.getElementById('editAsset').onclick=()=>{S.edit='asset';document.getElementById('editAsset').classList.add('primary');document.getElementById('editLogo').classList.remove('primary')};document.getElementById('editLogo').onclick=()=>{S.edit='logo';document.getElementById('editLogo').classList.add('primary');document.getElementById('editAsset').classList.remove('primary')};
function sync(){for(const k of ['x','y','scale','rotation']){document.getElementById(k).value=S[k];document.getElementById(k+'Num').value=S[k]}}
let drag=null;document.getElementById('stage').addEventListener('pointerdown',e=>{const r=e.currentTarget.getBoundingClientRect();drag={x:e.clientX,y:e.clientY,startX:S.edit==='logo'?S.logo.x:S.x,startY:S.edit==='logo'?S.logo.y:S.y,ratio:512/r.width};e.currentTarget.setPointerCapture(e.pointerId)});document.getElementById('stage').addEventListener('pointermove',e=>{if(!drag)return;const nx=drag.startX+(e.clientX-drag.x)*drag.ratio,ny=drag.startY+(e.clientY-drag.y)*drag.ratio;if(S.edit==='logo'){S.logo.x=Math.round(nx);S.logo.y=Math.round(ny);syncLogo()}else{S.x=Math.round(nx);S.y=Math.round(ny);sync()}render()});document.getElementById('stage').addEventListener('pointerup',()=>drag=null);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(b.dataset.tab+'Sec').classList.add('active')});
document.getElementById('svgFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{S.svg=sanitize(await f.text());document.getElementById('status').textContent=`已載入 ${f.name}`;render()}catch(err){alert(err.message)}};document.getElementById('logoFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{S.logoData=rd.result;render()};rd.readAsDataURL(f)};
function syncLogo(){for(const [id,k] of [['logoX','x'],['logoY','y'],['logoW','w'],['logoH','h'],['logoPadding','padding'],['logoRotation','rotation']])document.getElementById(id).value=S.logo[k]}
for(const [id,k] of [['logoX','x'],['logoY','y'],['logoW','w'],['logoH','h'],['logoPadding','padding'],['logoRotation','rotation']])document.getElementById(id).oninput=e=>{S.logo[k]=Number(e.target.value);render()};document.getElementById('logoEnabled').onchange=e=>{S.logo.enabled=e.target.value==='true';render()};document.getElementById('logoShape').onchange=e=>{S.logo.shape=e.target.value;render()};
function assetId(){return(document.getElementById('assetId').value||'avatar-asset').trim().replace(/[^a-zA-Z0-9_-]+/g,'-')};function category(){return document.getElementById('category').value};function normalizedSvg(){return `<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><g id="asset-content" transform="${transform()}">${assetInner()}</g></svg>`};function manifest(){return{id:assetId(),name:document.getElementById('assetName').value,category:category(),price:Number(document.getElementById('price').value)||0,layer:document.getElementById('layer').value,zIndex:Number(document.getElementById('zIndex').value)||0,canvas:{width:512,height:512},anchor:document.getElementById('anchor').value,transform:{x:S.x,y:S.y,scale:S.scale,rotation:S.rotation,flipX:S.flip},files:{svg:`${category()}/${assetId()}.svg`},logoSlot:S.logo.enabled?{x:S.logo.x,y:S.logo.y,width:S.logo.w,height:S.logo.h,shape:S.logo.shape,padding:S.logo.padding,rotation:S.logo.rotation}:null,studioVersion:'0.1.0'}}function updatePath(){document.getElementById('pathPreview').value=`/assets/avatar/${category()}/${assetId()}.svg`}
['assetId','category'].forEach(id=>document.getElementById(id).addEventListener('input',updatePath));function dl(name,data,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}document.getElementById('downloadSvg').onclick=()=>dl(assetId()+'.svg',normalizedSvg(),'image/svg+xml');document.getElementById('downloadJson').onclick=()=>dl('manifest.json',JSON.stringify(manifest(),null,2),'application/json');
const crcTable=(()=>{let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();function crc32(bytes){let c=0xffffffff;for(const b of bytes)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0}function u16(v){return new Uint8Array([v&255,(v>>>8)&255])}function u32(v){return new Uint8Array([v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255])}function cat(...arr){let l=arr.reduce((s,a)=>s+a.length,0),o=new Uint8Array(l),p=0;for(const a of arr){o.set(a,p);p+=a.length}return o}function zip(files){const enc=new TextEncoder(),locals=[],centrals=[];let offset=0;for(const [name,text] of files){const nb=enc.encode(name),data=enc.encode(text),crc=crc32(data),local=cat(u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nb.length),u16(0),nb,data);locals.push(local);centrals.push(cat(u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nb.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),nb));offset+=local.length}const central=cat(...centrals),localAll=cat(...locals),end=cat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(central.length),u32(localAll.length),u16(0));return cat(localAll,central,end)}
document.getElementById('downloadZip').onclick=()=>{const m=manifest(),files=[[`${category()}/${assetId()}.svg`,normalizedSvg()],['manifest.json',JSON.stringify(m,null,2)],['README.txt',`Tappie Avatar Asset Pack\nAsset: ${m.id}\nPlace this folder under /assets/avatar/ and register manifest.json.\nLogo artwork is not embedded; the school logo is injected at runtime using logoSlot.\n`]];const blob=new Blob([zip(files)],{type:'application/zip'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=assetId()+'_avatar_asset.zip';a.click()};document.getElementById('downloadPng').onclick=()=>{const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#f8fbff"/>${baseAvatar()}<g transform="${transform()}">${assetInner()}</g>${logoShape('pngLogo')}</svg>`,img=new Image(),url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=512;c.getContext('2d').drawImage(img,0,0);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=assetId()+'_preview.png';a.click()});URL.revokeObjectURL(url)};img.src=url};
render();sync();syncLogo();
</script></body></html>
